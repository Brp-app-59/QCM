 du Peuple français","Au nom de la République"],"a":1,"c":"s","e":"Les décisions des juridictions administratives sont rendues « au nom du peuple français »."},{"id":"2024-12","s":"2024","n":12,"d":"CAJ","q":"Dans le cadre d'un retrait d'une décision créatrice de droits, l'administration à l'obligation :","o":["d'indemniser le bénéficiaire de la décision retirée","de recueillir l'avis du bénéficiaire de la décision retirée","de motiver sa décision de retrait"],"a":2,"c":"s","e":"Le retrait d'une décision créatrice de droits doit être motivé (art. L. 211-2 CRPA)."},{"id":"2024-13","s":"2024","n":13,"d":"CAJ","q":"Vous participez à la rédaction d'un projet d'ordonnance. Après sa ratification par le Parlement cette ordonnance aura une valeur :","o":["constitutionnelle","législative","règlementaire"],"a":1,"c":"s","e":"Une ordonnance ratifiée acquiert valeur législative (art. 38 C)."},{"id":"2024-14","s":"2024","n":14,"d":"CAJ","q":"L'initiative de la loi appartient :","o":["au Gouvernement et aux députés","aux députés et aux sénateurs","au Gouvernement et aux parlementaires"],"a":2,"c":"s","e":"Art. 39 C : l'initiative des lois appartient concurremment au Premier ministre et aux membres du Parlement."},{"id":"2024-15","s":"2024","n":15,"d":"CAJ","q":"Une proposition de loi peut être soumise par :","o":["le Gouvernement","un ou plusieurs parlementaires","le Gouvernement ou des parlementaires"],"a":1,"c":"s","e":"Une proposition de loi émane d'un ou plusieurs parlementaires. Le Gouvernement dépose des projets de loi."},{"id":"2024-16","s":"2024","n":16,"d":"CAJ","q":"Quel texte ne fait pas partie du bloc de constitutionnalité ?","o":["Les lois constitutionnelles de 1875","Le Préambule de la Constitution de 1946","La Charte de l'environnement de 2004"],"a":0,"c":"s","e":"Les lois constitutionnelles de 1875 (IIIe République) ne font pas partie du bloc de constitutionnalité."},{"id":"2024-17","s":"2024","n":17,"d":"CAJ","q":"Le contrôle de constitutionnalité est obligatoire pour :","o":["les décrets en Conseil d'Etat","les lois organiques","les traités internationaux"],"a":1,"c":"s","e":"Le contrôle de constitutionnalité est obligatoire pour les lois organiques et les règlements des assemblées (art. 61 C)."},{"id":"2024-18","s":"2024","n":18,"d":"CAJ","q":"Les lois de finances, de financement de la sécurité sociale et de programmation, qui déterminent les objectifs de l'action de l'Etat, sont :","o":["des lois ordinaires","des lois organiques","des lois constitutionnelles"],"a":0,"c":"s","e":"Lois de finances, LFSS et lois de programmation sont des lois ordinaires, adoptées selon des procédures spécifiques. Les lois organiques (LOLF, LOLFSS) les encadrent."},{"id":"2024-19","s":"2024","n":19,"d":"CAJ","q":"Une loi organique permet de :","o":["modifier plus rapidement certains articles de la Constitution","préciser l'application de certains articles de la Constitution qui le prévoient","préparer les lois constitutionnelles"],"a":1,"c":"s","e":"La loi organique précise les modalités d'application d'articles de la Constitution qui y renvoient."},{"id":"2024-20","s":"2024","n":20,"d":"CAJ","q":"Depuis sa rédaction initiale en 1958, la Constitution a été révisée :","o":["7 fois","15 fois","plus de 20 fois"],"a":2,"c":"s","e":"La Constitution a été révisée 24 fois à la date du sujet (25e révision en mars 2024 : IVG)."},{"id":"2024-21","s":"2024","n":21,"d":"CAJ","q":"L'article 66 de la Constitution désigne comme gardien de la liberté individuelle :","o":["l'autorité judiciaire","le Conseil constitutionnel","l'autorité administrative"],"a":0,"c":"s","e":"Art. 66 C : l'autorité judiciaire est gardienne de la liberté individuelle."},{"id":"2024-22","s":"2024","n":22,"d":"CAJ","q":"Quelle collectivité territoriale fait-elle l'objet d'un titre spécifique dans la Constitution de 1958 ?","o":["La Corse","Mayotte","La Nouvelle-Calédonie"],"a":2,"c":"s","e":"La Nouvelle-Calédonie fait l'objet d'un titre spécifique (titre XIII)."},{"id":"2024-23","s":"2024","n":23,"d":"CAJ","q":"Une réserve d'interprétation du Conseil constitutionnel :","o":["est une précision sans valeur juridique d'une décision du Conseil constitutionnel","fait partie intégrante du dispositif et des motifs des décisions du Conseil constitutionnel","est une question qui sera réglée par saisine du Conseil constitutionnel après mise en application de la loi"],"a":1,"c":"s","e":"Les réserves d'interprétation font corps avec la décision et ont l'autorité de chose jugée (art. 62 C)."},{"id":"2024-24","s":"2024","n":24,"d":"CAJ","q":"Vous êtes responsable au sein d'un bureau en charge du contentieux. Un référé liberté a été introduit à l'encontre d'un acte émanant de votre administration. Vous informez votre hiérarchie que le juge administratif doit se prononcer dans un délai de :","o":["24 heures","72 heures","48 heures"],"a":2,"c":"s","e":"Référé-liberté : le juge statue dans les 48 heures (art. L. 521-2 CJA)."},{"id":"2024-25","s":"2024","n":25,"d":"CAJ","q":"Vous êtes en charge du recrutement dans une préfecture de plus de 20 agents et votre supérieur hiérarchique vous interroge sur les obligations relatives aux bénéficiaires de l'obligation d'emploi de travailleurs handicapés (BOETH). Vous lui répondez que :","o":["6% des recrutements effectués au cours de l'année doit être réservé aux BOETH","6% des effectifs totaux de la préfecture doit être réservé aux BOETH","6% des crédits de masse salariale doit être déployé pour des BOETH"],"a":1,"c":"s","e":"Obligation d'emploi de 6 % de l'effectif total (employeurs d'au moins 20 agents)."},{"id":"2024-26","s":"2024","n":26,"d":"CAJ","q":"Tout agent public, sans distinction, doit exercer ses fonctions avec honnêteté et désintéressement et ne doit pas utiliser ses fonctions pour en tirer un profit personnel. Il s'agit de l'obligation :","o":["de probité de l'agent public","d'impartialité de l'agent public","de dignité de l'agent public"],"a":0,"c":"s","e":"L'obligation de probité impose honnêteté et désintéressement."},{"id":"2024-27","s":"2024","n":27,"d":"CAJ","q":"La loi n° 2019-828 du 6 août 2019 relative à la transformation de la fonction publique institue l'obligation d'élaborer annuellement un rapport social unique (RSU) qui reprend :","o":["les données qui figuraient jusqu'alors dans le bilan social et les rapports portant sur la santé et la sécurité au travail uniquement","les données qui figuraient jusqu'alors dans le bilan social, les rapports portant sur la santé et la sécurité au travail et le rapport de situation comparée relatif à l'égalité femmes-hommes","les données qui figuraient jusqu'alors dans le bilan social, les rapports portant sur la santé et la sécurité au travail, le rapport de situation comparée relatif à l'égalité femmes-hommes et le rapport d'activité de l'établissement"],"a":1,"c":"s","e":"Le RSU (loi de 2019) regroupe bilan social, rapports santé et sécurité au travail et rapport de situation comparée femmes-hommes."},{"id":"2024-28","s":"2024","n":28,"d":"CAJ","q":"Les commissions administratives paritaires sont consultées par l'administration sur :","o":["les décisions individuelles de mutation, de mobilité, d'avancement et de promotion interne des agents","l'adoption des lignes directrices de gestion","l'examen des décisions individuelles défavorables"],"a":2,"c":"s","e":"Depuis la loi de 2019, les CAP examinent les décisions individuelles défavorables (plus les mutations ni les promotions)."},{"id":"2024-29","s":"2024","n":29,"d":"CAJ","q":"En qualité de responsable du contrôle de gestion d'un rectorat, votre supérieur hiérarchique vous demande si les agents entrant en détachement au sein du rectorat sont décomptés de votre plafond d'emploi. Vous lui répondez :","o":["oui, les détachements entrants sont décomptés au sein du plafond d'emploi de la structure d'accueil","oui, sauf pour les détachements d'une durée inférieure à un an","non, les détachements entrants sont décomptés au sein du plafond d'emploi de la structure d'origine"],"a":0,"c":"s","e":"Les agents détachés sont décomptés dans le plafond d'emplois de la structure d'accueil, qui les rémunère."},{"id":"2024-30","s":"2024","n":30,"d":"CAJ","q":"Avec la création du code général de la fonction publique, entré en vigueur le 1er mars 2022, le statut général des fonctionnaires :","o":["ne comprend plus les spécificités propres à chacun des trois versants de la fonction publique","a été consolidé","a été rendu modifiable par décret"],"a":1,"c":"s","e":"Le CGFP (1er mars 2022) consolide, à droit constant, le statut général des trois versants."},{"id":"2024-31","s":"2024","n":31,"d":"CAJ","q":"Vous êtes un agent en situation de handicap et souhaitez bénéficier de la reconnaissance de la qualité de travailleur handicapé (RQTH). Qui vous en accorde le bénéfice ?","o":["La commission des droits et de l'autonomie des personnes handicapées (CDAPH) de votre résidence","La médecine du travail de votre administration","Le référent handicap de votre administration"],"a":0,"c":"s","e":"La RQTH est attribuée par la CDAPH, au sein de la MDPH du lieu de résidence."},{"id":"2024-32","s":"2024","n":32,"d":"CAJ","q":"La mise à disposition permet au fonctionnaire de :","o":["cesser temporairement de travailler tout en conservant la possibilité de réintégrer son corps d'origine","travailler auprès d'un autre employeur que son administration tout en restant rattaché à son administration d'origine pour ce qui concerne sa carrière et sa rémunération","être placé temporairement auprès d'un autre employeur public pour appréhender la réalité d'un métier et d'un nouvel environnement professionnel"],"a":1,"c":"s","e":"Mise à disposition : l'agent travaille ailleurs mais reste rattaché à son administration d'origine (carrière et rémunération)."},{"id":"2024-33","s":"2024","n":33,"d":"CAJ","q":"Dans le cadre du dialogue social, les questions relatives à la politique indemnitaire conduite par le ministère chargé de l'éducation nationale sont examinées en :","o":["commission administrative paritaire","comité social d'administration","conseil supérieur de l'éducation"],"a":1,"c":"s","e":"La politique indemnitaire relève du comité social d'administration (CSA)."},{"id":"2024-34","s":"2024","n":34,"d":"CAJ","q":"Le congé de formation professionnelle permet à un agent public de :","o":["cesser totalement son activité professionnelle pour suivre une formation, sans bénéficier d'aucune rémunération","cesser totalement son activité professionnelle pour suivre une formation en ayant la possibilité de bénéficier d'une indemnité mensuelle forfaitaire pendant une période maximale de 5 ans","cesser totalement son activité professionnelle pour suivre une formation en ayant la possibilité de bénéficier d'une indemnité mensuelle forfaitaire pendant la 1ère année de congé"],"a":2,"c":"s","e":"Congé de formation professionnelle : indemnité mensuelle forfaitaire (85 % du traitement) pendant les 12 premiers mois."},{"id":"2024-35","s":"2024","n":35,"d":"CAJ","q":"Le contrat de projet permet de recruter un agent public :","o":["dans le cadre d'un contrat à durée indéterminée (CDI) pour réaliser un projet ou une opération spécifique","dans le cadre d'un contrat à durée déterminée (CDD) pour réaliser un projet ou une opération spécifique","dans le cadre d'un contrat à durée déterminée (CDD) qui peut être transformé en contrat à durée indéterminée (CDI) pour réaliser un projet ou une opération spécifique"],"a":1,"c":"s","e":"Contrat de projet : CDD de 1 à 6 ans, non transformable en CDI."},{"id":"2024-36","s":"2024","n":36,"d":"CAJ","q":"L'indemnité de fin de contrat, appelée prime de précarité, peut être versée :","o":["aux seuls agents contractuels de droit privé en fin de contrat","à tout agent contractuel de droit public en fin de contrat","aux agents contractuels de droit public en fin de contrat remplissant certaines conditions liées à la durée du contrat et à la rémunération"],"a":2,"c":"s","e":"Indemnité de fin de contrat (depuis 2021) : pour les contrats de 1 an maximum et sous un plafond de rémunération (2 SMIC)."},{"id":"2024-37","s":"2024","n":37,"d":"CAJ","q":"La section des études, de la prospective et de la coopération du Conseil d'Etat à plusieurs missions dont notamment celle :","o":["de veiller à l'exécution des décisions de justice du Conseil d'État","d'instance en dernier appel des décisions précédemment rendues par le Conseil d'Etat","d'instance d'appel de l'Association des Conseils d'État et des juridictions administratives suprêmes de l'Union européenne (ACA-Europe)"],"a":0,"c":"s","e":"La section des études, de la prospective et de la coopération veille notamment à l'exécution des décisions de la juridiction administrative."},{"id":"2024-38","s":"2024","n":38,"d":"CAJ","q":"Le Haut Conseil de l'évaluation de la recherche et de l'enseignement supérieur (Hcéres) est une autorité publique indépendante (API) en charge de :","o":["l'évaluation des chercheurs et enseignants chercheurs français","la notation et du classement de l'ensemble des laboratoires français","l'évaluation de l'ensemble des établissements de l'enseignement supérieur et de la recherche"],"a":2,"c":"s","e":"Le Hcéres évalue les établissements d'enseignement supérieur et de recherche (et leurs formations, unités)."},{"id":"2024-39","s":"2024","n":39,"d":"CAJ","q":"Vous êtes chargé(e) du contrôle budgétaire et de légalité au sein d'un rectorat. Vous constatez qu'un acte est entaché d'illégalité pour une université présente au sein de l'académie. Vous informez votre supérieur que le recteur chancelier des universités :","o":["est incompétent pour la demande d'annulation de cet acte","va pouvoir saisir le juge administratif d'une demande d'annulation","va pouvoir annuler l'acte de l'établissement concerné"],"a":1,"c":"s","e":"Le recteur chancelier exerce le contrôle de légalité des actes des universités et peut saisir le juge administratif."},{"id":"2024-40","s":"2024","n":40,"d":"CAJ","q":"La réforme de l'encadrement supérieur ologique à hauteur de :","o":["7 milliards d'euros","17 milliards d'euros","10 milliards d'euros"],"a":0,"c":"p","e":"Le PLF 2024 prévoyait 7 Md€ supplémentaires en faveur de la planification écologique."},{"id":"2024-61","s":"2024","n":61,"d":"FP","q":"Dans le cadre de la loi organique relative aux lois de finances (LOLF), le contrôleur budgétaire et comptable ministériel (CBCM) exerce son pouvoir de visa sur la soutenabilité des engagements pris par des ordonnateurs lors de son contrôle budgétaire au niveau :","o":["d'une mission","d'un programme","d'une action"],"a":1,"c":"p","e":"Le contrôle budgétaire du CBCM porte sur la soutenabilité de la programmation au niveau du programme (et des BOP)."},{"id":"2024-62","s":"2024","n":62,"d":"FP","q":"Pour l'adoption annuelle des lois de financement de la sécurité sociale, la Constitution fixe au Parlement un délai de :","o":["50 jours","70 jours","45 jours"],"a":0,"c":"s","e":"Art. 47-1 C : le Parlement dispose de 50 jours pour la LFSS (70 jours pour la loi de finances)."},{"id":"2024-63","s":"2024","n":63,"d":"FP","q":"La liquidation de la dépense publique a pour objet de :","o":["donner l'ordre de payer la dette","constater ou créer une obligation pour la personne publique","vérifier la réalité de la dette et d'arrêter le montant de la dépense"],"a":2,"c":"s","e":"Liquidation : vérifier la réalité de la dette et arrêter son montant. B = engagement ; A = ordonnancement."},{"id":"2024-64","s":"2024","n":64,"d":"FP","q":"La loi de finances prévue à l'article 34 de la loi organique relative aux lois de finances (LOLF) se décompose en :","o":["3 parties","2 parties","5 parties"],"a":1,"c":"s","e":"La loi de finances comporte deux parties : conditions de l'équilibre (recettes) et moyens des politiques publiques (dépenses)."},{"id":"2024-65","s":"2024","n":65,"d":"FP","q":"La fongibilité asymétrique implique que les crédits de personnel peuvent :","o":["abonder un autre titre du programme","être augmentés par des crédits rele n européenne (UE), adoptée en 2022, affirme :","o":["le principe de réduction des déficits publics dans chaque État membre de la zone euro","les grandes orientations en matière de stratégie et de défense de l'Union européenne (UE) à horizon 2030","les modalités futures de l'élargissement de l'Union européenne (UE)"],"a":1,"c":"s","e":"La boussole stratégique (2022) fixe les orientations de sécurité et de défense de l'UE à l'horizon 2030."},{"id":"2024-82","s":"2024","n":82,"d":"UE","q":"En vertu des traités, la règle générale de décision, en matière de politique étrangère et de sécurité commune (PESC), est :","o":["le consensus","la majorité qualifiée","l'unanimité"],"a":2,"c":"s","e":"En matière de PESC, la règle générale est l'unanimité (art. 31 TUE)."},{"id":"2024-83","s":"2024","n":83,"d":"UE","q":"La juridiction de la Cour européenne des droits de l'Homme ne s'étend pas sur :","o":["la Suisse","la Biélorussie","l'Azerbaïdjan"],"a":1,"c":"s","e":"La Biélorussie n'est pas partie à la CEDH. La Suisse et l'Azerbaïdjan le sont."},{"id":"2024-84","s":"2024","n":84,"d":"UE","q":"Les pays et territoires d'outre-mer (PTOM) :","o":["font partie intégrante de l'Union européenne (UE)","ne font pas partie intégrante de l'Union européenne (UE)","ne font pas partie intégrante de l'Union européenne (UE), mais doivent au moins en respecter le droit"],"a":1,"c":"s","e":"Les PTOM ne font pas partie intégrante de l'UE. Ils y sont associés, et le droit de l'Union ne s'y applique pas en principe."},{"id":"2024-85","s":"2024","n":85,"d":"UE","q":"En matière d'aide publique au développement, l'Union européenne et ses Etats membres sont :","o":["le premier donateur mondial","le deuxième donateur mondial après les États-Unis","le troisième donateur mondial après les États-Unis et la Chine"],"a":0,"c":"s","e":"L'UE et ses États membres sont le premier donateur mondial d'aide publique au développement."},{"id":"2024-86","s":"2024","n":86,"d":"UE","q":"La politique commerciale de l'Union européenne est une compétence :","o":["partagée entre l'Union et les Etats membres","exclusive de l'Union","d'appui de l'Union"],"a":1,"c":"s","e":"La politique commerciale commune est une compétence exclusive (art. 3 TFUE)."},{"id":"2024-87","s":"2024","n":87,"d":"UE","q":"Quel est le domaine d'activité du programme européen LIFE ?","o":["la préservation de la biodiversité","les enjeux de sécurité numérique","les enjeux de santé publique"],"a":0,"c":"s","e":"LIFE est le programme de l'UE pour l'environnement et l'action climatique, dont la nature et la biodiversité."},{"id":"2024-88","s":"2024","n":88,"d":"UE","q":"La Cour européenne des droits de l'Homme (CEDH) peut être saisie par :","o":["tout Etat signataire de la CEDH, la Commission européenne et par un recours individuel formé par toute personne s'estimant victime d'une violation de la convention par un Etat signataire","tout Etat signataire de la CEDH et par un recours individuel formé par toute personne souhaitant dénoncer une violation de la convention par un Etat signataire","tout Etat signataire de la CEDH constatant un manquement imputable à un autre Etat signataire et par un recours individuel formé par toute personne s'estimant victime d'une violation de la convention par un Etat signataire"],"a":2,"c":"s","e":"La CEDH peut être saisie par un État partie contre un autre État (requête interétatique) ou par une victime (requête individuelle)."},{"id":"2024-89","s":"2024","n":89,"d":"UE","q":"La charte des droits fondamentaux de l'Union européenne, adoptée en 2000 :","o":["n'a pas de valeur contraignante","à une valeur contraignante depuis l'entrée en vigueur du traité de Lisbonne","s'applique de manière différenciée dans les Etats membres de l'Union européenne, en fonction de leur date d'adhésion"],"a":1,"c":"s","e":"La Charte est contraignante depuis l'entrée en vigueur du traité de Lisbonne (2009)."},{"id":"2024-90","s":"2024","n":90,"d":"NUM","q":"Qu'est-ce qu'un logiciel libre (\"open source\" en anglais) ?","o":["Un logiciel dont le code source est libre d'accès, réutilisable et modifiable","Un logiciel agréé par l'Agence nationale de la sécurité des systèmes d'information (ANSSI)","Un logiciel qui ne comporte pas d'éléments permettant d'espionner ses utilisateurs"],"a":0,"c":"s","e":"Logiciel libre : code source accessible, réutilisable et modifiable."},{"id":"2024-91","s":"2024","n":91,"d":"NUM","q":"À compte du 28 décembre 2024, quel type de chargeur universel est rendu obligatoire par la directive 2022/2380/UE, notamment pour les téléphones portables ?","o":["Universal serial bus de Type-A","Universal serial bus de Type-C","Lightning"],"a":1,"c":"s","e":"La directive 2022/2380 impose l'USB-C comme chargeur universel à partir du 28 décembre 2024."},{"id":"2024-92","s":"2024","n":92,"d":"NUM","q":"Que désigne-t-on par la notion d'interopérabilité ?","o":["La capacité des systèmes de pouvoir fonctionner avec d'autres produits ou systèmes informatiques sans restriction d'accès ou de mise en œuvre","La capacité d'une plateforme numérique à pouvoir gérer de nombreuses demandes contradictoires","Le fait pour plusieurs administrations de mettre leurs ressources en commun afin de diminuer les coûts de développement d'une solution informatique"],"a":0,"c":"s","e":"L'interopérabilité est la capacité de systèmes à fonctionner ensemble, sans restriction d'accès ou de mise en œuvre."},{"id":"2024-93","s":"2024","n":93,"d":"NUM","q":"Qu'est-ce que le publipostage ?","o":["Des publicités ciblées incluses dans les pages internet lors de la navigation d'un utilisateur","Le fait de publier une page internet ou intranet pour la rendre accessible","Une méthode informatique pour envoyer simplement des courriers ou courriels personnalisés à un nombre important de destinataires"],"a":2,"c":"s","e":"Le publipostage (mailing) permet d'envoyer des courriers personnalisés en nombre."},{"id":"2024-94","s":"2024","n":94,"d":"NUM","q":"Que signifie l'expression « respecter la casse » en informatique ?","o":["Respecter les majuscules et les minuscules des mots","Respecter la mise en forme d'un paragraphe","Respecter l'ordre de numérotations des différents items"],"a":0,"c":"s","e":"Respecter la casse, c'est respecter les majuscules et les minuscules."},{"id":"2024-95","s":"2024","n":95,"d":"NUM","q":"Qu'est-ce qu'un entrepôt de données (« Data Warehouse » en anglais) ?","o":["Un système de sauvegarde automatique des serveurs en cas de panne","Une base de données utilisée pour collecter et analyser des données","Le lieu où sont stockés les ordinateurs hors d'usage avant leur destruction pour des raisons de sécurité"],"a":1,"c":"s","e":"Un entrepôt de données (data warehouse) centralise les données pour l'analyse et le décisionnel."},{"id":"2024-96","s":"2024","n":96,"d":"NUM","q":"Que signifie HTTPS?","o":["Hyper Text Transfer Protocol Secure","Hight Transfer Protocol Permanent Security","Hight Telecommunication Transfer Protocol State"],"a":0,"c":"s","e":"HTTPS = HyperText Transfer Protocol Secure."},{"id":"2024-97","s":"2024","n":97,"d":"NUM","q":"Qu'est-ce qu'une métadonnée ?","o":["Un ensemble de données occupant un volume de stockage important","Les données permettant le bon fonctionnement des serveurs","Une donnée venant décrire ou définir une autre donnée ou un document"],"a":2,"c":"s","e":"Une métadonnée est une donnée qui décrit une autre donnée (auteur, date, format…)."},{"id":"2024-98","s":"2024","n":98,"d":"NUM","q":"Le maire d'une petite commune de votre département souhaite savoir s'il doit désigner un délégué à la protection des données. Que lui répondez-vous ?","o":["Un délégué à la protection des données n'est pas obligatoire pour les petites communes de moins de 2000 habitants","Il est obligatoire d'en désigner un","L'article 37 du règlement général sur la protection des données (RGPD) prévoit que le maire est obligatoirement délégué à la protection des données de sa commune"],"a":1,"c":"s","e":"Le DPO est obligatoire pour tout organisme public, y compris les petites communes (mutualisation possible)."},{"id":"2024-99","s":"2024","n":99,"d":"NUM","q":"Que recouvre notamment la notion de NFT (non-fungible tokens, en français \"jetons non fongibles\") ?","o":["Une méthode d'attaque informatique basée sur les jeux de hasard","La désignation d'une des monnaies virtuelles","Un moyen de rendre un fichier informatique unique"],"a":2,"c":"s","e":"Un NFT est un jeton unique sur une blockchain, qui certifie l'authenticité d'un fichier numérique."},{"id":"2024-100","s":"2024","n":100,"d":"NUM","q":"Vous venez de prendre votre poste au sein d'une préfecture. L'administration vous demande des informations personnelles afin de traiter votre dossier administratif en vue de gérer votre carrière et vous rémunérer, mais vous ne souhaitez pas donner votre statut marital. Pouvez-vous vous y opposer ?","o":["Oui, l'administration doit obtenir votre accord pour recueillir des informations personnelles vous concernant","Non, l'administration est autorisée à recueillir ces informations et vous ne devez pas vous y opposer","Oui, cette information ne fait pas partie des informations pouvant être recueillies par l'administration"],"a":1,"c":"s","e":"L'administration peut collecter les données nécessaires à la gestion de la carrière et de la paie (base légale : obligation légale / mission)."},{"id":"2024-101","s":"2024","n":101,"d":"NUM","q":"Qu'est-ce que data.gouv.fr ?","o":["Le site internet de gestion des licences et des applications administratives","Le site internet de la direction de l'amélioration et de la transition administrative","La plateforme de diffusion des données publiques de l'État français"],"a":2,"c":"s","e":"data.gouv.fr est la plateforme ouverte des données publiques françaises."},{"id":"2024-102","s":"2024","n":102,"d":"NUM","q":"Qu'est-ce que l'allocation forfaitaire de télétravail ?","o":["Un temps minimal consacré au télétravail","Une indemnisation des frais liés à la pratique du télétravail","Une prime liée à la manière de servir durant le télétravail"],"a":1,"c":"s","e":"Le forfait télétravail indemnise les frais liés au télétravail."},{"id":"2024-103","s":"2024","n":103,"d":"NUM","q":"Quel est le rôle de l'ARCEP ?","o":["La régulation de la consommation électrique des professionnels","La réception des communications électroniques et postales","La régulation des communications électroniques, des postes et de la distribution de la presse"],"a":2,"c":"s","e":"L'ARCEP régule les communications électroniques, les postes et la distribution de la presse."},{"id":"2024-104","s":"2024","n":104,"d":"NUM","q":"Qu'appelle-t-on communément le numéro d'inscription au répertoire national d'identification des personnes physiques ?","o":["Le numéro figurant sur la carte d'identité d'une personne","Le numéro de sécurité sociale d'une personne","Le numéro d'identification d'une personne au registre des sociétés"],"a":1,"c":"s","e":"Le NIR est le « numéro de sécurité sociale »."},{"id":"2024-105","s":"2024","n":105,"d":"NUM","q":"Que recouvre l'acronyme RIE ?","o":["Réseau internet de l'État à très haut débit","Réseau intranet commun à toutes les fonctions publiques","Réseau interministériel de l'État qui réunit et raccorde l'ensemble des flux et réseaux informatiques de l'État"],"a":2,"c":"s","e":"Le RIE est le réseau interministériel de l'État."},{"id":"2024-106","s":"2024","n":106,"d":"NUM","q":"Qu'est-ce que la DILA ?","o":["La direction de l'information légale et administrative","La direction informatique et libertés de l'administration","La direction interministérielle des langages administratifs"],"a":0,"c":"s","e":"DILA : direction de l'information légale et administrative (Journal officiel, service-public.fr)."},{"id":"2024-107","s":"2024","n":107,"d":"NUM","q":"Qu'est-ce qu'un coffre-fort numérique ?","o":["Une salle informatique d'exploitation d'applications sensibles","Un élément de codage particulièrement robuste","Un espace de stockage en ligne sécurisé"],"a":2,"c":"s","e":"Un coffre-fort numérique est un espace de stockage en ligne sécurisé."},{"id":"2024-108","s":"2024","n":108,"d":"NUM","q":"Existe-t-il une obligation générale de publication en ligne des documents administratifs par l'administration ?","o":["Le code des relations entre le public et l'administration prévoit une obligation de publication en ligne d'un document administratif mais cela concerne uniquement l'État","Le code des relations entre le public et l'administration prévoit une obligation de publication des documents administratifs pour toutes les personnes publiques","La publication d'un document administratif est laissée au libre choix des administrations"],"a":1,"c":"p","e":"Depuis la loi pour une République numérique (2016), les administrations doivent publier en ligne certains documents. L'obligation vise les administrations d'au moins 50 agents (et les collectivités de plus de 3 500 habitants)."},{"id":"2024-109","s":"2024","n":109,"d":"NUM","q":"Qu'est-ce que le CERT-FR ?","o":["Le centre gouvernemental de veille, d'alerte et de réponse aux attaques informatiques","Un organisme de certification informatique rattaché au ministère chargé du numérique","Un label permettant de s'assurer de la sécurité informatique du matériel informatique de l'État"],"a":0,"c":"s","e":"Le CERT-FR (ANSSI) est le centre gouvernemental de veille, d'alerte et de réponse aux attaques informatiques."}]</script>
<script>
const Q = JSON.parse(document.getElementById('data').textContent);
const BYID = Object.fromEntries(Q.map(q=>[q.id,q]));
const DOM = {CAJ:'Culture administrative et juridique',FP:'Finances publiques',UE:'Institutions européennes',NUM:'Culture numérique'};
const SESS = ['2021-1','2021-2','2022-1','2022-2','2023-1','2023-2','2024'];
const LETTERS = ['A','B','C'];
const INTERVALS = [0,1,3,7,16,35];
const KEY='ira-qcm-v1';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
let S = load() || {cards:{},days:{},settings:{size:20,num:false,sess:'all',dom:'all'},session:null,exam:null,history:[]};
S.settings = Object.assign({size:20,num:false,sess:'all',dom:'all'},S.settings||{});
S.history = S.history||[]; S.days=S.days||{}; S.cards=S.cards||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pool(){return Q.filter(q=>(S.settings.num||q.d!=='NUM')&&(S.settings.sess==='all'||q.s===S.settings.sess)&&(S.settings.dom==='all'||q.d===S.settings.dom))}
function sessLabel(s){return s==='2024'?'Session 2024':'Session '+s.replace('-1',' printemps').replace('-2',' automne')}
function pts(r){return r==='ok'?1:r==='ko'?-0.5:0}
function on20(list){const n=list.length;if(!n)return 0;const p=list.reduce((a,x)=>a+pts(x),0);return Math.max(0,p)/n*20}

/* ---------- streak ---------- */
function streak(){let n=0,d=today();if(!S.days[d])d=addDays(d,-1);while(S.days[d]){n++;d=addDays(d,-1)}return n}
function renderStreak(){const n=streak();const seen=Object.keys(S.cards).length;document.getElementById('streak').innerHTML=`<b>${n}</b> jour${n>1?'s':''} d'affilée<br>${seen} / ${Q.length} vues`}

/* ---------- daily session ---------- */
function buildDaily(){
  const P=pool(), t=today();
  const due=P.filter(q=>S.cards[q.id]&&S.cards[q.id].due<=t);
  const fresh=shuffle(P.filter(q=>!S.cards[q.id]));
  shuffle(due);
  due.sort((a,b)=>(S.cards[a.id].box-S.cards[b.id].box));
  const size=S.settings.size;
  let ids=due.slice(0,Math.ceil(size*0.6)).map(q=>q.id);
  ids=ids.concat(fresh.slice(0,size-ids.length).map(q=>q.id));
  if(ids.length<size) ids=ids.concat(due.slice(ids.length).map(q=>q.id)).slice(0,size);
  if(ids.length<size){const rest=shuffle(P.filter(q=>!ids.includes(q.id)));ids=ids.concat(rest.slice(0,size-ids.length).map(q=>q.id))}
  return {date:t,ids:shuffle(ids),i:0,res:[],picked:null,done:false};
}
function grade(id,r){
  const c=S.cards[id]||{box:0,ok:0,ko:0,abs:0,due:today()};
  if(r==='ok'){c.ok++;c.box=Math.min(5,c.box+1)} else {r==='ko'?c.ko++:c.abs++;c.box=1}
  c.due=addDays(today(),INTERVALS[c.box]); c.last=r; S.cards[id]=c;
}
function renderToday(){
  const el=document.getElementById('v-today');
  const s=S.session;
  if(!s||s.date!==today()||(s.done&&false)){
    if(s&&s.date!==today()) S.session=null;
  }
  if(!S.session){ return renderHome(el) }
  if(S.session.done) return renderDone(el);
  renderQuestion(el,S.session,false);
}
function renderHome(el){
  const P=pool(), t=today();
  const due=P.filter(q=>S.cards[q.id]&&S.cards[q.id].due<=t).length;
  const fresh=P.filter(q=>!S.cards[q.id]).length;
  const doneToday=!!S.days[t];
  el.innerHTML=`
  <h2>${doneToday?'Séance du jour terminée':'Séance du jour'}</h2>
  <p class="lead">${doneToday?'Vous pouvez en faire une deuxième : les questions déjà réussies reviennent plus tard, les erreurs reviennent vite.':'Les questions ratées reviennent en priorité, complétées par des questions nouvelles. Barème réel : +1 bonne réponse, −0,5 erreur, 0 si vous passez.'}</p>
  <div class="plan"><div><b>${due}</b><span>à revoir</span></div><div><b>${fresh}</b><span>jamais vues</span></div><div><b>${P.length}</b><span>dans la sélection</span></div></div>
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div class="field">Questions par séance
        <div class="seg" id="size">${[10,20,30,60].map(n=>`<button aria-pressed="${S.settings.size===n}" data-n="${n}">${n}</button>`).join('')}</div>
      </div>
      <button class="btn" id="go">${doneToday?'Refaire une séance':'Commencer'}</button>
    </div>
    <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Cibler l'entraînement</summary>
      <div class="filters">
        <label class="field">Domaine<select id="fdom"><option value="all">Tous</option>${Object.entries(DOM).map(([k,v])=>`<option value="${k}" ${S.settings.dom===k?'selected':''}>${v}</option>`).join('')}</select></label>
        <label class="field">Session<select id="fsess"><option value="all">Toutes</option>${SESS.map(x=>`<option value="${x}" ${S.settings.sess===x?'selected':''}>${sessLabel(x)}</option>`).join('')}</select></label>
      </div>
      <label class="chk"><input type="checkbox" id="fnum" ${S.settings.num?'checked':''}> <span>Inclure la culture numérique <span class="small">(hors programme du QCM 2027)</span></span></label>
    </details>
  </div>`;
  el.querySelectorAll('#size button').forEach(b=>b.onclick=()=>{S.settings.size=+b.dataset.n;save();renderHome(el)});
  el.querySelector('#fdom').onchange=e=>{S.settings.dom=e.target.value;save();renderHome(el)};
  el.querySelector('#fsess').onchange=e=>{S.settings.sess=e.target.value;save();renderHome(el)};
  el.querySelector('#fnum').onchange=e=>{S.settings.num=e.target.checked;save();renderHome(el)};
  el.querySelector('#go').onclick=()=>{if(!pool().length)return;S.session=buildDaily();save();renderToday()};
}
function renderQuestion(el,s,exam){
  const q=BYID[s.ids[s.i]], n=s.ids.length, answered=s.picked!==null&&!exam;
  const timer = exam?`<span class="timer" id="timer"></span>`:'';
  el.innerHTML=`
  <div class="meta"><span>Question ${s.i+1} / ${n}</span>${timer}<span><span class="tag">${sessLabel(q.s)} · n° ${q.n}</span></span></div>
  <div class="progress"><i style="width:${(s.i)/n*100}%"></i></div>
  <p class="small" style="margin:14px 0 0">${DOM[q.d]}</p>
  <p class="qtext">${esc(q.q)}</p>
  <div class="choices">${q.o.map((o,k)=>{
    let cls='choice';
    if(answered){ if(k===q.a) cls+=' good'; else if(k===s.picked) cls+=' bad'; }
    else if(exam && s.ans && s.ans[s.i]===k) cls+=' picked';
    return `<button class="${cls}" data-k="${k}" ${answered?'disabled':''}><span class="box">${LETTERS[k]}</span><span class="txt">${esc(o)}</span></button>`}).join('')}
  </div>
  ${answered?'':`<button class="skip" data-k="-1">${exam?'Laisser vide (0 point)':'Je passe (0 point, comme au concours)'}</button>`}
  <div id="fb"></div>`;
  if(answered) showFeedback(el,q,s.picked);
  if(!answered) el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(exam){ s.ans[s.i]=k===-1?null:k; s.i++; save(); if(s.i>=n){finishExam()} else renderExam(); return;}
    s.picked=k; const r=k===-1?'abs':(k===q.a?'ok':'ko'); s.res.push(r); grade(q.id,r); save(); renderStreak(); renderQuestion(el,s,false);
  });
  if(exam) tick();
  window.scrollTo({top:0});
}
function showFeedback(el,q,k){
  const r=k===-1?'abs':(k===q.a?'ok':'ko');
  const title=r==='ok'?'Bonne réponse (+1)':r==='ko'?`Mauvaise réponse (−0,5) — la bonne réponse était ${LETTERS[q.a]}`:`Question passée (0) — la bonne réponse était ${LETTERS[q.a]}`;
  el.querySelector('#fb').innerHTML=`<div class="feedback ${r==='ok'?'':r==='ko'?'bad':'abs'}"><h3>${title}</h3><p>${esc(q.e)}</p>${q.c==='p'?'<p class="note">Réponse probable, non confirmée par un corrigé officiel : vérifiez si vous avez un doute.</p>':''}</div>
  <div class="next"><button class="btn" id="nx">${S.session.i+1<S.session.ids.length?'Question suivante':'Voir le bilan'}</button></div>`;
  const nx=el.querySelector('#nx'); nx.focus({preventScroll:true});
  nx.onclick=()=>{const s=S.session;s.i++;s.picked=null;if(s.i>=s.ids.length){s.done=true;S.days[today()]=(S.days[today()]||0)+1;S.history.push({d:today(),t:'jour',n:s.res.length,s:on20(s.res)})}save();renderStreak();renderToday()};
}
function renderDone(el){
  const s=S.session, ok=s.res.filter(r=>r==='ok').length, ko=s.res.filter(r=>r==='ko').length, ab=s.res.filter(r=>r==='abs').length;
  const wrong=s.ids.filter((id,i)=>s.res[i]!=='ok');
  el.innerHTML=`<h2>Bilan de la séance</h2>
  <div class="panel"><div class="score">${on20(s.res).toFixed(1).replace('.',',')} / 20</div>
  <p class="small">${ok} bonnes · ${ko} erreurs · ${ab} passées — barème +1 / −0,5 / 0</p>
  ${ko>ab*2&&ko>2?'<p class="small" style="color:var(--warn)">Vos erreurs coûtent des points : en cas de doute réel, passer la question vaut mieux que répondre au hasard.</p>':''}
  <div class="row" style="margin-top:12px"><button class="btn" id="again">Nouvelle séance</button></div></div>
  ${wrong.length?`<h2>À retenir</h2><div class="panel">${wrong.map(id=>{const q=BYID[id];return `<div class="review-item"><p class="q">${esc(q.q)}</p><p><b>${LETTERS[q.a]}.</b> ${esc(q.o[q.a])}</p><p class="small">${esc(q.e)}</p></div>`}).join('')}</div>`:''}`;
  el.querySelector('#again').onclick=()=>{S.session=null;save();renderToday()};
  window.scrollTo({top:0});
}

/* ---------- exam ---------- */
let tickH=null;
function tick(){clearInterval(tickH);const e=S.exam;if(!e)return;const f=()=>{const left=Math.max(0,e.end-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);const t=document.getElementById('timer');if(t)t.textContent=`${m}:${String(s).padStart(2,'0')}`;if(left<=0){clearInterval(tickH);finishExam()}};f();tickH=setInterval(f,1000)}
function renderExam(){
  const el=document.getElementById('v-exam');
  const e=S.exam;
  if(!e){
    el.innerHTML=`<h2>Examen blanc</h2>
    <p class="lead">60 questions tirées au hasard, sans correction avant la fin, comme la partie QCM de l'épreuve 2027 (60 questions). La culture numérique est exclue : elle n'est plus au programme.</p>
    <div class="panel"><div class="row" style="justify-content:space-between"><div class="field">Temps
    <div class="seg" id="dur">${[45,60,75].map(n=>`<button aria-pressed="${(S.examDur||60)===n}" data-n="${n}">${n} min</button>`).join('')}</div></div>
    <button class="btn" id="start">Lancer l'examen</button></div>
    <p class="small" style="margin-bottom:0">L'épreuve 2027 dure 2 h pour 60 QCM et 2 questions à réponse courte : viser environ 1 h pour les QCM.</p></div>
    ${S.history.filter(h=>h.t==='examen').length?`<h2>Examens passés</h2><div class="panel"><table class="stats"><tr><th>Date</th><th>Note</th></tr>${S.history.filter(h=>h.t==='examen').slice(-8).reverse().map(h=>`<tr><td>${h.d}</td><td>${h.s.toFixed(1).replace('.',',')} / 20</td></tr>`).join('')}</table></div>`:''}`;
    el.querySelectorAll('#dur button').forEach(b=>b.onclick=()=>{S.examDur=+b.dataset.n;save();renderExam()});
    el.querySelector('#start').onclick=()=>{
      const P=shuffle(Q.filter(q=>q.d!=='NUM'));
      const pick=[...P.filter(q=>q.d==='CAJ').slice(0,30),...P.filter(q=>q.d==='FP').slice(0,15),...P.filter(q=>q.d==='UE').slice(0,15)];
      S.exam={ids:shuffle(pick.map(q=>q.id)),i:0,ans:[],end:Date.now()+(S.examDur||60)*60000,done:false};save();renderExam()};
    return;
  }
  if(e.done) return renderExamResult(el);
  renderQuestion(el,e,true);
}
function finishExam(){
  const e=S.exam; if(!e||e.done)return; clearInterval(tickH);
  e.done=true; e.res=e.ids.map((id,i)=>{const a=e.ans[i];if(a===undefined||a===null)return 'abs';return a===BYID[id].a?'ok':'ko'});
  e.ids.forEach((id,i)=>grade(id,e.res[i]));
  S.days[today()]=(S.days[today()]||0)+1;
  S.history.push({d:today(),t:'examen',n:e.ids.length,s:on20(e.res)}); save(); renderStreak(); renderExam();
}
function renderExamResult(el){
  const e=S.exam, r=e.res, by={};
  e.ids.forEach((id,i)=>{const d=BYID[id].d;(by[d]=by[d]||[]).push(r[i])});
  el.innerHTML=`<h2>Résultat de l'examen blanc</h2>
  <div class="panel"><div class="score">${on20(r).toFixed(1).replace('.',',')} / 20</div>
  <p class="small">${r.filter(x=>x==='ok').length} bonnes · ${r.filter(x=>x==='ko').length} erreurs · ${r.filter(x=>x==='abs').length} sans réponse. En dessous de 5/20, la note serait éliminatoire.</p>
  <table class="stats"><tr><th>Domaine</th><th>Note</th></tr>${Object.keys(by).map(d=>`<tr><td>${DOM[d]}</td><td>${on20(by[d]).toFixed(1).replace('.',',')} / 20</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:12px"><button class="btn" id="new">Nouvel examen</button></div></div>
  <h2>Correction</h2><div class="panel">${e.ids.map((id,i)=>{const q=BYID[id],a=e.ans[i];const st=r[i];return `<div class="review-item"><p class="small">${i+1}. ${sessLabel(q.s)} · ${DOM[q.d]} — ${st==='ok'?'<span style="color:var(--ok)">bonne réponse</span>':st==='ko'?`<span style="color:var(--ko)">vous : ${LETTERS[a]}</span>`:'sans réponse'}</p><p class="q">${esc(q.q)}</p><p><b>${LETTERS[q.a]}.</b> ${esc(q.o[q.a])}</p><p class="small">${esc(q.e)}${q.c==='p'?' <em>(réponse probable)</em>':''}</p></div>`}).join('')}</div>`;
  el.querySelector('#new').onclick=()=>{S.exam=null;save();renderExam()};
}

/* ---------- bank ---------- */
const B={q:'',s:'all',d:'all',st:'all',page:0,per:40};
function renderBank(){
  const el=document.getElementById('v-bank');
  if(!el.dataset.init){
    el.dataset.init=1;
    el.innerHTML=`<h2>Banque de questions</h2><p class="lead">Les ${Q.length} questions des QCM 2021 à 2024, avec la réponse et sa justification. Les réponses marquées « probable » n'ont pas de corrigé officiel certain.</p>
    <div class="filters">
      <label class="field">Rechercher<input type="search" id="bq" placeholder="mot-clé : LOLF, CNIL, Schengen…"></label>
      <label class="field">Session<select id="bs"><option value="all">Toutes</option>${SESS.map(x=>`<option value="${x}">${sessLabel(x)}</option>`).join('')}</select></label>
      <label class="field">Domaine<select id="bd"><option value="all">Tous</option>${Object.entries(DOM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="field">Mes résultats<select id="bst"><option value="all">Toutes</option><option value="ko">Ratées ou passées</option><option value="new">Jamais vues</option><option value="p">Réponse probable</option></select></label>
    </div><div id="btable"></div>`;
    const upd=()=>{B.q=el.querySelector('#bq').value.trim().toLowerCase();B.s=el.querySelector('#bs').value;B.d=el.querySelector('#bd').value;B.st=el.querySelector('#bst').value;B.page=0;drawBank()};
    el.querySelector('#bq').oninput=upd;['#bs','#bd','#bst'].forEach(s=>el.querySelector(s).onchange=upd);
  }
  drawBank();
}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function drawBank(){
  const q=norm(B.q);
  const rows=Q.filter(x=>(B.s==='all'||x.s===B.s)&&(B.d==='all'||x.d===B.d)&&
    (B.st==='all'||(B.st==='new'&&!S.cards[x.id])||(B.st==='ko'&&S.cards[x.id]&&S.cards[x.id].last!=='ok')||(B.st==='p'&&x.c==='p'))&&
    (!q||norm(x.q+' '+x.o.join(' ')+' '+x.e).includes(q)));
  const pages=Math.max(1,Math.ceil(rows.length/B.per)); B.page=Math.min(B.page,pages-1);
  const sl=rows.slice(B.page*B.per,(B.page+1)*B.per);
  const t=document.getElementById('btable');
  if(!rows.length){t.innerHTML='<div class="empty">Aucune question ne correspond. Élargissez les filtres ou changez le mot-clé.</div>';return}
  t.innerHTML=`<div class="tablewrap"><table class="bank"><thead><tr><th>Session</th><th>N°</th><th>Domaine</th><th>Question et choix</th><th>Rép.</th><th>Justification</th></tr></thead><tbody>
  ${sl.map(x=>`<tr><td>${x.s}</td><td>${x.n}</td><td>${x.d==='CAJ'?'Culture adm.':x.d==='FP'?'Finances':x.d==='UE'?'Europe':'Numérique'}</td>
  <td class="q">${esc(x.q)}${x.o.map((o,k)=>`<span class="opt ${k===x.a?'ans':''}">${LETTERS[k]}. ${esc(o)}</span>`).join('')}</td>
  <td><b>${LETTERS[x.a]}</b>${x.c==='p'?'<br><span class="tag warn">probable</span>':''}</td><td class="e">${esc(x.e)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="pager"><button class="btn ghost small" id="pp" ${B.page===0?'disabled':''}>Précédent</button><span>${rows.length} question${rows.length>1?'s':''} · page ${B.page+1} / ${pages}</span><button class="btn ghost small" id="pn" ${B.page>=pages-1?'disabled':''}>Suivant</button></div>`;
  t.querySelector('#pp').onclick=()=>{B.page--;drawBank();t.scrollIntoView()};
  t.querySelector('#pn').onclick=()=>{B.page++;drawBank();t.scrollIntoView()};
}

/* ---------- stats ---------- */
function renderStats(){
  const el=document.getElementById('v-stats');
  const rows=Object.keys(DOM).map(d=>{const qs=Q.filter(q=>q.d===d);const seen=qs.filter(q=>S.cards[q.id]);const ok=seen.reduce((a,q)=>a+S.cards[q.id].ok,0),tot=seen.reduce((a,q)=>a+S.cards[q.id].ok+S.cards[q.id].ko+S.cards[q.id].abs,0);const m=qs.filter(q=>S.cards[q.id]&&S.cards[q.id].box>=4).length;return {d,n:qs.length,seen:seen.length,rate:tot?ok/tot:0,m}});
  const hist=S.history.slice(-10).reverse();
  el.innerHTML=`<h2>Progrès</h2>
  <p class="lead">Une question est « maîtrisée » après 4 bonnes réponses consécutives espacées dans le temps.</p>
  <div class="panel"><table class="stats"><tr><th>Domaine</th><th>Vues</th><th>Réussite</th><th>Maîtrisées</th></tr>
  ${rows.map(r=>`<tr><td>${DOM[r.d]}${r.d==='NUM'?' <span class="small">(hors 2027)</span>':''}</td><td>${r.seen} / ${r.n}</td><td><div class="bar"><i style="width:${Math.round(r.rate*100)}%"></i></div><span class="small">${r.seen?Math.round(r.rate*100)+' %':'—'}</span></td><td>${r.m}</td></tr>`).join('')}</table></div>
  <h2>Dernières séances</h2>
  <div class="panel">${hist.length?`<table class="stats"><tr><th>Date</th><th>Type</th><th>Questions</th><th>Note</th></tr>${hist.map(h=>`<tr><td>${h.d}</td><td>${h.t==='examen'?'Examen blanc':'Séance'}</td><td>${h.n}</td><td>${h.s.toFixed(1).replace('.',',')} / 20</td></tr>`).join('')}</table>`:'<div class="empty">Aucune séance pour l\'instant. Lancez la séance du jour depuis l\'onglet Aujourd\'hui.</div>'}</div>
  <h2>Réglages</h2>
  <div class="panel"><p class="small" style="margin-top:0">Votre progression est enregistrée dans ce navigateur uniquement. Elle ne se synchronise pas entre votre téléphone et votre ordinateur.</p>
  <button class="btn ghost small" id="reset">Effacer toute ma progression</button></div>`;
  el.querySelector('#reset').onclick=()=>{if(confirm('Effacer toute la progression ? Cette action est définitive.')){S={cards:{},days:{},settings:S.settings,session:null,exam:null,history:[]};save();renderStreak();renderStats()}};
}

/* ---------- nav ---------- */
function show(v){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  ['today','exam','bank','stats'].forEach(x=>document.getElementById('v-'+x).hidden=x!==v);
  if(v==='today')renderToday(); if(v==='exam')renderExam(); if(v==='bank')renderBank(); if(v==='stats')renderStats();
  window.scrollTo({top:0});
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
renderStreak(); show('today');
</script>
</body>
</html>
