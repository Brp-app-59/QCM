lter uniquement le rapport de son supérieur hiérarchique"],"a":1,"c":"s","e":"Droit à communication de l'intégralité du dossier individuel et de toutes les pièces annexes (loi de 1905), avec l'assistance de défenseurs de son choix."},{"id":"2023-1-35","s":"2023-1","n":35,"d":"CAJ","q":"Le droit de grève est reconnu aux agents publics. Toutefois, certains agents ne disposent pas de ce droit. Il s'agit notamment :","o":["des magistrats administratifs","des magistrats financiers","des magistrats judiciaires"],"a":2,"c":"s","e":"Les magistrats judiciaires sont privés du droit de grève (ordonnance de 1958)."},{"id":"2023-1-36","s":"2023-1","n":36,"d":"CAJ","q":"Vous êtes chef de service au sein d'une direction départementale des services de l'éducation nationale. Un fonctionnaire travaillant dans votre bureau vous demande s'il peut exercer une activité accessoire de formateur. Vous lui repondez qu'un agent public :","o":["exerçant une activité principale ne peut obtenir une telle autorisation","exerçant une activité principale peut bénéficier d'une autorisation pour exercer une activité de formateur","n'a pas besoin de solliciter l'autorisation de sa hiérarchie pour exercer une activité de formateur"],"a":1,"c":"s","e":"L'activité de formateur est une activité accessoire autorisable, sur demande préalable."},{"id":"2023-1-37","s":"2023-1","n":37,"d":"CAJ","q":"Un agent chute dans le hall de son immeuble en partant travailler. Cet accident est qualifié :","o":["d'accident de trajet","d'accident de service","d'accident privé"],"a":0,"c":"s","e":"L'accident survenu entre le domicile (porte du logement) et le lieu de travail est un accident de trajet. Les parties communes de l'immeuble sont hors du domicile."},{"id":"2023-1-38","s":"2023-1","n":38,"d":"CAJ","q":"La réforme de 2021 de l'encadrement supérieur de l'État vise notamment a :","o":["accroître le nombre de corps par filière métiers afin de spécialiser et professionnaliser davantage la haute fonction publique","diminuer le nombre de corps en faisant des administrateurs de l'État le corps socle de l'encadrement supérieur","fusionner les corps d'encadrement supérieur des trois fonctions publiques"],"a":1,"c":"s","e":"La réforme de 2021 met fin aux grands corps et fait des administrateurs de l'État le corps socle de l'encadrement supérieur."},{"id":"2023-1-39","s":"2023-1","n":39,"d":"CAJ","q":"Vous êtes chef d'un bureau du personnel dans la fonction publique de l'État et votre supérieur vous demande de suspendre un agent. Que faites-vous ?","o":["Vous lui déconseillez de prendre une telle mesure, au motif qu'elle doit être précédée de la réunion d'un conseil de discipline","Vous mettez en œuvre cette mesure conservatoire pour une période initiale et maximale de 4 mois","Vous lui suggèrez de privilégier l'exclusion temporaire de fonctions, d'une durée de 15 jours minimum"],"a":1,"c":"s","e":"La suspension, mesure conservatoire en cas de faute grave, dure au plus 4 mois sauf poursuites pénales."},{"id":"2023-1-40","s":"2023-1","n":40,"d":"CAJ","q":"La garantie individuelle du pouvoir d'achat est un dispositif visant au maintien du pouvoir d'achat des agents publics, lorsqu'il apparaît que celui-ci a baissé par comparaison entre l'évolution du traitement indiciaire brut détenu par l'agent et celle de l'indice des prix à la consommation :","o":["sur une période de référence de dix ans","depuis son entrée dans la fonction publique","sur une période de référence de quatre ans"],"a":2,"c":"s","e":"La GIPA compare l'évolution du traitement indiciaire brut à l'inflation sur une période de référence de 4 ans."},{"id":"2023-1-41","s":"2023-1","n":41,"d":"CAJ","q":"Une sanction disciplinaire peut-elle s'accompagner d'une sanction pénale ?","o":["Non, selon le principe dit du non bis in idem qui stipule qu'on ne peut pas être sanctionné deux fois pour un même fait","Oui, car il y a indépendance des procédures disciplinaire et pénale","Oui, car il y a systématiquement une sanction pénale qui se rapporte à chaque sanction disciplinaire prononcée"],"a":1,"c":"s","e":"Indépendance des procédures pénale et disciplinaire : un même fait peut entraîner les deux sanctions."},{"id":"2023-1-42","s":"2023-1","n":42,"d":"CAJ","q":"La loi n° 2019-828 du 6 août 2019 de transformation de la fonction publique a offert aux fonctionnaires la possibilité de demander une rupture conventionnelle qui aboutit à une :","o":["radiation des cadres et à la perte de la qualité de fonctionnaire, ouvrant droit à une indemnisation","cessation progressive des activités de l'agent, ouvrant droit à une indemnisation également progressive","situation au cours de laquelle l'agent se trouve placé temporairement hors de son administration ou service d'origine et cesse de bénéficier, durant cette période, de sa rémunération et de ses droits à la retraite"],"a":0,"c":"s","e":"La rupture conventionnelle entraîne la radiation des cadres et ouvre droit à une indemnité spécifique."},{"id":"2023-1-43","s":"2023-1","n":43,"d":"CAJ","q":"Le compte personnel de formation (CPF) permet de suivre une formation :","o":["d'adaptation à l'emploi","prescrite par l'employeur","relevant d'une initiative de l'agent"],"a":2,"c":"s","e":"Le CPF finance les formations à l'initiative de l'agent, dans le cadre d'un projet d'évolution professionnelle."},{"id":"2023-1-44","s":"2023-1","n":44,"d":"CAJ","q":"La place de l'emploi public (PEP) est :","o":["un système d'information permettant de gèrer les opérations de mobilité des employeurs publics","un portail recensant l'ensemble des offres d'emploi des trois versants de la fonction publique","un portail à partir duquel les agents peuvent former un recours permettant d'obtenir une révision d'affectation"],"a":1,"c":"s","e":"La PEP recense les offres d'emploi des trois versants de la fonction publique."},{"id":"2023-1-45","s":"2023-1","n":45,"d":"CAJ","q":"Que désigne l'effet de noria ?","o":["L'effet d'entrainement sur les coûts salariaux de l'évolution de l'indice des prix à la consommation","L'évolution des coûts salariaux en raison des avancements d'échelon, de grade et de corps","L'économie sur la masse salariale correspondant à la différence entre les coûts des salaires des agents entrants (moins payés) et des agents sortants (mieux payés grâce à leur ancienneté)"],"a":2,"c":"s","e":"Effet de noria : économie liée au remplacement des agents sortants (mieux payés) par des entrants (moins payés). C'est le GVT négatif."},{"id":"2023-1-46","s":"2023-1","n":46,"d":"CAJ","q":"Quelle a été la première métropole créée à la suite de la loi n° 2010-1563 du 16 décembre 2010 instituant un nouveau modèle d'établissement public de coopération intercommunal (EPCI) ?","o":["La métropole du Grand Paris","La métropole de Lyon","La métropole Nice-Côte d'Azur"],"a":2,"c":"s","e":"La métropole Nice-Côte d'Azur (fin 2011) est la première créée par la loi de 2010."},{"id":"2023-1-47","s":"2023-1","n":47,"d":"CAJ","q":"Par la loi n° 2015-991 du 7 août 2015 portant nouvelle organisation territoriale de la République, plusieurs compétences des collectivités territoriales ont été transférées ou supprimées. Cette loi prévoit entre autre que :","o":["le rôle du département en matière de développement économique est renforcé","la clause générale de compétence est supprimée pour les départements et les régions","la responsabilité des compétences de solidarité est transférée à la région"],"a":1,"c":"s","e":"La loi NOTRe supprime la clause générale de compétence des départements et des régions."},{"id":"2023-1-48","s":"2023-1","n":48,"d":"CAJ","q":"La direction interministérielle de la transformation publique est placée sous l'autorité :","o":["de la directrice générale de l'administration et de la fonction publique","du ministre de la transformation et de la fonction publiques","du Premier ministre"],"a":1,"c":"p","e":"La DITP est placée sous l'autorité du ministre chargé de la transformation et de la fonction publiques."},{"id":"2023-1-49","s":"2023-1","n":49,"d":"CAJ","q":"Vous travaillez dans un service juridique. Dans le cadre du renouvellement du cabinet ministériel, on vous demande si un avis préalable de la Haute autorité pour la transparence de la vie publique est nécessaire. Vous indiquez que ce contrôle est nécessaire dès lors que les membres de cabinet ont exercé une fonction dans le secteur privé au cours des :","o":["3 années précédant la nomination","6 années précédant la nomination","9 années précédant la nomination"],"a":0,"c":"s","e":"Contrôle déontologique de la HATVP sur les membres de cabinet ayant exercé dans le privé au cours des 3 années précédentes."},{"id":"2023-1-50","s":"2023-1","n":50,"d":"CAJ","q":"Quel impact la réforme territoriale créée par la loi n° 2015-29 du 16 janvier 2015 a-t-elle eu sur l'organisation territoriale du ministère en charge de l'éducation nationale ?","o":["La réforme territoriale n'a eu aucun impact sur l'organisation académique","La disparition de 12 académies sur le territoire national","La création de 18 régions académiques"],"a":2,"c":"s","e":"La réforme de 2015 crée les régions académiques, calquées sur les régions : 18 aujourd'hui (13 en métropole, 5 outre-mer). Les académies sont maintenues."},{"id":"2023-1-51","s":"2023-1","n":51,"d":"CAJ","q":"Qui veille à la régularité du déroulement des élections présidentielles ?","o":["La Cour des Comptes","Le Conseil Constitutionnel","Le Conseil d'État"],"a":1,"c":"s","e":"Art. 58 C : le Conseil constitutionnel veille à la régularité de l'élection présidentielle."},{"id":"2023-1-52","s":"2023-1","n":52,"d":"CAJ","q":"Le président d'un établissement public à caractère scientifique, culturel et professionnel (EPSCP) est :","o":["élu par le conseil d'administration (CA) de cet établissement","nommé par le ministre chargé de l'enseignement supérieur sur proposition du recteur de région académique - chancelier des universités","élu par les enseignants chercheurs de l'établissement (professeurs et maître de conférences)"],"a ur la sortie (23 juin 2016)."},{"id":"2023-1-92","s":"2023-1","n":92,"d":"UE","q":"En quelle année les droits de douane entre les États membres de l'Union européenne ont-ils été totalement supprimés ?","o":["1957","1968","1986"],"a":1,"c":"s","e":"L'union douanière est achevée le 1er juillet 1968 : suppression totale des droits de douane intra-communautaires."},{"id":"2023-1-93","s":"2023-1","n":93,"d":"UE","q":"Quel est l'enchaînement chronologique des grands traités constitutifs de l'Union européenne ?","o":["Traités de Maastricht, d'Amsterdam, de Nice, de Lisbonne","Traités de Maastricht, de Nice, d'Amsterdam, de Lisbonne","Traités de Maastricht, d'Amsterdam, de Lisbonne, de Nice"],"a":0,"c":"s","e":"Chronologie : Maastricht (1992), Amsterdam (1997), Nice (2001), Lisbonne (2007)."},{"id":"2023-1-94","s":"2023-1","n":94,"d":"UE","q":"Depuis quelle année la Bulgarie fait-elle partie de l'Union européenne ?","o":["2007","1995","2004"],"a":0,"c":"s","e":"La Bulgarie a adhéré en 2007, avec la Roumanie."},{"id":"2023-1-95","s":"2023-1","n":95,"d":"UE","q":"Dans le domaine des politiques de l'Union européenne, qu'est-ce que le SEAE ?","o":["Le service européen pour l'action économique","Le service européen pour l'action extérieure","Le service économique et administratif européen"],"a":1,"c":"s","e":"Le SEAE est le service européen pour l'action extérieure, dirigé par le Haut représentant."},{"id":"2023-1-96","s":"2023-1","n":96,"d":"UE","q":"Quel était la part de la politique agricole commune (PAC) dans le budget de l'Union européenne en 2021 ?","o":["12 %","25 %","33 %"],"a":2,"c":"s","e":"La PAC représente environ un tiers du budget de l'UE (CFP 2021-2027)."},{"id":"2023-1-97","s":"2023-1","n":97,"d":"UE","q":"Qu'est-ce que l'agence FRONTEX ?","o":["L'agence qui gère des programmes européens qui aident les petites et moyennes entreprises à rester compétitives","L'agence qui veille à la protection des données et protège les informations à caractère personnel","L'agence européenne de garde-frontiéres et de garde-côtes"],"a":2,"c":"s","e":"Frontex est l'agence européenne de garde-frontières et de garde-côtes."},{"id":"2023-1-98","s":"2023-1","n":98,"d":"UE","q":"Depuis quelle date la Croatie fait-elle partie de l'espace Schengen ?","o":["Le 1er janvier 2023","Le 1er janvier 2018","Le 1er janvier 2013"],"a":0,"c":"s","e":"La Croatie est entrée dans l'espace Schengen le 1er janvier 2023 (et dans la zone euro le même jour)."},{"id":"2023-1-99","s":"2023-1","n":99,"d":"UE","q":"Dans quelle ville siège la Cour européenne des droits de l'homme ?","o":["Strasbourg","Luxembourg","Bruxelles"],"a":0,"c":"s","e":"La CEDH siège à Strasbourg."},{"id":"2023-1-100","s":"2023-1","n":100,"d":"UE","q":"Combien d'États sont signataires de la Convention européenne des droits de l'homme ?","o":["36","46","27"],"a":1,"c":"s","e":"46 États sont parties à la CEDH depuis l'exclusion de la Russie en 2022."},{"id":"2023-1-101","s":"2023-1","n":101,"d":"NUM","q":"Qu'est-ce qu'une U.R.L ?","o":["Un serveur dédié","L'adresse d'une ressource","Un fichier"],"a":1,"c":"s","e":"Une URL est l'adresse d'une ressource sur Internet."},{"id":"2023-1-102","s":"2023-1","n":102,"d":"NUM","q":"Un espace numérique de travail est :","o":["soit un intranet, soit un extranet","toujours un intranet et parfois un extranet","toujours un extranet et parfois un intranet"],"a":0,"c":"p","e":"L'ENT est un portail de services numériques accessible, selon les cas, en intranet ou en extranet. Question ambiguë."},{"id":"2023-1-103","s":"2023-1","n":103,"d":"NUM","q":"Un réseau privé virtuel ou VPN permet :","o":["de se connecter a distance à un réseau interne de manière sécurisée","d'accéder au sein d'un réseau interne à des serveurs de fichiers partagés","de lutter efficacement contre « la prise d'empreintes »"],"a":0,"c":"s","e":"Le VPN permet de se connecter à distance, de façon sécurisée, au réseau interne."},{"id":"2023-1-104","s":"2023-1","n":104,"d":"NUM","q":"Le HTML (HyperText Markup Language ou langage de balises pour l'hypertexte) est :","o":["un code utilisé pour structurer une page web et son contenu","un langage de programmation","une feuille de style permettant de définir l'aspect d'un site web"],"a":0,"c":"s","e":"Le HTML est un langage de balisage qui structure le contenu d'une page web. Ce n'est pas un langage de programmation ; le CSS gère l'aspect."},{"id":"2023-1-105","s":"2023-1","n":105,"d":"NUM","q":"Parmi les propositions suivantes, laquelle n'est pas un service de stockage en ligne ?","o":["Google Drive","Vega Drive","iCloud"],"a":1,"c":"s","e":"« Vega Drive » n'est pas un service de stockage en ligne connu. Google Drive et iCloud le sont."},{"id":"2023-1-106","s":"2023-1","n":106,"d":"NUM","q":"Qu'est-ce qu'un « jeton individuel d'accès » (token access) ?","o":["Un mécanisme intégré aux procédures d'authentification qui permet une connexion sécurisée à un espace personnel, un compte ou encore des documents bureautiques","Un code alphanumérique permettant d'effectuer des achats en ligne de manière sécurisée","Un jeton distribué aux personnes ne disposant pas du haut débit. Il permet une meilleure connexion et réduit ainsi la fracture numérique"],"a":0,"c":"s","e":"Un jeton d'accès (token) est un élément d'authentification permettant l'accès sécurisé à un espace ou à des ressources."},{"id":"2023-1-107","s":"2023-1","n":107,"d":"NUM","q":"Qu'est-ce qu'un métavers ?","o":["Un service en ligne donnant accès à des simulations d'espaces 3D temps réel dans lesquelles on peut vivre des expériences immersives","Une nouvelle forme d'intelligence artificielle","Un type d'équipement numérique permettant, à un utilisateur unique identifié, l'accès aux ressources en permanence, notamment par le biais de connexions sans fil"],"a":0,"c":"s","e":"Un métavers est un espace virtuel 3D persistant et immersif."},{"id":"2023-1-108","s":"2023-1","n":108,"d":"NUM","q":"Qu'est-ce que la fracture numérique ?","o":["L'absence de dématérialisation des services publics","L'indisponibilité occasionnelle du réseau internet sur un territoire","La disparité d'accès aux technologies informatiques"],"a":2,"c":"s","e":"La fracture numérique désigne la disparité d'accès (et d'usage) aux technologies numériques."},{"id":"2023-1-110","s":"2023-1","n":110,"d":"NUM","q":"La direction interministérielle du numérique (DINUM) est :","o":["une direction rattachée au ministère de la transformation et de la fonction publiques","un service du secrétariat d'État au numérique","une autorité administrative indépendante"],"a":0,"c":"p","e":"À la date du sujet, la DINUM était placée auprès du ministre de la transformation et de la fonction publiques (tout en relevant du Premier ministre)."},{"id":"2023-1-111","s":"2023-1","n":111,"d":"NUM","q":"Qu'est-ce que le droit à la déconnexion ?","o":["La possibilité pour un employeur de mettre fin à la connexion sur internet d'un agent pour des motifs déontologiques","Le droit pour un agent d'être en télétravail sans avoir accès systématiquement à un poste informatique","Le droit pour un agent de ne pas être joignable en dehors de ses plages horaires règlementaires pour des motifs liés à l'exécution de son travail"],"a":2,"c":"s","e":"Droit à la déconnexion : ne pas être sollicité en dehors du temps de travail."},{"id":"2023-1-112","s":"2023-1","n":112,"d":"NUM","q":"La Commission nationale de l'informatique et des libertés (CNIL) a été créée par :","o":["la loi du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés","le règlement général sur la protection des données (RGPD) du 27 avril 2016","la loi du 7 octobre 2016 pour une République numérique"],"a":0,"c":"s","e":"La CNIL est créée par la loi Informatique et libertés du 6 janvier 1978."},{"id":"2023-1-113","s":"2023-1","n":113,"d":"NUM","q":"L'acteur principalement en charge de la prévention, de la surveillance et de la résolution des menaces informatiques en France est :","o":["la direction générale de la police nationale","l'agence nationale de sécurité des systèmes d'information","la direction générale de la sécurité intérieure"],"a":1,"c":"s","e":"L'ANSSI est l'autorité nationale en charge de la cybersécurité."},{"id":"2023-1-114","s":"2023-1","n":114,"d":"NUM","q":"Au sens du règlement général sur la protection des données (RGPD), sont considérées comme des « données sensibles » ne pouvant faire l'objet que d'un traitement limité et strictement encadré par la loi :","o":["les données biométriques","les données fiscales","les données électorales"],"a":0,"c":"s","e":"Art. 9 RGPD : les données biométriques sont des données sensibles (comme les données de santé, origine, opinions…)."},{"id":"2023-1-115","s":"2023-1","n":115,"d":"NUM","q":"Depuis 2014, la saisine par voie électronique permet à toute personne, dès lors qu'elle s'est identifiée préalablement auprès d'une administration, d'adresser à celle-ci, par voie électronique, une demande, une déclaration, un document ou une information, ou lui répondre par la même voie :","o":["de plein droit sauf exception","seulement si l'administration a mis en place un téléservice ou une adresse dédiée a cette saisine","uniquement si l'administration a préalablement contacté l'usager par voie électronique"],"a":0,"c":"s","e":"Saisine par voie électronique (SVE) : droit de plein droit, sauf exceptions (ordonnance de 2014, art. L. 112-8 CRPA)."},{"id":"2023-1-116","s":"2023-1","n":116,"d":"NUM","q":"Le règlement général sur la protection des données (RGPD) concerne les personnes qui traitent des données personnelles :","o":["uniquement de ressortissants européens sur le territoire européen","sur le territoire européen ou qui concerne des ressortissants européens n'importe où dans le monde","uniquement de ressortissants européens n'importe ou dans le monde"],"a":1,"c":"s","e":"Le RGPD s'applique aux traitements réalisés sur le territoire de l'UE ou ciblant des personnes situées dans l'UE, même depuis l'étranger."},{"id":"2023-1-117","s":"2023-1","n":117,"d":"NUM","q":"Quel est le nom de la loi qui a instauré le télétravail en 2012 dans la fonction publique ?","o":["La loi dite Sauvadet","La loi pour la modernisation de la fonction publique","La loi pour une République numérique"],"a":0,"c":"s","e":"La loi Sauvadet du 12 mars 2012 a introduit le télétravail dans la fonction publique."},{"id":"2023-1-118","s":"2023-1","n":118,"d":"NUM","q":"De combien de membres est composée la Commission nationale de l'informatique et des libertés (CNIL) ?","o":["18","50","30"],"a":0,"c":"s","e":"Le collège de la CNIL compte 18 membres."},{"id":"2023-1-119","s":"2023-1","n":119,"d":"NUM","q":"Comment s'appelle le nouvel outil dédié aux agents de l'État pour l'envoi de fichiers volumineux (jusqu'a 20 Go) ?","o":["France fichier","France transfert","File sender"],"a":1,"c":"s","e":"France Transfert est l'outil d'envoi de fichiers volumineux des agents de l'État."},{"id":"2023-1-120","s":"2023-1","n":120,"d":"NUM","q":"Qu'est-ce que VIGINUM créé en juillet 2021 par l'État et dont le premier rapport annuel a été rendu public le 25 octobre 2022 ?","o":["Un service chargé de la vigilance et de la protection contre les ingèrences numériques étrangères","Un service chargé du suivi du déploiement du numérique au sein du service public","Un service chargé de la protection des données dans le cadre du déploiement du numérique dans la fonction publique"],"a":0,"c":"s","e":"VIGINUM (SGDSN) est chargé de la vigilance et de la protection contre les ingérences numériques étrangères."},{"id":"2023-2-1","s":"2023-2","n":1,"d":"CAJ","q":"Organisation, fonctionnement et politiques des institutions européennes : ….. 20 questions (n° 70 à 89) Pour chaque question, une seule réponse est possible. La réponse est apportée sur la grille en cochant la case (A., B. ou C.) correspondant au choix du candidat. Barème : Bonne réponse : ………… +1 point Mauvaise réponse : …… -0,5 point","o":["bstention : ………………. 0 point TRÈS IMPORTANT ● Seul l'usage d'un stylo à bille à encre noire est autorisé pour cette épreuve ● Aucun document n'est autorisé durant cette épreuve. ● Avant de commencer cette épreuve, il vous est recommandé de vérifier le sujet et, le cas échéant, de signaler immédiatement aux surveillants toute anomalie (page manquante, document illisible, etc.). ● Les réponses aux questions doivent être complétées sur la grille dédiée, qui seule sera corrigée. Il est interdit aux candidats de signer la grille ou d'y mettre un signe quelconque pouvant en indiquer la provenance. Une circulaire qui comporte une interprétation du droit positif doit faire l'objet d'une publication dans les : A. vingt-quatre heures suivant sa signature","quatre mois suivant sa signature","deux mois suivant sa signature"],"a":1,"c":"s","e":"Une circulaire interprétative non publiée dans les 4 mois est réputée abrogée (décret de 2008, CRPA)."},{"id":"2023-2-2","s":"2023-2","n":2,"d":"CAJ","q":"À quel ordre appartient le conseil de prud'hommes ?","o":["L'ordre judiciaire","L'ordre administratif","L'ordre pénal"],"a":0,"c":"s","e":"Le conseil de prud'hommes relève de l'ordre judiciaire. L'« ordre pénal » n'existe pas : le pénal fait partie de l'ordre judiciaire."},{"id":"2023-2-3","s":"2023-2","n":3,"d":"CAJ","q":"Chef(fe) du service communication d'une préfecture, vous constatez qu'un arrêté publié dans la dernière édition du Recueil des Actes Administratifs comporte une grossière erreur matérielle. Vous invitez l'auteur de l'arrêté à :","o":["rapporter le texte publié","établir puis à publier un texte rectificatif","retirer le texte publié"],"a":1,"c":"s","e":"Une erreur matérielle se corrige par un texte rectificatif (erratum) publié. Le retrait et l'abrogation font disparaître l'acte."},{"id":"2023-2-4","s":"2023-2","n":4,"d":"CAJ","q":"En tant que justiciable, vous pouvez soulever une question prioritaire de constitutionnalité (QPC) au cours de toute instance à laquelle vous êtes partie, quelle que soit la nature du litige, à l'exception d'une affaire devant :","o":["une cour d'appel","la cour d'assises","la Cour de cassation"],"a":1,"c":"s","e":"La QPC ne peut pas être soulevée devant la cour d'assises (art. 23-1 de l'ordonnance de 1958). Elle peut l'être à l'appui d'un appel ou en cassation."},{"id":"2023-2-5","s":"2023-2","n":5,"d":"CAJ","q":"Quelles autorités sont en charge de nommer les membres du Conseil constitutionnel ?","o":["Le Président de la République, le Président de l'Assemblée nationale et le Premier ministre","Le Président de la République, le Vice-président du Conseil d'Etat et le Président du Sénat","Le Président de la République, le Président du Sénat et le Président de l'Assemblée nationale"],"a":2,"c":"s","e":"Art. 56 C : trois membres nommés par le Président, trois par le président du Sénat, trois par le président de l'Assemblée nationale."},{"id":"2023-2-6","s":"2023-2","n":6,"d":"CAJ","q":"Vous êtes responsable des ressources humaines dans un rectorat. Un agent vient vous consulter car il souhaite se présenter à un concours, sans être inscrit dans un cursus de formation spécifique. Il veut connaître les possibilités qui lui sont offertes pour bénéficier d'un temps de préparation personnelle pour se préparer. Vous lui précisez qu'il :","o":["est nécessaire de poser un congé","à la possibilité de solliciter une autorisation d'absence auprès de son supérieur hiérarchique dans la limite de 5 jours au total par année civile","à la possibilité d'utiliser son compte épargne temps et à défaut son compte personnel de formation (CPF) dans la limite de 5 jours au total par année civile"],"a":2,"c":"s","e":"Temps de préparation personnelle aux concours : 5 jours par an, via le CET, à défaut le CPF."},{"id":"2023-2-7","s":"2023-2","n":7,"d":"CAJ","q":"Vous êtes ressortissant d'un Etat de l'Union européenne, vous pouvez intégrer la fonction publique :","o":["territoriale et hospitalière française","française de l'Etat uniquement","française à l'exclusion de la participation à des missions de souveraineté"],"a":2,"c":"s","e":"Les ressortissants de l'UE accèdent aux trois fonctions publiques françaises, hors emplois de souveraineté ou de puissance publique."},{"id":"2023-2-8","s":"2023-2","n":8,"d":"CAJ","q":"Les îles Éparses de l'Océan indien constituent :","o":["un arrondissement du département de la Réunion","un district des Terres australes et antarctiques françaises","une collectivité d'outre-mer"],"a":1,"c":"s","e":"Les îles Éparses constituent l'un des districts des Terres australes et antarctiques françaises (TAAF)."},{"id":"2023-2-9","s":"2023-2","n":9,"d":"CAJ","q":"Un agent d'accueil, placé sous votre autorité au sein d'une préfecture, se déclare gréviste à 12h00 à la suite d'un mouvement social de vingt-quatre heures. Qu'encourt ce fonctionnaire ?","o":["Une sanction disciplinaire, le droit de grève n'étant pas accordé aux fonctionnaires affectés à l'accueil dans une préfecture","Une retenue sur traitement pour la journée entière","Une retenue sur traitement pour la demi-journée de grève"],"a":1,"c":"s","e":"Dans la FPE, la règle du trentième indivisible s'applique : toute grève, même d'une demi-journée, entraîne la retenue d'une journée entière."},{"id":"2023-2-10","s":"2023-2","n":10,"d":"CAJ","q":"Dans sa décision « Association pour la promotion de l'image et autres » du 26 décembre 2011, le Conseil d'Etat a précisé la nature du contrôle du juge sur les mesures de police administrative. Ces actes sont désormais soumis au « triple test ». Le juge vérifie que ces mesures sont :","o":["régulièrement publiées, appropriées et proportionnées à la défense de l'ordre public","adaptées, nécessaires et proportionnées à la défense de l'ordre public","idoines, indispensables et proportionnées à la défense de l'ordre public"],"a":1,"c":"s","e":"CE 2011 Association pour la promotion de l'image : les mesures de police doivent être adaptées, nécessaires et proportionnées (triple test)."},{"id":"2023-2-11","s":"2023-2","n":11,"d":"CAJ","q":"Prévu par l'ordonnance du 24 novembre 2021, le code général de la fonction publique (CGFP) est entré en vigueur le 1er mars 2022. Il s'applique à la fonction publique de l'Etat et à la fonction publique :","o":["territoriale uniquement","hospitalière uniquement","territoriale et hospitalière"],"a":2,"c":"s","e":"Le CGFP s'applique aux trois versants : État, territoriale, hospitalière."},{"id":"2023-2-12","s":"2023-2","n":12,"d":"CAJ","q":"Vous êtes affecté(e) au bureau des élections d'une préfecture. Vous organisez une réunion publique à destination des candidats aux élections municipales dans un département où 90% des communes sont de moins de 1000 habitants. Vous devez expliquer que le mode de scrutin pour ce type de communes est :","o":["majoritaire, plurinominal, à deux tours","proportionnel, de liste, à deux tours avec prime majoritaire","binominal majoritaire à deux tours"],"a":0,"c":"s","e":"À la date du sujet, les communes de moins de 1 000 habitants votaient au scrutin majoritaire plurinominal à deux tours (panachage possible). La loi de 2025 a étendu le scrutin de liste à toutes les communes à compter de 2026."},{"id":"2023-2-13","s":"2023-2","n":13,"d":"CAJ","q":"Qui est le représentant de l'Etat au niveau régional ?","o":["Le préfet de région","Le recteur d'académie","Le préfet de région et le recteur d'académie"],"a":0,"c":"s","e":"Le préfet de région est le représentant de l'État dans la région."},{"id":"2023-2-14","s":"2023-2","n":14,"d":"CAJ","q":"Un acte administratif doit être notifié pour produire ses effets :","o":["lorsqu'il s'agit d'une décision individuelle","lorsqu'il s'agit d'une décision collective","quelle que soit la nature de la décision produite"],"a":0,"c":"s","e":"Les décisions individuelles doivent être notifiées. Les actes réglementaires sont publiés."},{"id":"2023-2-15","s":"2023-2","n":15,"d":"CAJ","q":"La supériorité des traités internationaux sur la loi est imposée par :","o":["l'article 55 de la Constitution du 4 octobre 1958","la jurisprudence du Conseil Constitutionnel","la Cour de justice de l'Union européenne"],"a":0,"c":"s","e":"Art. 55 C : les traités régulièrement ratifiés ont une autorité supérieure à celle des lois."},{"id":"2023-2-16","s":"2023-2","n":16,"d":"CAJ","q":"La Cour des comptes est une :","o":["juridiction financière","autorité administrative indépendante","administration placée sous l'autorité du Premier ministre"],"a":0,"c":"s","e":"La Cour des comptes est une juridiction financière (art. 47-2 C)."},{"id":"2023-2-17","s":"2023-2","n":17,"d":"CAJ","q":"Quel principe a obtenu valeur constitutionnelle par une décision du Conseil constitutionnel du 25 juillet 1979 :","o":["la continuité du service public","le droit au respect de la vie privée","la liberté d'entreprendre"],"a":0,"c":"s","e":"Décision 79-105 DC du 25 juillet 1979 : la continuité du service public a valeur constitutionnelle."},{"id":"2023-2-18","s":"2023-2","n":18,"d":"CAJ","q":"L'organisation décentralisée de la République française a été introduite à l'article 1er de la Constitution par la révision constitutionnelle du :","o":["18 juin 1976","4 août 1995","28 mars 2003"],"a":2,"c":"s","e":"Révision du 28 mars 2003 (acte II de la décentralisation) : organisation décentralisée inscrite à l'article 1er."},{"id":"2023-2-19","s":"2023-2","n":19,"d":"CAJ","q":"Quelle affirmation est vraie ?","o":["La loi ordinaire à une valeur juridique supérieure à la loi organique","La loi ordinaire et la loi organique ont la même valeur juridique","La loi ordinaire doit être conforme à la loi organique"],"a":2,"c":"s","e":"Hiérarchie des normes : la loi ordinaire doit respecter la loi organique (contrôle du Conseil constitutionnel)."},{"id":"2023-2-20","s":"2023-2","n":20,"d":"CAJ","q":"En France, dans l'ordre de préséance de la Vème République, le quatrième personnage de l'Etat est :","o":["le Président du Sénat","le Premier ministre","le Président de l'Assemblée nationale"],"a":2,"c":"s","e":"Ordre protocolaire : Président de la République, Premier ministre, président du Sénat, président de l'Assemblée nationale (4e)."},{"id":"2023-2-21","s":"2023-2","n":21,"d":"CAJ","q":"La dissolution de l'Assemblée nationale est un droit :","o":["exclusivement réservé au Premier ministre","du Président de la République, sur avis conforme du président du Conseil constitutionnel","exclusivement réservé au Président de la République"],"a":2,"c":"s","e":"La dissolution (art. 12 C) est un pouvoir propre du Président, après consultation (avis simple) du Premier ministre et des présidents des assemblées."},{"id":"2023-2-22","s":"2023-2","n":22,"d":"CAJ","q":"La motion de censure prévue par la Constitution du 4 octobre 1958 est un moyen dont dispose l'Assemblée nationale pour :","o":["montrer sa désapprobation envers la politique du Gouvernement et provoquer sa démission","rejeter tout projet de loi contraire à la Constitution","contrôler le travail d'une commission parlementaire"],"a":0,"c":"s","e":"La motion de censure (art. 49 C) permet de renverser le Gouvernement."},{"id":"2023-2-23","s":"2023-2","n":23,"d":"CAJ","q":"Qui est compétent pour réviser la Constitution ?","o":["Le pouvoir constituant dérivé","Le pouvoir constituant originaire","Le pouvoir constituant secondaire"],"a":0,"c":"s","e":"La révision de la Constitution relève du pouvoir constituant dérivé (institué, art. 89). Le pouvoir originaire établit une nouvelle Constitution."},{"id":"2023-2-24","s":"2023-2","n":24,"d":"CAJ","q":"Parmi ces trois collectivités territoriales, une seule est une collectivité à statut sui generis, laquelle ?","o":["La métropole de Lyon","L'Eurométropole de Strasbourg","La métropole européenne de Lille"],"a":0,"c":"s","e":"La métropole de Lyon (2015) est une collectivité à statut particulier, et non un EPCI."},{"id":"2023-2-25","s":"2023-2","n":25,"d":"CAJ","q":"La déclaration du Président de la République devant le Parlement réuni en Congrès est suivie d'un débat :","o":["sans vote, sans sa présence","sans vote","sans vote, en sa présence"],"a":0,"c":"s","e":"Art. 18 C : débat hors la présence du Président, sans vote."},{"id":"2023-2-26","s":"2023-2","n":26,"d":"CAJ","q":"Vous êtes attaché(e) d'administration en poste au sein d'une préfecture. Vous constatez, dans le cadre de vos fonctions, la commission d'un délit par votre supérieur hiérarchique direct. Au titre de l'article 40 du code de procédure pénale, vous êtes tenu(e) de faire un signalement au :","o":["supérieur hiérarchique de votre supérieur","procureur de la République","référent déontologue ministériel pour le ministère de l'intérieur"],"a":1,"c":"s","e":"L'article 40 CPP impose de signaler au procureur de la République, même si l'auteur est le supérieur hiérarchique."},{"id":"2023-2-27","s":"2023-2","n":27,"d":"CAJ","q":"Quelles sont les sanctions disciplinaires du 1er groupe applicables aux fonctionnaires titulaires de l'État ?","o":["Blâme, avertissement, exclusion temporaire de fonctions de 1 à 3 jours","Blâme, avertissement, abaissement d'échelon à l'échelon immédiatement inférieur à celui détenu par le fonctionnaire","Blâme, exclusion temporaire de fonctions de 1 à 3 jours, abaissement d'échelon à l'échelon immédiatement inférieur à celui détenu par le fonctionnaire"],"a":0,"c":"s","e":"1er groupe : avertissement, blâme, exclusion temporaire de 1 à 3 jours."},{"id":"2023-2-28","s":"2023-2","n":28,"d":"CAJ","q":"Vous travaillez dans un bureau en charge des marchés publics et votre chef(fe) de bureau établit des contrats avec des sociétés appartenant à des membres de sa famille. Il peut vous être reproché un manquement :","o":["au devoir de réserve","à l'obligation de probité","à l'obligation de faire cesser ou prévenir les situations de conflits d'intérêts"],"a":2,"c":"p","e":"Contracter avec des sociétés de sa famille constitue une situation de conflit d'intérêts, que l'agent doit faire cesser ou prévenir (et une possible prise illégale d'intérêts)."},{"id":"2023-2-29","s":"2023-2","n":29,"d":"CAJ","q":"Jusqu'alors érigées par la jurisprudence administrative, les obligations de dignité, d'impartialité, d'intégrité, de probité, de neutralité et de respect de la laïcité ont été inscrites dans le statut général des fonctionnaires par la loi du :","o":["13 juillet 1983 portant droits et obligations des fonctionnaires","20 avril 2016 relative à la déontologie, aux droits et obligations des fonctionnaires","6 août 2019 de transformation de la fonction publique"],"a":1,"c":"s","e":"La loi du 20 avril 2016 inscrit dignité, impartialité, intégrité, probité, neutralité et laïcité dans le statut."},{"id":"2023-2-30","s":"2023-2","n":30,"d":"CAJ","q":"Le régime indemnitaire tenant compte des fonctions, des sujétions, de l'expertise et de l'engagement professionnel (RIFSEEP) se compose :","o":["de l'indemnité de fonctions, de sujétions, et d'expertise (IFSE) et du complément indemnitaire annuel (CIA)","du traitement indiciaire et de la nouvelle bonification indiciaire (NBI)","de l'indemnité de fonctions, de sujétions, et d'expertise (IFSE), du traitement indiciaire et du complément indemnitaire annuel (CIA)"],"a":0,"c":"s","e":"RIFSEEP = IFSE (fonctions, sujétions, expertise) + CIA (engagement et manière de servir)."},{"id":"2023-2-31","s":"2023-2","n":31,"d":"CAJ","q":"Vous êtes attaché(e), chef(fe) de bureau en préfecture. Il vous est proposé par une connaissance de vous porter candidat aux élections municipales de votre commune. Avant de répondre, vous interrogez votre service des ressources humaines et vous apprenez que :","o":["les chef(fe)s de bureau de préfecture ne peuvent pas être élu(e)s conseillers municipaux dans les communes situées dans le ressort où ils exercent ou ont exercé leurs fonctions depuis moins de six mois","aucune disposition n'interdit à un(e) chef(fe) de bureau de préfecture d'être élu(e) conseiller municipal","les chef(fe)s de bureau de préfecture ne peuvent être élu(e)s conseillers municipaux que dans une commune de moins de 1000 habitants. Toutefois, le code électoral proscrit à un(e) chef(fe) de bureau de préfecture de siéger au conseil communautaire"],"a":0,"c":"s","e":"Art. L. 231 du code électoral : inéligibilité dans le ressort d'exercice, pendant les fonctions et 6 mois après."},{"id":"2023-2-32","s":"2023-2","n":32,"d":"CAJ","q":"Vous êtes chef(fe) de bureau en administration centrale et vous avez toute latitude pour répartir une enveloppe indemnitaire exceptionnelle attribuée en raison des performances atteintes par votre bureau. Vous indiquez à vos collaborateurs que :","o":["cette enveloppe sera allouée en fonction de l'ancienneté des collaborateurs dans le service","vous répartirez l'enveloppe en fonction du degré d'atteinte par chacun de ses objectifs tel que constaté lors du dernier entretien professionnel","vous répartirez l'enveloppe de manière égale entre vos collaborateurs"],"a":1,"c":"s","e":"Une prime liée à la performance se répartit selon la manière de servir et l'atteinte des objectifs (logique du CIA)."},{"id":"2023-2-33","s":"2023-2","n":33,"d":"CAJ","q":"Quelles sont les positions administratives dans la fonction publique ?","o":["Activité, détachement, disponibilité et congé parental","Activité, détachement, mise à disposition et congé parental","Activité, détachement, disponibilité et congé longue durée"],"a":0,"c":"s","e":"Quatre positions : activité, détachement, disponibilité, congé parental."},{"id":"2023-2-34","s":"2023-2","n":34,"d":"CAJ","q":"Qu'appelle-t-on un emploi fonctionnel dans la fonction publique de l'Etat ?","o":["Un emploi correspondant à un type de fonctions spécifiques","Un cadre d'emploi particulier destiné à permettre de promouvoir des agents particulièrement compétents","Un emploi occupé par un agent exerçant une fonction nécessitant un grade supérieur à celui qu'il détient"],"a":0,"c":"s","e":"Un emploi fonctionnel correspond à des fonctions spécifiques de responsabilité (sous-directeur, directeur…), occupé par détachement."},{"id":"2023-2-35","s":"2023-2","n":35,"d":"CAJ","q":"Les commissions administratives paritaires (CAP) statuent sur :","o":["l'ensemble des décisions individuelles","les décisions individuelles défavorables","les mouvements"],"a":1,"c":"s","e":"Depuis la loi de 2019, les CAP sont compétentes pour les décisions individuelles défavorables."},{"id":"2023-2-36","s":"2023-2","n":36,"d":"CAJ","q":"La loi n° 2019-828 du 6 août 2019 de transformation de la fonction publique a notamment modifié l'organisation des instances de dialogue social en :","o":["plafonnant le nombre de réunions annuelles des instances de dialogue social","modifiant les règles de parité qui encadrent ces instances","fusionnant les comités techniques (CT) et les comités d'hygiène, de sécurité et des conditions de travail (CHSCT)"],"a":2,"c":"s","e":"La loi de 2019 fusionne CT et CHSCT en CSA."},{"id":"2023-2-37","s":"2023-2","n":37,"d":"CAJ","q":"Le pilotage de la masse salariale désigne notamment le contrôle :","o":["des dépenses relatives aux crédits de fonctionnement","de la consommation des crédits du titre II","du Parlement sur les administrations"],"a":1,"c":"s","e":"La masse salariale correspond aux crédits du titre 2 (dépenses de personnel)."},{"id":"2023-2-38","s":"2023-2","n":38,"d":"CAJ","q":"L'accompagnement personnalisé désigne un dispositif destiné à :","o":["garantir la santé et la sécurité au travail du bénéficiaire","prévoir un soutien spécifique mis en œuvre par le supérieur hiérarchique du bénéficiaire à l'occasion de sa prise de poste","aider l'agent à élaborer et à mettre en œuvre son projet professionnel"],"a":2,"c":"s","e":"L'accompagnement personnalisé aide l'agent à élaborer et mettre en œuvre son projet professionnel (conseiller mobilité-carrière)."},{"id":"2023-2-39","s":"2023-2","n":39,"d":"CAJ","q":"La loi n° 2016-483 du 20 avril 2016 relative à la déontologie et aux droits et obligations des fonctionnaires :","o":["renforce notamment la protection fonctionnelle des agents de la fonction publique","favorise le cumul d'activité pour les agents à temps complet","crée la Haute Autorité pour la transparence de la vie publique"],"a":0,"c":"s","e":"La loi de 2016 renforce la protection fonctionnelle (extension aux ayants droit, contenu précisé). La HATVP date de 2013."},{"id":"2023-2-40","s":"2023-2","n":40,"d":"CAJ","q":"Sauf dispositions spécifiques, l'entretien professionnel des fonctionnaires titulaires :","o":["est annuel et obligatoire","est organisé tous les 2 ans et obligatoire","n'est pas une obligation et son organisation relève de la décision du supérieur hiérarchique"],"a":0,"c":"s","e":"L'entretien professionnel est annuel et obligatoire, conduit par le supérieur hiérarchique direct."},{"id":"2023-2-41","s":"2023-2","n":41,"d":"CAJ","q":"Le Défenseur des droits, institué par la loi organique du 29 mars 2011, est la conséquence de la fusion de plusieurs institutions parmi lesquelles on trouve :","o":["la Commission nationale de l'informatique et des libertés","la Commission nationale de déontologie de la sécurité","le Contrôleur général des lieux de privation de liberté"],"a":1,"c":"s","e":"Le Défenseur des droits (2011) regroupe le Médiateur de la République, le Défenseur des enfants, la HALDE et la CNDS. Le CGLPL reste autonome."},{"id":"2023-2-42","s":"2023-2","n":42,"d":"CAJ","q":"L'autonomie financière des collectivités territoriales, en recettes comme en dépenses, a été mise en place par :","o":["l'acte I de la décentralisation","l'acte II de la décentralisation","la loi n° 2015-991 du 7 août 2015 portant nouvelle organisation territoriale de la République"],"a":1,"c":"s","e":"Acte II (révision de 2003) : autonomie financière des collectivités consacrée à l'article 72-2 C."},{"id":"2023-2-43","s":"2023-2","n":43,"d":"CAJ","q":"L'Opéra de Paris est un établissement public à caractère industriel et commercial (EPIC). Son directeur général est :","o":["élu par les représentants des personnels de l'Opéra de Paris","élu par le conseil d'administration (CA) de l'établissement","nommé par décret en conseil des ministres pris sur proposition du ministre chargé de la culture"],"a":2,"c":"s","e":"Le directeur général de l'Opéra de Paris est nommé par décret en conseil des ministres, sur proposition du ministre de la culture."},{"id":"2023-2-44","s":"2023-2","n":44,"d":"CAJ","q":"Après le ministère de l'Education nationale et de la jeunesse, le second employeur public de l'Etat est le ministère :","o":["des Armées","de l'Intérieur et des outre-mer","de la Justice"],"a":1,"c":"p","e":"En effectifs, le ministère de l'Intérieur (police et gendarmerie comprises) est le 2e employeur de l'État, devant les Armées. Classement proche selon les sources."},{"id":"2023-2-45","s":"2023-2","n":45,"d":"CAJ","q":"En matière de sécurité sanitaire des aliments, le Gouvernement a décidé, en 2022, la mise en place progressive :","o":["d'une gestion partagée entre la direction générale de l'alimentation (DGAL) et la direction générale de la concurrence, de la consommation et de la répression des fraudes (DGCCRF)","d'une gestion partagée entre la direction générale de l'alimentation (DGAL), la direction générale de la concurrence, de la consommation et de la répression des fraudes (DGCCRF) et la direction générale de la santé (DGS)","d'un pilotage unique sous l'égide du ministère de l'agriculture et de la souveraineté alimentaire"],"a":2,"c":"s","e":"En 2022, le Gouvernement a décidé une police unique de la sécurité sanitaire des aliments, confiée au ministère de l'agriculture (DGAL) en 2023."},{"id":"2023-2-46","s":"2023-2","n":46,"d":"CAJ","q":"Qu'est-ce qu'une faute de service au sens du droit administratif ?","o":["Une faute commise par un agent dans l'exercice de ses fonctions, pendant le service, avec les moyens du service et en dehors de tout intérêt personnel","Une faute nécessairement commise par plus d'un agent dans le service","Toute faute personnelle ou non, intentionnelle ou non, commise par un agent du service public"],"a":0,"c":"s","e":"La faute de service est commise dans le service, avec ses moyens, sans intérêt personnel. Elle se distingue de la faute personnelle."},{"id":"2023-2-47","s":"2023-2","n":47,"d":"CAJ","q":"L'élection des conseillers départementaux s'effectue selon un scrutin :","o":["de liste à deux tours","binominal majoritaire à deux tours","proportionnel à un tour"],"a":1,"c":"s","e":"Conseillers départementaux : scrutin binominal majoritaire à deux tours (depuis 2015)."},{"id":"2023-2-48","s":"2023-2","n":48,"d":"CAJ","q":"Qu'est-ce que la CADA, créée par la loi n° 78-753 du 17 juillet 1978 ?","o":["La commission d'appel des décisions administratives","La commission d'accès aux documents administratifs","La commission administrative du droit d'asile"],"a":1,"c":"s","e":"CADA : Commission d'accès aux documents administratifs."},{"id":"2023-2-49","s":"2023-2","n":49,"d":"CAJ","q":"Favoriser la mobilité et accompagner les transitions professionnelles des agents publics dans la fonction publique et le secteur privé est un axe issu de :","o":["la loi n° 2016-1088 du 8 août 2016 relative au travail, à la modernisation du dialogue social et à la sécurisation des parcours professionnels","la loi n° 2013-907 du 11 octobre 2013 relative à la transparence de la vie publique","la loi n° 2019-828 du 6 août 2019 de transformation de la fonction publique"],"a":2,"c":"s","e":"La loi de 2019 vise notamment à favoriser la mobilité et accompagner les transitions professionnelles (rupture conventionnelle, portabilité CDI…)."},{"id":"2023-2-50","s":"2023-2","n":50,"d":"FP","q":"La loi organique relative aux lois de finances (LOLF) du 1er août 2001 a notamment visé à revaloriser le rôle financier et budgétaire :","o":["de l'Assemblée nationale","du Parlement","du Sénat"],"a":1,"c":"s","e":"La LOLF a renforcé les pouvoirs budgétaires du Parlement (vote par mission, amendements, contrôle)."},{"id":"2023-2-51","s":"2023-2","n":51,"d":"FP","q":"Quel est le corollaire de la règle de non affectation des recettes et des dépenses ?","o":["Le principe d'universalité","Le principe d'annualité","Le principe de spécialité"],"a":0,"c":"s","e":"La non-affectation est une composante du principe d'universalité."},{"id":"2023-2-52","s":"2023-2","n":52,"d":"FP","q":"Vous êtes responsable d'un centre de services partagés, relié à un ordonnateur secondaire. Vous transmettez des factures au comptable public pour mise en paiement qu'il peut rejeter, car","o":["l'entreprise choisie n'a pas régularisé sa situation fiscale depuis son dernier contrôle","le prix du matériel acheté n'est pas conforme au bordereau de prix unitaire annexé au marché public","le matériel acheté est trop cher par rapport aux autres factures qu'il peut recevoir"],"a":1,"c":"s","e":"Le comptable contrôle la validité de la créance : conformité du prix au marché. Il ne juge pas l'opportunité."},{"id":"2023-2-53","s":"2023-2","n":53,"d":"FP","q":"Quel est le taux de la contribution sociale généralisée sur les revenus issus des salaires et des traitements ?","o":["8,50%","9,20%","7,80%"],"a":1,"c":"s","e":"CSG sur les revenus d'activité : 9,2 %."},{"id":"2023-2-54","s":"2023-2","n":54,"d":"FP","q":"Pour faire face au contexte particulier de la crise sanitaire, le Gouvernement a prolongé le 19 mai 2021 plusieurs dispositifs d'aide aux ménages et aux entreprises non prévus dans la loi de finances initiale. Quel acte réglementaire autorise l'ouverture de crédits supplémentaires en cours d'année pour toute dépense urgente ?","o":["Le décret d'avance","Le décret de virement","Le décret de transfert"],"a":0,"c":"s","e":"Le décret d'avance ouvre des crédits supplémentaires en cours d'année en cas d'urgence."},{"id":"2023-2-55","s":"2023-2","n":55,"d":"FP","q":"Le principe de spécialité budgétaire concerne uniquement :","o":["les dépenses","les recettes","les créances"],"a":0,"c":"s","e":"La spécialité s'applique aux dépenses (crédits affectés à un objet précis)."},{"id":"2023-2-56","s":"2023-2","n":56,"d":"FP","q":"Le texte qui réforme la responsabilité des gestionnaires publics est :","o":["le décret du 7 novembre 2012","la loi organique du 7 novembre 2022","l'ordonnance du 23 mars 2022"],"a":2,"c":"s","e":"Ordonnance du 23 mars 2022 : responsabilité financière des gestionnaires publics (en vigueur au 1er janvier 2023)."},{"id":"2023-2-57","s":"2023-2","n":57,"d":"FP","q":"Que désigne l'expression glissement vieillesse technicité (GVT) positif ?","o":["L'effet sur la masse salariale du remplacement de salariés âgés bien payés par des jeunes moins bien payés","L'effet sur la masse salariale des avancements à l'ancienneté et des promotions","Le garant de la valeur technique du point d'indice de la fonction publique"],"a":1,"c":"s","e":"GVT positif : hausse de la masse salariale due aux avancements et promotions."},{"id":"2023-2-58","s":"2023-2","n":58,"d":"FP","q":"Dans le cadre de l'élaboration du calendrier budgétaire, laquelle de ces propositions de phasage est erronée ?","o":["Conférences d'économie structurelle - lettres plafonds - saisine du Haut Conseil des Finances Publiques","Conférences de performance - lettre de cadrage - débat d'orientation budgétaire","Avis du Haut Conseil des finances publiques (HCFP) - adoption du projet de loi de finances - réponse du Gouvernement aux questionnaires budgétaires"],"a":1,"c":"p","e":"Phasage erroné : la lettre de cadrage intervient normalement avant les conférences budgétaires, et le débat d'orientation des finances publiques a lieu en juillet. Les suites A et C respectent le calendrier."},{"id":"2023-2-59","s":"2023-2","n":59,"d":"FP","q":"Les ordonnateurs sont chargés de plusieurs missions dont :","o":["la comptabilité des affectations, des autorisations d'engagement et des autorisations d'emplois","l'engagement, la liquidation et l'ordonnancement des dépenses","l'exécution des ordres de paiements ou d'encaissement"],"a":1,"c":"s","e":"L'ordonnateur engage, liquide et ordonnance. Le paiement relève du comptable."},{"id":"2023-2-60","s":"2023-2","n":60,"d":"FP","q":"En tant qu'agent public, vous êtes gestionnaire de fait lorsque vous :","o":["maniez des deniers publics sans y être habilité en tant que comptable public","financez un projet avec une enveloppe qui ne lui était pas destinée en loi de finances","opérez un transfert d'argent public vers un service public industriel et commercial"],"a":0,"c":"s","e":"Gestion de fait : maniement de deniers publics sans qualité de comptable public."},{"id":"2023-2-61","s":"2023-2","n":61,"d":"FP","q":"D'après la procédure usuelle de la dépense, vous mettez en œuvre la phase d'ordonnancement de la dépense lorsque vous :","o":["procédez à la liquidation de la dépense","donnez l'ordre au comptable de payer la dépense","donnez l'ordre au comptable de procéder à l'engagement de la dépense"],"a":1,"c":"s","e":"Ordonnancer, c'est donner au comptable l'ordre de payer la dépense."},{"id":"2023-2-62","s":"2023-2","n":62,"d":"FP","q":"Le déficit budgétaire est défini comme un montant financier résultant :","o":["de recettes du budget général inférieur aux dépenses","des intérêts de l'emprunt quand ils représentent plus de 50 % des dépenses","des autorisations d'engagements réalisées qui ne pourront être honorées dans l'année"],"a":0,"c":"s","e":"Déficit budgétaire : recettes du budget général inférieures aux dépenses."},{"id":"2023-2-63","s":"2023-2","n":63,"d":"FP","q":"Comment sont libellés les crédits du budget de l'Etat ?","o":["Exclusivement en autorisations d'engagement (AE)","Exclusivement en crédits de paiement (CP)","Obligatoirement en AE et en CP"],"a":2,"c":"s","e":"LOLF : les crédits sont votés en autorisations d'engagement (AE) et en crédits de paiement (CP)."},{"id":"2023-2-64","s":"2023-2","n":64,"d":"FP","q":"Sur quels critères s'exerce le contrôle budgétaire du Parlement sur la loi de finances ?","o":["L'appréciation de la soutenabilité de la programmation budgétaire","La prévention des risques encourus et l'analyse des facteurs explicatifs de la dépense et du coût des politiques publiques","La régularité et la sincérité de l'exécution de la loi de finances ainsi que le bon usage des deniers publics et de l'adéquation des moyens aux objectifs"],"a":2,"c":"s","e":"Le Parlement contrôle la régularité et la sincérité de l'exécution, le bon usage des deniers et l'adéquation des moyens aux objectifs."},{"id":"2023-2-65","s":"2023-2","n":65,"d":"FP","q":"Qui est en charge de la gestion de la dette publique en France ?","o":["La Banque de France","L'agence France Trésor","La direction générale du Trésor"],"a":1,"c":"s","e":"L'Agence France Trésor gère la dette et la trésorerie de l'État."},{"id":"2023-2-66","s":"2023-2","n":66,"d":"FP","q":"Vous êtes responsable du service « Budget et Administration » d'une école de service public. Votre chef(fe) d'établissement, ordonnateur secondaire, vous indique que l'achat d'un matériel a été reporté à l'année suivante et souhaite que les crédits ainsi libérés soient employés pour le versement de primes annuelles destinées au personnel de l'école. Vous lui indiquez que :","o":["vous allez solliciter cette autorisation au responsable du budget opérationnel de programme","vous allez procéder à une modification de votre programmation budgétaire en ce sens","ce n'est pas possible en raison du principe de fongibilité asymétrique"],"a":2,"c":"s","e":"Fongibilité asymétrique : impossible de basculer des crédits hors titre 2 vers des primes (titre 2)."},{"id":"2023-2-67","s":"2023-2","n":67,"d":"FP","q":"Auprès de quelle autorité peut-on contester une décision de la Cour des Comptes ?","o":["Le Conseil d'Etat","La Cour de cassation","Le ministre chargé de l'économie, des finances et de la souveraineté industrielle et numérique"],"a":0,"c":"s","e":"Les arrêts de la Cour des comptes peuvent faire l'objet d'un pourvoi en cassation devant le Conseil d'État (depuis 2023, appel devant la Cour d'appel financière pour la chambre du contentieux)."},{"id":"2023-2-68","s":"2023-2","n":68,"d":"FP","q":"Qui est l'ordonnateur responsable du budget des administrations déconcentrées régionales ?","o":["Le préfet","Le ministre chargé de l'économie, des finances et de la souveraineté industrielle et numérique","Le chef de chaque administration déconcentrée"],"a":0,"c":"s","e":"Le préfet de région est ordonnateur secondaire des dépenses des services déconcentrés régionaux."},{"id":"2023-2-69","s":"2023-2","n":69,"d":"FP","q":"Que prévoit la loi organique du 17 décembre 2012 relative à la programmation et à la gouvernance des finances publiques ?","o":["La création du Haut Conseil des finances publiques","La possibilité que la Cour des comptes assiste le Parlement dans son activité de contrôle de l'action du Gouvernement","Le cadre d'adoption de la loi de finances, structurée en missions, programmes et actions"],"a":0,"c":"s","e":"La loi organique du 17 décembre 2012 crée le Haut Conseil des finances publiques."},{"id":"2023-2-70","s":"2023-2","n":70,"d":"UE","q":"En matière de sécurité et de défense, si un Etat membre de l'Union européenne subit une agression :","o":["il existe une clause de défense mutuelle","l'Union européenne dispose d'une force armée propre pouvant intervenir à tout moment","il n'y a pas de politique de sécurité et de défense commune au niveau de l'Union européenne"],"a":0,"c":"s","e":"Art. 42-7 TUE : clause de défense mutuelle en cas d'agression armée d'un État membre."},{"id":"2023-2-71","s":"2023-2","n":71,"d":"UE","q":"Vous êtes citoyen(ne) d'un pays membre de l'Union européenne. Vous serez amené(e) à élire au suffrage universel direct les membres :","o":["du Parlement européen","du Conseil européen","de la Commission européenne"],"a":0,"c":"s","e":"Seuls les députés européens sont élus au suffrage universel direct."},{"id":"2023-2-72","s":"2023-2","n":72,"d":"UE","q":"Lorsqu'il y à une divergence entre une norme européenne et une norme nationale, c'est :","o":["la seconde qui est écartée au profit de la première","la première qui est écartée au profit de la seconde","la seconde qui est écartée au profit de la première uniquement s'il y a antériorité de la norme européenne"],"a":0,"c":"s","e":"Primauté du droit de l'UE : la norme nationale contraire est écartée, quelle que soit son antériorité."},{"id":"2023-2-73","s":"2023-2","n":73,"d":"UE","q":"Laquelle de ces institutions est une organisation intergouvernementale qui ne fait pas partie de l'Union européenne :","o":["le Conseil européen","le Conseil de l'Union européenne","le Conseil de l'Europe"],"a":2,"c":"s","e":"Le Conseil de l'Europe (1949, 46 États) est une organisation intergouvernementale distincte de l'UE."},{"id":"2023-2-74","s":"2023-2","n":74,"d":"UE","q":"Qui convoque le Conseil européen ?","o":["Son président","Le président de la Commission européenne","Chaque chef d'Etat ou de gouvernement qui le compose"],"a":0,"c":"s","e":"Le Conseil européen est convoqué par son président (art. 15 TUE)."},{"id":"2023-2-75","s":"2023-2","n":75,"d":"UE","q":"Parmi ces propositions, dans quel domaine l'Union européenne exerce-t-elle une compétence exclusive ?","o":["L'union douanière","L'industrie","La politique agricole commune"],"a":0,"c":"s","e":"L'union douanière est une compétence exclusive de l'UE (art. 3 TFUE). La PAC est partagée, l'industrie relève de l'appui."},{"id":"2023-2-76","s":"2023-2","n":76,"d":"UE","q":"Vous travaillez à la représentation permanente, l'ambassadeur vous demande de préparer des éléments de langage pour une réunion du COREPER. Il s'agit de la réunion des représentants permanents qui préparent les travaux du :","o":["Conseil de l'Union européenne","Parlement européen","Conseil de l'Europe"],"a":0,"c":"s","e":"Le COREPER prépare les travaux du Conseil de l'Union européenne."},{"id":"2023-2-77","s":"2023-2","n":77,"d":"UE","q":"La Charte des droits fondamentaux de l'Union européenne a :","o":["la même valeur que les traités européens","une valeur inférieure aux traités européens","une valeur supérieure aux traités européens"],"a":0,"c":"s","e":"Depuis Lisbonne, la Charte a la même valeur juridique que les traités."},{"id":"2023-2-78","s":"2023-2","n":78,"d":"UE","q":"Une demande d'adhésion à l'Union européenne doit être approuvée à :","o":["la majorité qualifiée par le Conseil de l'Union européenne, après avoir consulté la Commission européenne et après approbation du Parlement européen","l'unanimité par le Conseil de l'Union européenne, après consultation de la Commission européenne et approbation du Parlement européen","la majorité qualifiée par le Parlement européen, après avoir consulté la Commission européenne et après approbation du Conseil de l'Union européenne"],"a":1,"c":"s","e":"Art. 49 TUE : unanimité du Conseil après consultation de la Commission et approbation du Parlement européen."},{"id":"2023-2-79","s":"2023-2","n":79,"d":"UE","q":"À qui revient l'initiative des actes législatifs européens ?","o":["Au Parlement européen","Au Conseil de l'Union européenne","À la Commission européenne"],"a":2,"c":"s","e":"La Commission européenne dispose du quasi-monopole de l'initiative législative."},{"id":"2023-2-80","s":"2023-2","n":80,"d":"UE","q":"Combien y a-t-il actuellement de commissaires européens :","o":["Un par Etat-membre","Vingt","Deux pour les Etats dont la population est supérieure à 50 millions d'habitants, un pour les autres"],"a":0,"c":"s","e":"La Commission compte un commissaire par État membre (27)."},{"id":"2023-2-81","s":"2023-2","n":81,"d":"UE","q":"Le dernier pays à avoir rejoint la zone euro en 2023 est :","o":["la Croatie","la Lituanie","la Slovénie"],"a":0,"c":"s","e":"La Croatie a adopté l'euro le 1er janvier 2023 (20e membre)."},{"id":"2023-2-82","s":"2023-2","n":82,"d":"UE","q":"Parmi les critères d'adhésion à l'Union européenne définis par le Conseil européen de Copenhague, on retrouve :","o":["la mise en œuvre d'une politique de transition écologique","le respect de la liberté de la presse","la présence d'institutions stables garantissant la démocratie"],"a":2,"c":"s","e":"Critères de Copenhague : institutions stables garantissant démocratie et État de droit, économie de marché viable, reprise de l'acquis."},{"id":"2023-2-83","s":"2023-2","n":83,"d":"UE","q":"Le traité instituant la Communauté européenne du charbon et de l'acier (CECA) est entré en vigueur en :","o":["1949","1952","1957"],"a":1,"c":"s","e":"Le traité CECA (signé en 1951) est entré en vigueur en 1952."},{"id":"2023-2-84","s":"2023-2","n":84,"d":"UE","q":"Au 1er janvier 2022, l'Union européenne comptait :","o":["446,8 millions d'habitants","337,4 millions d'habitants","657,2 millions d'habitants"],"a":0,"c":"s","e":"L'UE comptait environ 447 millions d'habitants au 1er janvier 2022."},{"id":"2023-2-85","s":"2023-2","n":85,"d":"UE","q":"En matière de conservation des ressources biologiques de la mer dans le cadre de la politique commune de la pêche, l'Union européenne dispose d'une compétence :","o":["partagée avec les États membres","exclusive","d'appui des actions menées par les États membres"],"a":1,"c":"s","e":"La conservation des ressources biologiques de la mer est une compétence exclusive de l'UE (art. 3 TFUE)."},{"id":"2023-2-86","s":"2023-2","n":86,"d":"UE","q":"L'Union européenne soutient le développement des régions ultrapériphériques qui font partie de l'Union européenne :","o":["n'appliquant pas le droit de l'Union européenne","appliquant le droit de l'Union européenne avec des dérogations","appliquant le droit communautaire sans dérogation"],"a":1,"c":"s","e":"Les régions ultrapériphériques (dont les DROM) font partie de l'UE et appliquent son droit avec des adaptations (art. 349 TFUE)."},{"id":"2023-2-87","s":"2023-2","n":87,"d":"UE","q":"Quelle est la définition d'un trilogue ?","o":["Un accord entre trois Etats-membres","Une succession de présidence du Conseil de l'Union européenne","Un processus informel entre trois institutions de l'Union européenne sur des propositions législatives"],"a":2,"c":"s","e":"Le trilogue est une négociation informelle entre Parlement, Conseil et Commission sur un texte législatif."},{"id":"2023-2-88","s":"2023-2","n":88,"d":"UE","q":"La part des dépenses agricoles dans le budget de l'Union européenne tend à :","o":["croître : elle est passée de 31% au début des années 1980 à 66 % pour la période 2021-2027","décroître : elle est passée de 66 % au début des années 1980 à 31 % pour la période 2021- 2027","se stabiliser, autour de 30 % depuis les années 1980"],"a":1,"c":"s","e":"La part de la PAC est passée d'environ 66 % du budget européen au début des années 1980 à environ 31 % pour 2021-2027."},{"id":"2023-2-89","s":"2023-2","n":89,"d":"UE","q":"Le groupement européen de coopération territoriale (GECT), créé en 2006, sert à :","o":["subventionner les projets d'ordre éducatif, culturel ou en lien avec la jeunesse impliquant au moins deux territoires de deux Etats européens","réunir les présidents des exécutifs locaux d'Etats frontaliers pour favoriser les projets transfrontaliers, transnationaux ou interrégionaux","contribuer à éliminer les barrières administratives et juridiques auxquelles les régions sont confrontées lors de la mise en œuvre de projets transfrontaliers, transnationaux ou interrégionaux"],"a":2,"c":"s","e":"Le GECT (2006) facilite la coopération transfrontalière en levant les obstacles juridiques et administratifs."},{"id":"2023-2-90","s":"2023-2","n":90,"d":"NUM","q":"Un réseau privé virtuel (VPN) est :","o":["un intranet","une boucle de conversation privée","un système de sécurisation d'accès à des données"],"a":2,"c":"s","e":"Un VPN sécurise l'accès distant aux données et réseaux par un tunnel chiffré."},{"id":"2023-2-91","s":"2023-2","n":91,"d":"NUM","q":"Que recouvre la notion « d'informatique en nuage » (en anglais « cloud computing ») ?","o":["Le stockage de données identiques sur tous les ordinateurs d'une entité pour en garantir la sécurité","Le partage du stockage des ordinateurs personnels à tous les utilisateurs","L'utilisation de serveurs distants"],"a":2,"c":"s","e":"Le cloud computing repose sur l'utilisation de serveurs distants."},{"id":"2023-2-92","s":"2023-2","n":92,"d":"NUM","q":"Qu'est-ce qu'un rançongiciel (en anglais « ransomware ») ?","o":["Un virus qui détruit les informations personnelles","Un logiciel malveillant qui prend en otage des données","Une technique utilisée par des fraudeurs pour obtenir des renseignements personnels dans le but de perpêtrer une usurpation d'identité"],"a":1,"c":"s","e":"Un rançongiciel chiffre les données et exige une rançon. C = usurpation d'identité (phishing)."},{"id":"2023-2-93","s":"2023-2","n":93,"d":"NUM","q":"L'adresse IP désigne :","o":["le numéro de série d'un ordinateur","l'adresse numérique attribuée à un ordinateur connecté à un réseau","l'organisme, basé aux États-Unis d'Amérique, chargé d'attribuer les noms de domaine sur Internet"],"a":1,"c":"s","e":"L'adresse IP identifie un appareil connecté à un réseau. L'ICANN (C) attribue les noms de domaine."},{"id":"2023-2-94","s":"2023-2","n":94,"d":"NUM","q":"Un site Web est-il assujetti au dépôt légal ?","o":["Oui, tous les sites Web créés en France le sont depuis 2006","Non, le dépôt légal ne concerne que les éditions papier","Non, le dépôt légal a été abrogé en 2019"],"a":0,"c":"s","e":"Loi DADVSI (2006) : le web français est soumis au dépôt légal (BnF, INA)."},{"id":"2023-2-95","s":"2023-2","n":95,"d":"NUM","q":"Le droit au déréférencement consiste :","o":["pour une personne à demander à une entreprise de ne plus figurer dans ses listes de diffusion publicitaire","pour une autorité publique à faire supprimer des informations obsolètes publiées en ligne","à demander à un moteur de recherche de supprimer un résultat de recherche associé à vos noms et prénoms"],"a":2,"c":"s","e":"Droit au déréférencement (CJUE 2014 Google Spain) : faire supprimer d'un moteur de recherche des résultats associés à ses nom et prénom."},{"id":"2023-2-96","s":"2023-2","n":96,"d":"NUM","q":"Que recouvre la notion de « neutralité du net » ?","o":["Une égalité de traitement informatique de tous les flux de données","L'impossibilité pour les utilisateurs d'internet d'exprimer des opinions politiques ou religieuses","La gratuité d'utilisation du réseau internet pour tous les opérateurs"],"a":0,"c":"s","e":"Neutralité du net : égalité de traitement de tous les flux de données par les opérateurs."},{"id":"2023-2-97","s":"2023-2","n":97,"d":"NUM","q":"La fracture numérique désigne :","o":["les difficultés d'adaptation de certaines administrations aux évolutions numériques","les inégalités dans l'accès aux technologies de l'information et de la communication","une déconnexion intempestive lors de la réalisation d'une démarche en ligne"],"a":1,"c":"s","e":"La fracture numérique désigne les inégalités d'accès aux TIC."},{"id":"2023-2-98","s":"2023-2","n":98,"d":"NUM","q":"La Commission nationale de l'informatique et des libertés (CNIL) est :","o":["une autorité administrative indépendante","un établissement public administratif","un groupement d'intérêt public"],"a":0,"c":"s","e":"La CNIL est une autorité administrative indépendante."},{"id":"2023-2-99","s":"2023-2","n":99,"d":"NUM","q":"Vous êtes en charge de la sûreté d'un opérateur d'importance vitale. Un technicien vous alerte d'une atteinte à la sécurité d'un de vos systèmes d'information. Que faites-vous ?","o":["Vous prévenez la Gendarmerie Nationale","Vous contactez l'Agence nationale de la sécurité des systèmes d'information (ANSSI)","Vous dites à vos équipes de tout débrancher"],"a":1,"c":"s","e":"Un OIV doit signaler les incidents de sécurité à l'ANSSI."},{"id":"2023-2-100","s":"2023-2","n":100,"d":"NUM","q":"Quelle est la valeur juridique de la signature électronique ?","o":["Elle n'a de valeur qu'en interne dans une administration","La même qu'une signature manuscrite","Elle n'a pas de valeur"],"a":1,"c":"s","e":"La signature électronique a la même valeur probante que la signature manuscrite (art. 1367 du code civil), si elle est fiable."},{"id":"2023-2-101","s":"2023-2","n":101,"d":"NUM","q":"Qu'est-ce que la conformité aux normes d'accessibilité numérique ?","o":["Le fait de vérifier que tous les utilisateurs peuvent se connecter aux pages publiées par l'administration","Le fait de rendre accessibles les contenus publiés aux personnes en situation de handicap","L'action réalisée par un technicien informatique consistant à vérifier que votre ordinateur est bien relié au réseau informatique"],"a":1,"c":"s","e":"L'accessibilité numérique (RGAA) rend les contenus utilisables par les personnes en situation de handicap."},{"id":"2023-2-102","s":"2023-2","n":102,"d":"NUM","q":"Pouvez-vous utiliser librement les « données ouvertes » (en anglais « open data ») de l'État ?","o":["Non, avant une réutilisation, il est nécessaire d'obtenir l'autorisation de l'administration qui les a déposées","Oui sans contrainte","Oui mais les données ne sont librement réutilisables qu'après s'être déclaré auprès de la CNIL"],"a":1,"c":"s","e":"Les données publiques ouvertes sont librement réutilisables (Licence ouverte Etalab), avec la seule mention de la source."},{"id":"2023-2-103","s":"2023-2","n":103,"d":"NUM","q":"Le règlement général sur la protection des données (RGPD) protège :","o":["les entreprises et les administrations d'un État membre de l'Union européenne","les données à caractère personnel des personnes physiques collectées dans un État membre de l'Union européenne","les données concernant les transactions financières des entreprises établies en France"],"a":1,"c":"s","e":"Le RGPD protège les données personnelles des personnes physiques."},{"id":"2023-2-104","s":"2023-2","n":104,"d":"NUM","q":"Un employeur peut-il lire tous vos messages sur la messagerie professionnelle ?","o":["Oui, il peut lire tous les messages sur la messagerie professionnelle, sans exception","Non, il ne peut lire sans votre consentement les messages libellés comme étant personnels","Non, il ne peut lire aucun des messages contenus dans votre messagerie professionnelle sans votre consentement"],"a":1,"c":"s","e":"L'employeur ne peut ouvrir hors la présence du salarié les messages identifiés comme personnels. Les autres sont présumés professionnels."},{"id":"2023-2-105","s":"2023-2","n":105,"d":"NUM","q":"Qu'est-ce que FranceConnect ?","o":["Un dispositif permettant de simplifier et sécuriser la connexion à plus de 1400 services en ligne","Un moyen obligatoire pour s'identifier sur les réseaux de l'État","Un organisme qui surveille les connexions aux réseaux de l'État"],"a":0,"c":"s","e":"FranceConnect donne accès à plus de 1 400 services en ligne (chiffre variable)."},{"id":"2023-2-106","s":"2023-2","n":106,"d":"NUM","q":"Qu'est-ce que la charte graphique de l'État ?","o":["Un ensemble d'éléments permettant d'identifier les documents et communications émis par l'État","Les règles régissant le pavoisement des édifices publics","Les règles que devront respecter les communications officielles des Jeux Olympiques et Paralympiques de Paris en 2024"],"a":0,"c":"s","e":"La charte graphique de l'État (Marianne) harmonise l'identité visuelle des communications de l'État."},{"id":"2023-2-107","s":"2023-2","n":107,"d":"NUM","q":"Le directeur de l'établissement public dans lequel vous êtes affecté(e) vous demande s'il peut installer des caméras de vidéo protection filmant l'ensemble de la rue menant aux portes des bâtiments de l'établissement afin d'identifier les menaces terroristes potentielles. Que lui répondez-vous ?","o":["Oui, un établissement public peut filmer la voie publique","Non, il n'est possible de filmer que les abords immédiats des bâtiments","Oui, cette installation est possible avec l'autorisation du maire de la commune"],"a":1,"c":"s","e":"On ne peut filmer que les abords immédiats du bâtiment, pas l'ensemble de la voie publique (autorisation préfectorale requise)."},{"id":"2023-2-108","s":"2023-2","n":108,"d":"NUM","q":"En cas de refus d'une administration de transmettre les données personnelles qu'elle possède sur une personne qui en fait la demande, à qui cette personne doit-elle s'adresser ?","o":["À la Commission nationale de l'informatique et des libertés","Au Procureur de la République","À la Commission d'accès aux documents administratifs"],"a":0,"c":"s","e":"En cas de refus d'accès à ses données personnelles, on saisit la CNIL. La CADA traite les documents administratifs."},{"id":"2023-2-109","s":"2023-2","n":109,"d":"NUM","q":"Qu'est-ce que PIX ?","o":["Un logiciel populaire de retouches d'images","Un service public en ligne pour évaluer et certifier ses compétences numériques","Un format numérique de communication de l'État"],"a":1,"c":"s","e":"PIX est le service public d'évaluation et de certification des compétences numériques."},{"id":"2024-1","s":"2024","n":1,"d":"CAJ","q":"Vous êtes attaché(e) d'administration au sein d'un bureau en charge du contentieux. On vous interroge sur les caractéristiques de la procédure administrative :","o":["elle doit être écrite, contradictoire et inquisitoire","elle doit être orale, contradictoire et accusatoire","elle doit être orale, contradictoire et inquisitoire"],"a":0,"c":"s","e":"La procédure administrative contentieuse est écrite, contradictoire et inquisitoire (le juge dirige l'instruction)."},{"id":"2024-2","s":"2024","n":2,"d":"CAJ","q":"Le référé conservatoire permet de demander au juge administratif :","o":["de prendre toutes mesures de suspension de l'exécution d'une décision administrative","de prendre toutes mesures utiles à la sauvegarde des droits du requérant avant même que l'administration ait pris une décision","de prendre toutes mesures nécessaires à la sauvegarde d'une liberté fondamentale à laquelle une décision administrative aurait porté atteinte de manière grave et illégale"],"a":1,"c":"s","e":"Référé « mesures utiles » (art. L. 521-3 CJA) : toutes mesures utiles, sans faire obstacle à l'exécution d'une décision. C = référé-liberté ; A = référé-suspension."},{"id":"2024-3","s":"2024","n":3,"d":"CAJ","q":"À quelle autorité administrative indépendante (AAI) est spécifiquement dédié un titre de la constitution de 1958 ?","o":["Le Défenseur des droits","Le Conseil économique, social et environnemental (CESE)","La Commission d'accès aux documents administratifs (CADA)"],"a":0,"c":"s","e":"Le Défenseur des droits fait l'objet du titre XI bis de la Constitution (art. 71-1). Le CESE n'est pas une AAI."},{"id":"2024-4","s":"2024","n":4,"d":"CAJ","q":"Lorsqu'une loi ou une décision légale entraine une rupture d'égalité devant les charges publiques, la responsabilité de l'administration est dite :","o":["contractuelle pour faute","extracontractuelle pour faute","extracontractuelle sans faute"],"a":2,"c":"s","e":"Rupture d'égalité devant les charges publiques : responsabilité extracontractuelle sans faute (CE 1923 Couitéas ; 1938 La Fleurette)."},{"id":"2024-5","s":"2024","n":5,"d":"CAJ","q":"L'administration peut réclamer à un agent le remboursement de l'intégralité des dommages et intérêts versés dans le cadre d'un recours administratif :","o":["quand elle a indemnisé un dommage causé uniquement par la faute d'un agent","quand elle a indemnisé un dommage causé par une faute non dépourvue de tout lien avec le service","quand elle indemnisé un dommage causé cumulativement par une double faute à la fois personnelle et de service"],"a":0,"c":"s","e":"Action récursoire : remboursement intégral si le dommage résulte exclusivement de la faute personnelle de l'agent. En cas de cumul, remboursement partiel."},{"id":"2024-6","s":"2024","n":6,"d":"CAJ","q":"Depuis 2022, combien y-a-t-il de cours administratives d'appel ?","o":["101","13","9"],"a":2,"c":"s","e":"9 cours administratives d'appel depuis la création de celle de Toulouse en 2022."},{"id":"2024-7","s":"2024","n":7,"d":"CAJ","q":"Quel est le statut de l'Agence française anticorruption (AFA) instituée par la loi n° 2016-1691 du 9 décembre 2016 ?","o":["Un établissement public administratif","Un service à compétence nationale","Une autorité administrative indépendante"],"a":1,"c":"s","e":"L'AFA est un service à compétence nationale, rattaché aux ministres de la justice et du budget."},{"id":"2024-8","s":"2024","n":8,"d":"CAJ","q":"Qui assure la présidence du Conseil d'État ?","o":["Le Garde des sceaux, ministre de la justice","Le Premier ministre","Le Vice-président du Conseil d'État"],"a":2,"c":"p","e":"Le Premier ministre est formellement président du Conseil d'État, mais la présidence est effectivement assurée par le vice-président."},{"id":"2024-9","s":"2024","n":9,"d":"CAJ","q":"Vous êtes en charge du contrôle de légalité au sein d'une préfecture. Un maire d'une commune de moins de 5000 habitants vous demande s'il doit vous transmettre tous les actes pris par sa commune avant de les exécuter. Que lui répondez-vous ?","o":["Le contrôle de légalité est un contrôle a priori sur tous les actes de la commune","Le contrôle de légalité est un contrôle a priori sur une partie des actes de la commune","Le contrôle de légalité est un contrôle a posteriori sur une partie des actes de la commune"],"a":2,"c":"s","e":"Contrôle de légalité a posteriori, sur les seuls actes soumis à transmission obligatoire."},{"id":"2024-10","s":"2024","n":10,"d":"CAJ","q":"Qu'est-ce qu'une voie de fait en droit administratif ?","o":["Une action de l'administration réalisée sans droit qui porte matériellement et illégalement une atteinte grave à une liberté fondamentale ou à un droit de propriété","Une action contre les privilèges de l'administration par des créanciers lors d'un litige financier","Une atteinte physique à un agent public dans le cadre de ses fonctions"],"a":0,"c":"s","e":"Voie de fait (TC 2013 Bergoend) : action sans droit portant gravement atteinte à la liberté individuelle ou éteignant le droit de propriété."},{"id":"2024-11","s":"2024","n":11,"d":"CAJ","q":"Au nom de qui les décisions des tribunaux administratifs sont-elles rendues ?","o":["Au nom de l'État","Au nom
