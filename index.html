'Union européenne, lequel ne fait pas partie de l'espace Schengen ?","o":["La Lituanie","La Pologne","La Roumanie"],"a":2,"c":"s","e":"À la date du sujet, la Roumanie n'était pas dans l'espace Schengen. Elle y est entrée par voie aérienne et maritime en 2024, pleinement en 2025."},{"id":"2022-1-98","s":"2022-1","n":98,"d":"UE","q":"L'Union européenne dispose d'un statut de membre à part entière dans l'organisation suivante :","o":["l'Organisation Mondiale du Commerce","l'Organisation Mondiale de la Santé","l'Organisation des Nations unies pour l'éducation, la science et la culture"],"a":0,"c":"s","e":"L'UE est membre à part entière de l'OMC (aux côtés de ses États membres)."},{"id":"2022-1-99","s":"2022-1","n":99,"d":"UE","q":"Le Conseil des gouverneurs de la Banque centrale européenne a notamment pour missions de :","o":["définir la politique monétaire de la zone euro et prendre les décisions nécessaires à l'accomplissement des missions confiées à l'Eurosystème","mettre en œuvre la politique monétaire de la zone euro en lien avec les banques centrales nationales des pays de l'Union européenne","s'assurer de la coordination des politiques économiques et sociales des Etats membres de l'Union européenne"],"a":0,"c":"s","e":"Le Conseil des gouverneurs de la BCE définit la politique monétaire de la zone euro. Le directoire la met en œuvre."},{"id":"2022-1-100","s":"2022-1","n":100,"d":"UE","q":"Chef du service Europe et international au ministère de l'agriculture et de l'alimentation, vous êtes invité(e) à une conférence-débat dans une université sur le thème de la politique agricole commune (PAC) et de sa prochaine réforme. À un étudiant qui vous pose la question, vous répondez que la politique de développement rural représente environ :","o":["23% du budget de la PAC","77% du budget de la PAC","52% du budget de la PAC"],"a":0,"c":"s","e":"Le 2e pilier (développement rural) représente environ un quart du budget de la PAC."},{"id":"2022-1-101","s":"2022-1","n":101,"d":" ,"d":"NUM","q":"À quoi sert un Virtual Private Network (ou Réseau Privé Virtuel) ?","o":["À augmenter son débit internet","À sécuriser les échanges de données entre deux ordinateurs distants","À bloquer les logiciels malveillants"],"a":1,"c":"s","e":"Le VPN chiffre les échanges entre deux points distants via un tunnel sécurisé."},{"id":"2022-1-107","s":"2022-1","n":107,"d":"NUM","q":"À quoi sert le Réseau Interministériel de l'Etat (RIE) ?","o":["À structurer en un seul et unique réseau sécurisé l'ensemble des services de l'Etat","À réaliser le contrôle interne comptable et financier de l'ensemble des services déconcentrés de l'Etat","À constituer un réseau social dédié aux plateformes RH interministérielles"],"a":0,"c":"s","e":"Le RIE interconnecte de manière sécurisée l'ensemble des services de l'État."},{"id":"2022-1-108","s":"2022-1","n":108,"d":"NUM","q":"À quoi sert « FRANCE CONNECT » ?","o":["À sécuriser et simplifier la connexion à plusieurs sites de l'Etat en garantissant l'identité de l'utilisateur","À identifier des sites sécurisés","À décerner un label qualité aux sites d'administration en ligne"],"a":0,"c":"s","e":"FranceConnect sécurise et simplifie la connexion aux services en ligne en garantissant l'identité de l'utilisateur."},{"id":"2022-1-109","s":"2022-1","n":109,"d":"NUM","q":"Qu'est-ce que la stratégie nationale pour un numérique inclusif ?","o":["Une stratégie de développement d'équipements informatiques pour les personnes en situation de handicap","Une stratégie digitale visant à lutter contre les discriminations","Une stratégie mise en place pour former et accompagner les usagers les plus éloignés d'Internet"],"a":2,"c":"s","e":"La stratégie nationale pour un numérique inclusif (2018) vise à former et accompagner les publics éloignés du numérique."},{"id":"2022-1-110","s":"2022-1","n":110,"d":"NUM","q":"Qu'est-ce que l'erreur 504 du protocole de communication internet ?","o":["Un échec de connexion du fait d'un délai d'attente expiré lors du e-nous une fois » ?","o":["Le partage des données entre administrations habilitées, afin de simplifier les démarches en ligne","La restriction de la consultation de données en ligne","Le recueil de l'avis des utilisateurs sur les applicatifs ministériels"],"a":0,"c":"s","e":"« Dites-le-nous une fois » : échanges de données entre administrations pour ne plus redemander les mêmes pièces."},{"id":"2022-1-116","s":"2022-1","n":116,"d":"NUM","q":"Le plan mis en place en novembre 2021 par le ministère de la transformation et de la fonction publiques en matière de numérique est :","o":["le plan d'échange de « bonnes pratiques sur le numérique »","le plan de « soutien au numérique »","le plan d'action « logiciels libres et communs numériques »"],"a":2,"c":"s","e":"Novembre 2021 : plan d'action « logiciels libres et communs numériques » de la DINUM."},{"id":"2022-1-117","s":"2022-1","n":117,"d":"NUM","q":"Que vise le programme « TECH.GOUV » piloté par la DINUM ?","o":["Il vise à développer le télétravail","Il vise à numériser les archives du gouvernement","Il vise à accélérer la transformation numérique du service public"],"a":2,"c":"s","e":"TECH.GOUV vise à accélérer la transformation numérique du service public."},{"id":"2022-1-118","s":"2022-1","n":118,"d":"NUM","q":"Le site « PIX » est :","o":["un service public en ligne d'évaluation, de développement et de certification de ses compétences numériques","un site en ligne qui permet de se connecter à des jeux en ligne","un service en ligne qui regroupe l'ensemble des offres d'emplois publics"],"a":0,"c":"s","e":"PIX est le service public d'évaluation et de certification des compétences numériques."},{"id":"2022-1-119","s":"2022-1","n":119,"d":"NUM","q":"Qu'est-ce qu'une arborescence ?","o":["Une liste de termes","Une représentation visuelle, en forme d'arbre, des pages d'un site internet","Une liste chronologique"],"a":1,"c":"s","e":"L'arborescence est la représentation hiérarchique (en arbre) des pages d'un site ou des dos l ou commercial ?","o":["Tribunal des conflits, 22 janvier 1921, Société commerciale de l'Ouest africain","Tribunal des conflits, 22 janvier 1955, Naliato","Tribunal des conflits, 4 juillet 1983, Gambini"],"a":0,"c":"s","e":"TC 22 janvier 1921, Société commerciale de l'Ouest africain (Bac d'Eloka) : reconnaissance des SPIC."},{"id":"2022-2-12","s":"2022-2","n":12,"d":"CAJ","q":"Vous êtes en poste au sein du service contentieux d'une préfecture. Sur quel support doit être publié l'ensemble des actes réglementaires édictés par les services de l'Etat de votre département pour être opposables aux tiers ?","o":["Le Recueil des actes administratifs","Le Journal officiel de la République française","Tout support habilité à recevoir des annonces légales"],"a":0,"c":"s","e":"Les actes réglementaires des services de l'État dans le département sont publiés au recueil des actes administratifs (RAA) de la préfecture."},{"id":"2022-2-13","s":"2022-2","n":13,"d":"CAJ","q":"Lequel de ces organismes n'est pas un établissement public ?","o":["L'Institut national de recherche pour l'agriculture, l'alimentation et l'environnement","La Société nationale de sauvetage en mer","L'Office français de la biodiversité"],"a":1,"c":"s","e":"La SNSM est une association reconnue d'utilité publique, pas un établissement public."},{"id":"2022-2-14","s":"2022-2","n":14,"d":"CAJ","q":"Vous êtes attaché(e) dans un rectorat. Un enseignant géré par votre service a reçu un arrêté de changement d'échelon et souhaite contester cette décision. Il estime que la date de changement d'échelon vers l'échelon supérieur figurant sur son arrêté est erronée. Il peut contester la décision :","o":["dans les deux mois à compter de l'édition de l'arrêté par votre service de gestion","dans les deux mois à compter de la signature de l'arrêté par le recteur d'académie","dans les deux mois à compter de la notification de l'arrêté"],"a":2,"c":"s","e":"Le délai de recours de 2 mois court à compter de la notification de la décision individuelle."},{"id":"2022-2-15","s":"2022-2","n":15,"d":"CAJ","q":"Quelle autorité assure l'intérim en cas d'empêchement du Président de la République ?","o":["Le Président de l'Assemblée nationale","Le Président du Sénat","Le Premier ministre"],"a":1,"c":"s","e":"Art. 7 C : l'intérim est assuré par le président du Sénat."},{"id":"2022-2-16","s":"2022-2","n":16,"d":"CAJ","q":"La Constitution prévoit que le nombre de sénateurs ne peut excéder :","o":["348","288","576"],"a":0,"c":"s","e":"Art. 24 C : 348 sénateurs au plus (577 députés au plus)."},{"id":"2022-2-17","s":"2022-2","n":17,"d":"CAJ","q":"Quelle autorité proclame les résultats de l'élection présidentielle ?","o":["Le secrétaire général de la Présidence de la République","Le ministre de l'intérieur","Le Conseil constitutionnel"],"a":2,"c":"s","e":"Le Conseil constitutionnel veille à la régularité de l'élection présidentielle et en proclame les résultats (art. 58 C)."},{"id":"2022-2-18","s":"2022-2","n":18,"d":"CAJ","q":"Un référendum, dit d'initiative partagée, peut être organisé, aux termes de l'article 11 de la Constitution, à l'initiative :","o":["d'un cinquième des membres du Parlement, soutenu par un cinquième des électeurs inscrits sur les listes électorales","d'un cinquième des membres du Parlement, soutenu par un dixième des électeurs inscrits sur les listes électorales","d'un dixième des membres du Parlement, soutenu par un cinquième des électeurs inscrits sur les listes électorales"],"a":1,"c":"s","e":"Art. 11 C : 1/5 des membres du Parlement, soutenus par 1/10 des électeurs inscrits."},{"id":"2022-2-19","s":"2022-2","n":19,"d":"CAJ","q":"Quels sont les textes figurant dans le bloc de constitutionnalité ?","o":["La Constitution de 1958","La Constitution de 1958, la Déclaration des droits de l'Homme et du Citoyen de 1789, le Préambule de la Constitution de 1946 et la Charte du numérique","La Constitution du 4 octobre 1958, la Déclaration des droits de l'Homme et du Citoyen de 1789, le Préambule de la Constitution de 1946 et la Charte de l'environnement de 2004"],"a":2,"c":"s","e":"Bloc de constitutionnalité : Constitution de 1958, DDHC 1789, Préambule de 1946, Charte de l'environnement 2004 (et PFRLR, objectifs de valeur constitutionnelle)."},{"id":"2022-2-20","s":"2022-2","n":20,"d":"CAJ","q":"La citation selon laquelle « Toute société dans laquelle la garantie des droits n'est pas assurée, ni la séparation des pouvoirs déterminée, n'a point de Constitution », provient :","o":["de la Constitution du 4 octobre 1958","du Préambule de la Constitution du 27 octobre 1946","de la Déclaration des droits de l'Homme et du Citoyen du 26 août 1789"],"a":2,"c":"s","e":"Article 16 de la DDHC du 26 août 1789."},{"id":"2022-2-21","s":"2022-2","n":21,"d":"CAJ","q":"Selon l'article 68 de la Constitution, la destitution du Président de la République est prononcée par le Parlement constitué en :","o":["Cour de justice de la République","Haute Cour","Haute Cour de justice"],"a":1,"c":"s","e":"Art. 68 C : destitution par le Parlement constitué en Haute Cour."},{"id":"2022-2-22","s":"2022-2","n":22,"d":"CAJ","q":"Dans le cadre d'un empêchement provisoire du Président de la République, quel pouvoir le président par intérim ne peut-il pas exercer ?","o":["L'organisation d'un référendum","La nomination des ministres","Le pouvoir d'engager la force nucléaire"],"a":0,"c":"s","e":"Art. 7 C : le président par intérim ne peut ni recourir au référendum (art. 11) ni dissoudre l'Assemblée (art. 12)."},{"id":"2022-2-23","s":"2022-2","n":23,"d":"CAJ","q":"Les membres du Gouvernement auteurs de délits commis dans l'exercice de leurs fonctions sont jugés par :","o":["la Cour de justice de la République","la Haute Cour","le tribunal correctionnel de Paris"],"a":0,"c":"s","e":"Art. 68-1 C : la Cour de justice de la République juge les ministres pour les crimes et délits commis dans l'exercice de leurs fonctions."},{"id":"2022-2-24","s":"2022-2","n":24,"d":"CAJ","q":"Dans les collectivités d'outre-mer, les lois et règlements :","o":["sont applicables de plein droit mais peuvent faire l'objet d'adaptations tenant aux caractéristiques et contraintes particulières de ces collectivités","ne sont pas applicables de plein droit","sont applicables de plein droit"],"a":1,"c":"s","e":"Art. 74 C : les collectivités d'outre-mer relèvent en principe de la spécialité législative. Les lois ne s'y appliquent que sur mention expresse, à la différence des DROM (art. 73)."},{"id":"2022-2-25","s":"2022-2","n":25,"d":"CAJ","q":"Vous êtes responsable des listes électorales dans votre commune et on vous demande de faire un point sur le droit de vote des ressortissants de l'Union européenne. Ces derniers peuvent voter pour :","o":["les élections présidentielles et européennes","les élections européennes et municipales","les élections législatives et municipales"],"a":1,"c":"s","e":"Les ressortissants de l'UE votent aux élections municipales et européennes (art. 88-3 C)."},{"id":"2022-2-26","s":"2022-2","n":26,"d":"CAJ","q":"La révision constitutionnelle du 23 juillet 2008 permet la réunion du Congrès du Parlement :","o":["pour une révision de la Constitution","pour entendre une déclaration du Président de la République","pour adopter dans les mêmes termes un texte législatif"],"a":1,"c":"s","e":"Depuis 2008, le Président peut prendre la parole devant le Congrès (art. 18 C). La révision constitutionnelle existait déjà."},{"id":"2022-2-27","s":"2022-2","n":27,"d":"CAJ","q":"Vous êtes responsable du déroulé des élections législatives et vous devez expliquer aux agents qui travaillent avec vous le mode de scrutin. Vous leur expliquez que les députés sont élus au suffrage universel direct, au :","o":["scrutin majoritaire à deux tours","scrutin majoritaire à un tour","scrutin de liste à deux tours"],"a":0,"c":"s","e":"Députés : scrutin uninominal majoritaire à deux tours."},{"id":"2022-2-28","s":"2022-2","n":28,"d":"CAJ","q":"Un fonctionnaire peut-il se présenter à son poste de travail en tenue exubérante ?","o":["Oui, en vertu du principe de liberté vestimentaire","Non, en vertu de l'obligation de dignité","Non, en vertu de l'obligation de neutralité"],"a":1,"c":"s","e":"Obligation de dignité : la tenue doit rester compatible avec les fonctions et l'image du service."},{"id":"2022-2-29","s":"2022-2","n":29,"d":"CAJ","q":"Un fonctionnaire, placé sous votre autorité au sein d'une préfecture, vous informe de son projet de publier un récit romancé ayant pour sujet la vie quotidienne dans une administration. Que lui répondez-vous ?","o":["En tant que fonctionnaire, il ne peut exercer aucune autre activité rémunérée","La publication d'une œuvre de l'esprit par un fonctionnaire est libre, dans les limites du respect du code de la propriété intellectuelle et des obligations déontologiques","La publication d'une œuvre de l'esprit par un fonctionnaire est soumise à l'autorisation préalable de sa hiérarchie, doit respecter le code de la propriété intellectuelle et ne pas contrevenir aux obligations déontologiques"],"a":1,"c":"s","e":"La production d'œuvres de l'esprit est libre (art. L. 123-2 CGFP), dans le respect de la propriété intellectuelle et des obligations déontologiques (réserve, discrétion)."},{"id":"2022-2-30","s":"2022-2","n":30,"d":"CAJ","q":"Vous êtes chef(fe) de bureau. Un de vos agents est victime d'injures et menaces dans l'exercice de ses fonctions par un usager : quel dispositif pouvez-vous proposer à l'agent dans le cadre de la prise en charge par l'administration de cette situation ?","o":["La protection juridique","La protection judiciaire","La protection fonctionnelle"],"a":2,"c":"s","e":"La protection fonctionnelle protège l'agent victime de menaces, injures, violences ou outrages à l'occasion de ses fonctions."},{"id":"2022-2-31","s":"2022-2","n":31,"d":"CAJ","q":"En tant que chef(fe) de service au sein d'une administration, quels indicateurs utilisez-vous afin de diagnostiquer les risques psychosociaux de votre service ?","o":["Le taux d'absentéisme, le taux de rotation des agents, le nombre d'actes de violence envers les agents","Le nombre de congés pris, la pyramide des âges, le taux de mobilité interne","La part des agents en télétravail, le taux de formation des agents, la part de dépenses de fonctionnement"],"a":0,"c":"s","e":"Indicateurs de RPS : absentéisme, rotation (turn-over), violences, accidents, visites médicales… (grille ANACT)."},{"id":"2022-2-32","s":"2022-2","n":32,"d":"CAJ","q":"Vous êtes chef(fe) de service et un de vos agents décide de faire grève de façon inopinée : comment réagissez-vous ?","o":["Vous laissez l'agent exercer son droit de grève","Vous rappelez à l'agent que la grève doit être précédée d'un préavis et qu'il s'expose à des sanctions disciplinaires","Vous décomptez une journée au titre des congés à l'agent gréviste"],"a":1,"c":"p","e":"Dans la fonction publique, la grève doit être couverte par un préavis syndical (5 jours francs). Une cessation inopinée hors préavis est illicite et passible de sanctions."},{"id":"2022-2-33","s":"2022-2","n":33,"d":"CAJ","q":"Vous êtes chef(fe) de bureau. Un agent placé sous votre autorité souhaite recourir au télétravail pour la première fois et vous sollicite pour savoir s'il peut bénéficier d'une indemnité pour recouvrer les frais engagés dans ce cadre. Vous lui indiquez :","o":["qu'il n'existe aucun dispositif de la sorte à ce jour","qu'il existe un forfait télétravail fixé à 3,50 € par journée de télétravail effectuée","qu'il existe un forfait télétravail fixé à 2,50 € par journée de télétravail effectuée dans la limite de 220 € par an"],"a":2,"c":"s","e":"À la date du sujet : forfait télétravail de 2,50 € par jour, plafonné à 220 € par an. Il a été revalorisé depuis (2,88 € par jour en 2024)."},{"id":"2022-2-34","s":"2022-2","n":34,"d":"CAJ","q":"Il est interdit au fonctionnaire d'exprimer ses opinions personnelles à l'intérieur ou à l'extérieur du service dès lors que ses propos entravent le fonctionnement du service ou jettent le discrédit sur l'administration. Il s'agit de :","o":["l'obligation de secret professionnel","l'obligation de réserve","l'obligation de discrétion professionnelle"],"a":1,"c":"s","e":"L'obligation de réserve encadre l'expression des opinions personnelles, en service comme hors service."},{"id":"2022-2-35","s":"2022-2","n":35,"d":"CAJ","q":"Les commissions administratives paritaires sont compétentes pour émettre un avis sur :","o":["les demandes de congé parental","les demandes de révision du compte rendu d'entretien professionnel","les propositions de promotion et d'avancement"],"a":1,"c":"s","e":"Depuis la loi de 2019, les CAP ne sont plus compétentes pour les promotions (2021) ni les mutations (2020). Elles restent saisies des décisions individuelles défavorables, dont la révision du compte rendu d'entretien."},{"id":"2022-2-36","s":"2022-2","n":36,"d":"CAJ","q":"Dans votre service, un agent à temps plein souhaite cumuler une activité avec son emploi. Vous pouvez l'autoriser à :","o":["donner des consultations, des expertises ou à plaider en justice","exercer une activité accessoire d'enseignement","être gérant d'une société"],"a":1,"c":"s","e":"L'enseignement est une activité accessoire qui peut être autorisée. La consultation en justice contre l'administration et la gérance de société sont interdites."},{"id":"2022-2-37","s":"2022-2","n":37,"d":"CAJ","q":"Quelle nouvelle instance de représentation du personnel sera mise en place à l'issue des prochaines élections professionnelles de la fonction publique du 8 décembre 2022?","o":["Le comité social","Le comité technique","Le comité d'hygiène, de sécurité et des conditions de travail"],"a":0,"c":"s","e":"Le comité social d'administration (CSA) est installé à l'issue des élections du 8 décembre 2022."},{"id":"2022-2-38","s":"2022-2","n":38,"d":"CAJ","q":"Selon la loi du 20 avril 2016 relative à la déontologie et aux droits et obligations des fonctionnaires, à compter de la date où elle a eu connaissance de la faute commise, dans quel délai l'administration peut-elle intenter une action disciplinaire contre l'un de ses agents ?","o":["6 mois","1 an","3 ans"],"a":2,"c":"s","e":"Loi de 2016 : l'action disciplinaire se prescrit par 3 ans à compter de la connaissance des faits par l'administration."},{"id":"2022-2-39","s":"2022-2","n":39,"d":"CAJ","q":"Vous êtes chef(fe) de service dans une direction départementale de l'emploi, du travail et des solidarités. Un agent de votre service vous fait part de son souhait de quitter ses fonctions. Les jours suivants, cet agent ne se présente plus sur son lieu de travail. Il est :","o":["en situation de démission","en situation de rupture conventionnelle","en situation d'abandon de poste"],"a":2,"c":"s","e":"L'abandon de poste suppose une absence injustifiée persistante après mise en demeure. Il permet une radiation des cadres sans procédure disciplinaire."},{"id":"2022-2-40","s":"2022-2","n":40,"d":"CAJ","q":"Vous êtes attaché d'administration au ministère de l'intérieur et des outre-mer et souhaitez effectuer une mobilité vers un poste d'attaché au ministère de l'éducation nationale et de la jeunesse. Pour effectuer votre mobilité, vous allez solliciter :","o":["une demande de détachement","une demande de mobilité inter-fonction publique","une demande de mobilité au sein du corps interministériel à gestion ministérielle des attachés d'administration de l'Etat"],"a":2,"c":"s","e":"Le corps des attachés est un CIGeM : la mobilité entre ministères se fait sans détachement, au sein du même corps interministériel."},{"id":"2022-2-41","s":"2022-2","n":41,"d":"CAJ","q":"Vous êtes responsable des ressources humaines dans un rectorat. Un agent vient vous consulter pour connaître les possibilités qui lui sont offertes pour bénéficier d'un temps de préparation personnel pour se préparer à un concours ou examen professionnel. Vous l'informez de :","o":["la nécessité de poser un congé","la possibilité de solliciter une autorisation d'absence auprès de son supérieur hiérarchique dans la limite de 5 jours au total par année civile","la possibilité d'utiliser son compte épargne temps et à défaut son CPF dans la limite de 5 jours au total par année civile"],"a":2,"c":"s","e":"Temps de préparation personnelle aux concours : dans la limite de 5 jours par an, en mobilisant le compte épargne-temps, à défaut le CPF."},{"id":"2022-2-42","s":"2022-2","n":42,"d":"CAJ","q":"Un conseiller régional a été élu en 2021. En quelle année son mandat devra-t-il être renouvelé ?","o":["2025","2026","2027"],"a":2,"c":"p","e":"Question devenue fausse : la loi du 22 février 2021 a fixé la fin du mandat des conseillers élus en juin 2021 à mars 2028. Réponse attendue : 2027."},{"id":"2022-2-43","s":"2022-2","n":43,"d":"CAJ","q":"Qu'est-ce qu'une métropole ?","o":["Un établissement public de coopération interrégionale à fiscalité propre","Un établissement public de coopération intercommunale à fiscalité propre","Un établissement public de coopération interdépartementale à fiscalité propre"],"a":1,"c":"s","e":"La métropole est un EPCI à fiscalité propre (loi MAPTAM 2014)."},{"id":"2022-2-44","s":"2022-2","n":44,"d":"CAJ","q":"Quel type de contrat de recrutement d'agents non titulaires a été créé par la loi du 6 août 2019 dite « Loi de transformation de la fonction publique » ?","o":["Le contrat de mission","Le contrat de projet","Le contrat d'objectif"],"a":1,"c":"s","e":"La loi de 2019 crée le contrat de projet (1 à 6 ans), pour une mission ou une opération identifiée."},{"id":"2022-2-45","s":"2022-2","n":45,"d":"CAJ","q":"Vous accueillez un stagiaire attaché et devez lui expliquer le fonctionnement de la nouvelle bonification indiciaire (NBI). Vous précisez qu'elle est attribuée :","o":["en fonction de l'emploi occupé","en fonction de la catégorie de l'agent qui l'occupe","en fonction de la catégorie de l'agent et du niveau de responsabilité de l'emploi occupé"],"a":0,"c":"s","e":"La NBI est attachée à l'emploi occupé (responsabilité ou technicité particulière), pas au grade."},{"id":"2022-2-46","s":"2022-2","n":46,"d":"CAJ","q":"Une circulaire qui comporte une interprétation du droit positif doit faire l'objet d'une publication :","o":["dans les vingt-quatre heures suivant sa signature","dans les quatre mois suivant sa signature","dans les deux mois suivant sa signature"],"a":1,"c":"s","e":"Une circulaire non publiée dans les 4 mois est réputée abrogée (décret de 2008, repris par le CRPA)."},{"id":"2022-2-47","s":"2022-2","n":47,"d":"CAJ","q":"Quel est le statut de la Corse ?","o":["Une collectivité territoriale","Une collectivité à statut particulier au sens de l'article 72 de la Constitution","Une collectivité d'outre-mer"],"a":1,"c":"s","e":"La Collectivité de Corse est une collectivité à statut particulier (art. 72 C), unique depuis 2018."},{"id":"2022-2-48","s":"2022-2","n":48,"d":"CAJ","q":"Quelle juridiction a compétence pour statuer sur les recours formés contre les décisions rendues par l'Office français de protection des réfugiés et apatrides (OFPRA) :","o":["la Commission des recours des réfugiés","la Cour administrative du droit d'asile","la Cour nationale du droit d'asile"],"a":2,"c":"s","e":"La Cour nationale du droit d'asile (CNDA) connaît des recours contre les décisions de l'OFPRA."},{"id":"2022-2-49","s":"2022-2","n":49,"d":"CAJ","q":"Qui est secrétaire général du Gouvernement ?","o":["Marc Guillaume","Stéphane Bouillon","Claire Landais"],"a":2,"c":"s","e":"À la date du sujet, Claire Landais était SGG (2020-2023). Elle a été remplacée ensuite."},{"id":"2022-2-50","s":"2022-2","n":50,"d":"CAJ","q":"Quelle loi transfère les compétences de la commune en matière de plan local d'urbanisme à l'intercommunalité ?","o":["La loi du 27 janvier 2014 dite loi MAPTAM","La loi du 7 aout 2015 dite loi NOTRe","La loi du 24 mars 2014 dite loi ALUR"],"a":2,"c":"s","e":"La loi ALUR (24 mars 2014) organise le transfert automatique du PLU aux communautés (PLUi), sauf minorité de blocage."},{"id":"2022-2-51","s":"2022-2","n":51,"d":"CAJ","q":"L'aide sociale à l'enfance est un service relevant :","o":["de la commune","du département","de la région"],"a":1,"c":"s","e":"L'aide sociale à l'enfance (ASE) est une compétence du département."},{"id":"2022-2-52","s":"2022-2","n":52,"d":"CAJ","q":"Les présidents de chambres de la Cour des comptes sont nommés :","o":["par décret simple","par décret en Conseil d'Etat","par décret du Président de la République"],"a":2,"c":"s","e":"Les présidents de chambre de la Cour des comptes sont nommés par décret du Président de la République."},{"id":"2022-2-53","s":"2022-2","n":53,"d":"CAJ","q":"Vous êtes chargé du contentieux au ministère de l'intérieur. Un recours que vous avez à traiter est dirigé contre une élection régionale, vous saisissez :","o":["le Conseil d'Etat compétent en première instance","le tribunal administratif où l'élection a eu lieu","le Conseil constitutionnel, juge de toutes les élections"],"a":0,"c":"s","e":"Art. L. 361 du code électoral : les élections régionales sont contestées directement devant le Conseil d'État, en premier et dernier ressort."},{"id":"2022-2-54","s":"2022-2","n":54,"d":"CAJ","q":"Le Conseil d'État a admis dans son arrêt Jamart de 1936 que :","o":["le ministre dispose d'un pouvoir réglementaire pour organiser ses services","le Premier ministre dispose d'un pouvoir réglementaire pour organiser ses services","la Commission nationale de l'informatique et des libertés et le Conseil supérieur de l'audiovisuel disposent d'un pouvoir réglementaire afin de mener à bien leur mission"],"a":0,"c":"s","e":"CE 1936 Jamart : chaque ministre, comme tout chef de service, dispose d'un pouvoir réglementaire pour organiser ses services."},{"id":"2022-2-55","s":"2022-2","n":55,"d":"CAJ","q":"Vous êtes en poste au sein de la direction départementale des territoires. Il revient à votre service d'organiser une enquête publique concernant un projet faisant l'objet d'une évaluation environnementale. Parmi les 3 propositions suivantes, laquelle est exacte :","o":["l'enquête pourra être conduite par une commission d'enquête dont la composition et les membres seront choisis par le préfet","la durée de l'enquête publique ne sera pas inférieure à trente jours","l'avis rendu par la commission d'enquête liera l'autorité administrative pour autoriser ou non le projet en jeu"],"a":1,"c":"s","e":"L'enquête publique d'un projet soumis à évaluation environnementale dure au moins 30 jours. Le commissaire est désigné par le président du TA et son avis ne lie pas l'autorité."},{"id":"2022-2-56","s":"2022-2","n":56,"d":"CAJ","q":"Vous êtes chef de bureau en charge des collectivités locales au sein d'une préfecture. Un agent de votre service vous sollicite afin de connaître les modalités de la création d'un établissement public de coopération intercommunale. Vous lui répondez :","o":["qu'une décision du tribunal administratif est requise","qu'un arrêté ministériel est nécessaire","qu'un arrêté préfectoral est impératif"],"a":2,"c":"s","e":"La création d'un EPCI est prononcée par arrêté préfectoral (ou interpréfectoral)."},{"id":"2022-2-57","s":"2022-2","n":57,"d":"CAJ","q":"Quelle base juridique confère au Président de la République des pouvoirs exceptionnels ?","o":["L'article 11 de la Déclaration des Droits de l'Homme et du Citoyen","L'article 16 de la Constitution","L'article 20 de la Constitution"],"a":1,"c":"s","e":"L'article 16 de la Constitution confère des pouvoirs exceptionnels au Président."},{"id":"2022-2-58","s":"2022-2","n":58,"d":"CAJ","q":"Sous la Ve République, l'Assemblée nationale a été dissoute à :","o":["quatre reprises","cinq reprises","six reprises"],"a":1,"c":"s","e":"À la date du sujet : 5 dissolutions. Une 6e a eu lieu en 2024."},{"id":"2022-2-59","s":"2022-2","n":59,"d":"CAJ","q":"Le responsable de la zone de défense et de sécurité de Paris est :","o":["le Gouverneur militaire de Paris","le préfet de police de Paris","le préfet de Paris, préfet de la région Île de France"],"a":1,"c":"s","e":"Le préfet de police de Paris est préfet de la zone de défense et de sécurité de Paris."},{"id":"2022-2-60","s":"2022-2","n":60,"d":"CAJ","q":"Vous êtes le référent laïcité d'un établissement public. Un agent vous sollicite pour savoir s'il peut bénéficier d'une autorisation d'absence à l'occasion d'une fête religieuse. Vous lui indiquez que son chef de service :","o":["ne peut lui accorder une telle autorisation en vertu du principe de laïcité","peut lui accorder une telle autorisation si les nécessités de service le permettent","doit lui accorder obligatoirement une telle autorisation"],"a":1,"c":"s","e":"Des autorisations d'absence pour fêtes religieuses peuvent être accordées si les nécessités du service le permettent (circulaire de 2012)."},{"id":"2022-2-61","s":"2022-2","n":61,"d":"FP","q":"Vous êtes adjoint gestionnaire chargé de l'élaboration du budget d'un établissement public local d'enseignement. La dotation allouée par la collectivité de rattachement est en diminution de 20% par rapport à l'exercice précédent. Pour réaliser l'équilibre du budget que vous allez présenter dans quelques jours, vous pouvez :","o":["prélever sur les fonds de roulement de l'établissement","solliciter une dotation complémentaire auprès des services financiers de la collectivité de rattachement","solliciter une dotation complémentaire auprès de la direction des services départementaux de l'éducation nationale"],"a":0,"c":"s","e":"Le budget d'un EPLE peut être équilibré par un prélèvement sur le fonds de roulement, dans les limites prudentielles."},{"id":"2022-2-62","s":"2022-2","n":62,"d":"FP","q":"Vous êtes chef(fe) d'un centre financier de services partagés et un gestionnaire budgétaire de votre service voudrait pouvoir exercer à mi-temps ses fonctions ainsi que celles de régisseur d'avances et de recettes au sein de la même structure. Vous lui indiquez que :","o":["cela est possible, sous réserve d'adresser une demande sous-couvert de la hiérarchie, à l'attention de la direction des ressources humaines, et ce, au moins trois mois avant la date d'effet","cela est organiquement incompatible au nom du principe de séparation des ordonnateurs et des comptables,","que la prime de régisseur sera proratisée"],"a":1,"c":"s","e":"Séparation de l'ordonnateur et du comptable : un même agent ne peut cumuler les fonctions de gestionnaire budgétaire (ordonnateur) et de régisseur, qui agit pour le compte du comptable."},{"id":"2022-2-63","s":"2022-2","n":63,"d":"FP","q":"Quel est le montant des dépenses fiscales en 2020 ?","o":["40 milliards d'euros","65 milliards d'euros","89 milliards d'euros"],"a":2,"c":"p","e":"Les dépenses fiscales avoisinaient 90 Md€ en 2020 (tome II de l'annexe Voies et moyens)."},{"id":"2022-2-64","s":"2022-2","n":64,"d":"FP","q":"Les marchés de l'Etat et de ses établissements peuvent être passés sans publicité, ni mise en concurrence préalables, si leur montant est inférieur à :","o":["euros HT","euros HT","euros HT"],"a":2,"c":"s","e":"Depuis 2020, les marchés inférieurs à 40 000 € HT peuvent être passés sans publicité ni mise en concurrence (100 000 € pour les travaux, à titre dérogatoire)."},{"id":"2022-2-65","s":"2022-2","n":65,"d":"FP","q":"Parmi ces propositions, laquelle ne fait pas partie des dépenses de personnel ?","o":["Les charges sociales imputables à l'employeur","Les impôts et taxes assis sur la rémunération","Les dépenses d'action sociale au profit des agents de l'Etat"],"a":2,"c":"s","e":"L'action sociale relève du titre 3 (fonctionnement), pas du titre 2 (personnel), qui comprend rémunérations, cotisations et prestations sociales."},{"id":"2022-2-66","s":"2022-2","n":66,"d":"FP","q":"D'après le schéma prévisionnel de consommation du plafond d'autorisation d'emplois, y a-t-il, en termes d'ETPT (équivalent temps plein travaillé), une équivalence entre un agent à mi-temps présent toute l'année et un agent à temps complet présent sur une période de 6 mois ?","o":["Non","Oui","Oui, sous certaines conditions"],"a":1,"c":"s","e":"ETPT : 1 agent à 50 % sur 12 mois = 0,5 ETPT ; 1 agent à 100 % sur 6 mois = 0,5 ETPT. Les deux sont équivalents."},{"id":"2022-2-67","s":"2022-2","n":67,"d":"FP","q":"Le traité sur la stabilité, la coordination et la croissance (TSCG), adopté en 2012, interdit à un Etat membre de l'Union européenne d'avoir un déficit structurel dépassant :","o":["0,5 % de son PIB (ou 1 % pour les pays dont la dette ne dépasse pas 60 % du PIB)","3 % de son PIB (ou 5 % pour les pays dont la dette ne dépasse pas 60 % du PIB)","5 % de son PIB (ou 3 % pour les pays dont la dette ne dépasse pas 60 % du PIB)"],"a":0,"c":"s","e":"TSCG (2012) : déficit structurel limité à 0,5 % du PIB (1 % si la dette est inférieure à 60 % du PIB). C'est la « règle d'or »."},{"id":"2022-2-68","s":"2022-2","n":68,"d":"FP","q":"Au sens du code des juridictions financières :","o":["tous les agents publics, les membres du Gouvernement et les ordonnateurs, élus locaux, sont justiciables de la Cour de discipline budgétaire et financière","les membres du Gouvernement et les ordonnateurs, élus locaux, ne sont pas justiciables de la","our de discipline budgétaire et financière C. les membres du Gouvernement ne sont pas justiciables de la Cour de discipline budgétaire et financière, et les ordonnateurs, élus locaux, ne le sont que dans certains cas exceptionnels"],"a":2,"c":"s","e":"Avant 2023 : les membres du Gouvernement n'étaient pas justiciables de la CDBF ; les élus locaux ordonnateurs seulement dans certains cas (réquisition, inexécution de décision de justice)."},{"id":"2022-2-69","s":"2022-2","n":69,"d":"FP","q":"Votre service réceptionne un questionnaire relatif à la préparation de la note d'exécution budgétaire de la mission afférente à votre ministère. L'institution pour laquelle vous préparez les éléments de réponse est :","o":["la Cour des comptes","la direction du budget au sein du ministère de l'économie, des finances et de la souveraineté industrielle et numérique","le Parlement"],"a":0,"c":"s","e":"Les notes d'exécution budgétaire (NEB) sont établies par la Cour des comptes, par mission, pour le Parlement."},{"id":"2022-2-70","s":"2022-2","n":70,"d":"FP","q":"Le principe d'unité de caisse implique :","o":["que tous les fonds de l'Etat sont gérés par la Caisse des dépôts et des consignations","que toutes les administrations de l'Etat disposent chacune d'un compte bancaire unique","que tous les fonds de l'Etat sont gérés par le Trésor public"],"a":2,"c":"s","e":"Unité de caisse : tous les fonds de l'État sont déposés au Trésor, sur un compte unique à la Banque de France."},{"id":"2022-2-71","s":"2022-2","n":71,"d":"FP","q":"Pour quelle raison existe-t-il une séparation entre l'ordonnateur et le comptable ?","o":["Pour éviter la gestion de fait","Pour permettre le suivi du paiement des dépenses","Pour permettre un meilleur contrôle des comptes publics"],"a":2,"c":"s","e":"La séparation ordonnateur/comptable permet un contrôle réciproque et limite les risques de malversation. La gestion de fait en est la violation."},{"id":"2022-2-72","s":"2022-2","n":72,"d":"FP","q":"La loi organique du 28 décembre 2021 relative à la modernisation de la gestion des finances publiques a créé les lois de finances :","o":["de rationalisation","de fin de gestion","de régularisation"],"a":1,"c":"s","e":"La loi organique du 28 décembre 2021 crée la loi de finances de fin de gestion."},{"id":"2022-2-73","s":"2022-2","n":73,"d":"FP","q":"Lors du vote du budget, quel article de la Constitution interdit au Parlement de créer ou d'aggraver une charge publique ?","o":["L'article 34","L'article 40","L'article 47"],"a":1,"c":"s","e":"Art. 40 C : irrecevabilité financière."},{"id":"2022-2-74","s":"2022-2","n":74,"d":"FP","q":"Une mission du budget de l'Etat est :","o":["obligatoirement interministérielle","obligatoirement ministérielle","soit ministérielle soit interministérielle"],"a":2,"c":"s","e":"Une mission peut être ministérielle ou interministérielle ; seule une loi de finances d'initiative gouvernementale peut la créer."},{"id":"2022-2-75","s":"2022-2","n":75,"d":"FP","q":"Le processus annuel de certification des comptes de l'Etat :","o":["relève du Parlement, qui vote l'acte annuel de certification en application de l'article 47-2 de la Constitution","relève du Parlement qui vote l'acte annuel de certification en application de l'article 58 de la loi organique relative aux lois de finances (LOLF)","relève de la Cour des comptes en application de l'article 58 de la LOLF"],"a":2,"c":"s","e":"La Cour des comptes certifie les comptes de l'État (art. 47-2 C et art. 58 LOLF)."},{"id":"2022-2-76","s":"2022-2","n":76,"d":"FP","q":"En tant qu'attaché(e) d'administration de l'Etat affecté(e) sur des fonctions budgétaires, vous contribuez directement à deux des quatre temps budgétaires qui se succèdent :","o":["l'adoption et l'exécution du budget de l'Etat","l'exécution et le contrôle de l'exécution du budget de l'Etat","la préparation et la mise en œuvre du budget de l'Etat"],"a":2,"c":"s","e":"Un attaché en poste budgétaire contribue surtout à la préparation (programmation) et à la mise en œuvre (exécution) du budget."},{"id":"2022-2-77","s":"2022-2","n":77,"d":"FP","q":"À quel montant s'élève la dette publique à la fin du 4ème trimestre 2021 ?","o":["1 215,1 milliards d'euros","2 813,1 milliards d'euros","2 000,1 milliards d'euros"],"a":1,"c":"s","e":"Fin 2021, la dette publique atteignait 2 813 Md€ (112,5 % du PIB). Elle dépasse 3 300 Md€ en 2025."},{"id":"2022-2-78","s":"2022-2","n":78,"d":"FP","q":"A quoi correspond le schéma d'emplois :","o":["à la différence entre le plafond d'emplois de l'année n-1 et celui de l'année n","à la différence entre la consommation d'emplois entre l'année n-1 et celle de l'année n","à l'augmentation ou à la diminution en ETPT de la dotation en emplois des missions du budget de l'Etat"],"a":1,"c":"p","e":"Le schéma d'emplois mesure la variation des effectifs (en ETP) entre le 31 décembre N-1 et le 31 décembre N. Le plafond, lui, s'exprime en ETPT."},{"id":"2022-2-79","s":"2022-2","n":79,"d":"FP","q":"Qui est le responsable de la fonction financière ministérielle (RFFIM) ?","o":["Le secrétaire général du ministère","Le directeur des affaires financières du ministère","Le contrôleur budgétaire et comptable ministériel"],"a":0,"c":"s","e":"Le secrétaire général du ministère est le responsable de la fonction financière ministérielle (décret GBCP 2012)."},{"id":"2022-2-80","s":"2022-2","n":80,"d":"FP","q":"Quelle proposition correspond à une des caractéristiques d'une loi de programmation ?","o":["Une loi de programmation est une loi d'exception qui n'est pas soumise à l'examen du Parlement","Une loi de programmation ne porte aucune dépense de masse salariale","Une loi de programmation est une loi pluriannuelle qui déroge au principe d'annualité"],"a":2,"c":"s","e":"La loi de programmation est pluriannuelle. Elle n'a pas de portée normative contraignante sur les lois de finances annuelles."},{"id":"2022-2-81","s":"2022-2","n":81,"d":"UE","q":"La Convention européenne des droits de l'Homme a été plusieurs fois amendée par :","o":["protocoles","amendements","avenants"],"a":0,"c":"s","e":"La CEDH a été modifiée par des protocoles additionnels (n° 11, 14, 15…)."},{"id":"2022-2-82","s":"2022-2","n":82,"d":"UE","q":"La Charte des droits fondamentaux à une valeur juridique :","o":["inférieure aux Traités","supérieure aux Traités","égale aux Traités"],"a":2,"c":"s","e":"Depuis Lisbonne, la Charte a la même valeur juridique que les traités."},{"id":"2022-2-83","s":"2022-2","n":83,"d":"UE","q":"Le Conseil européen réunit :","o":["les commissaires européens","les ministres des affaires étrangères des pays membres de l'Union européenne","les chefs d'Etat et de gouvernement des pays membres de l'Union européenne"],"a":2,"c":"s","e":"Le Conseil européen réunit les chefs d'État ou de gouvernement, son président et le président de la Commission."},{"id":"2022-2-84","s":"2022-2","n":84,"d":"UE","q":"Les membres du Parlement européen sont élus au :","o":["suffrage restreint","suffrage universel direct","suffrage universel indirect"],"a":1,"c":"s","e":"Les députés européens sont élus au suffrage universel direct depuis 1979."},{"id":"2022-2-85","s":"2022-2","n":85,"d":"UE","q":"Parmi les domaines de compétences suivants de l'Union européenne, lequel est un domaine de compétence partagée ?","o":["L'agriculture et la pêche, à l'exclusion de la conservation des ressources biologiques de la mer","La politique monétaire pour les pays de la zone euro","L'établissement de règles de concurrence nécessaires au fonctionnement du marché intérieur"],"a":0,"c":"s","e":"Art. 4 TFUE : l'agriculture et la pêche (hors conservation des ressources biologiques de la mer) sont des compétences partagées."},{"id":"2022-2-86","s":"2022-2","n":86,"d":"UE","q":"La transposition d'une directive européenne en droit national est :","o":["obligatoire dans un délai donné","obligatoire sans qu'un délai ne soit précisé","facultative"],"a":0,"c":"s","e":"La directive fixe un délai de transposition obligatoire. Le retard expose l'État à un recours en manquement."},{"id":"2022-2-87","s":"2022-2","n":87,"d":"UE","q":"Quels sont les 6 pays fondateurs de l'Union européenne ?","o":["Pays-Bas, Luxembourg, France, Allemagne, Danemark et Belgique","Luxembourg, Pays-Bas,Italie, France, Allemagne et Belgique","Portugal, Luxembourg, Italie, France, Allemagne et Belgique"],"a":1,"c":"s","e":"Les six fondateurs (1951/1957) : France, Allemagne, Italie, Belgique, Pays-Bas, Luxembourg."},{"id":"2022-2-88","s":"2022-2","n":88,"d":"UE","q":"Les pays et territoires d'outre-mer :","o":["ne font pas partie de l'Union européenne","font partie de l'Union européenne","sont soumis au droit européen sans pour autant faire partie de l'Union européenne"],"a":0,"c":"s","e":"Les PTOM ne font pas partie de l'UE. Ils y sont associés (4e partie du TFUE) et le droit de l'Union ne s'y applique pas en principe."},{"id":"2022-2-89","s":"2022-2","n":89,"d":"UE","q":"L'adhésion d'un nouveau pays à l'Union européenne nécessite :","o":["une approbation du Parlement européen","un vote des citoyens des pays membres de l'Union européenne","un vote à la majorité qualifiée des citoyens du pays candidat"],"a":0,"c":"s","e":"Art. 49 TUE : l'adhésion requiert notamment l'approbation du Parlement européen et l'unanimité du Conseil."},{"id":"2022-2-90","s":"2022-2","n":90,"d":"UE","q":"Quelle nouvelle ressource propre de l'Union européenne a été mise en place au 1er janvier 2021 ?","o":["Une taxe carbone pour les marchandises importées dans l'Union européenne","Une taxe sur les déchets plastiques non recyclés","Une taxe sur le numérique"],"a":1,"c":"s","e":"La ressource propre fondée sur les déchets d'emballages plastiques non recyclés existe depuis le 1er janvier 2021."},{"id":"2022-2-91","s":"2022-2","n":91,"d":"UE","q":"Le poste de Haut représentant de l'Union pour les affaires étrangères et la politique de sécurité a été créé par :","o":["le Traité de Nice du 26 février 2001","le Traité de Maastricht du 7 février 1992","le Traité de Lisbonne du 13 décembre 2007"],"a":2,"c":"s","e":"Le poste de Haut représentant dans sa forme actuelle (double casquette) est issu du traité de Lisbonne."},{"id":"2022-2-92","s":"2022-2","n":92,"d":"UE","q":"Quel pays n'est pas membre de l'Union européenne parce qu'il a renoncé à sa demande d'adhésion à l'Union en 2015 ?","o":["L'Islande","La Norvège","L'Albanie"],"a":0,"c":"s","e":"L'Islande a retiré sa candidature en 2015."},{"id":"2022-2-93","s":"2022-2","n":93,"d":"UE","q":"Le président du Conseil européen est élu par le Conseil européen :","o":["à la majorité absolue","à la majorité qualifiée","il n'est pas élu ; il est nommé par le Parlement européen"],"a":1,"c":"s","e":"Le président du Conseil européen est élu à la majorité qualifiée pour 2 ans et demi, renouvelable une fois."},{"id":"2022-2-94","s":"2022-2","n":94,"d":"UE","q":"Quelles sont les trois principales compétences de la Commission européenne ?","o":["Adopter les textes législatifs de l'Union européenne, coordonner les politiques des Etats membres, définir la politique étrangère et de sécurité","Exercer un pouvoir d'initiative législative, veiller au respect et à l'application du droit européen, exercer un pouvoir d'exécution des politiques et des actes adoptés par le Parlement et le","onseil de l'Union européenne C. Adopter les actes législatifs de l'Union européenne, arrêter les orientations sur les priorités budgétaires de l'Union européenne, créer des commissions temporaires d'enquête"],"a":1,"c":"s","e":"Commission : initiative législative, gardienne des traités, exécution (budget, politiques)."},{"id":"2022-2-95","s":"2022-2","n":95,"d":"UE","q":"Le président du Parlement européen est élu pour un mandat :","o":["renouvelable de cinq ans","non renouvelable de cinq ans","renouvelable de deux ans et demi"],"a":2,"c":"s","e":"Le président du Parlement européen est élu pour 2 ans et demi, renouvelables."},{"id":"2022-2-96","s":"2022-2","n":96,"d":"UE","q":"Le Comité européen des régions :","o":["est une institution décisionnelle en matière de politique de l'environnement et de cohésion","est une institution qui contrôle l'utilisation des fonds versés aux Etats membres de l'Union européenne dans le cadre de la politique régionale européenne","est un organe consultatif qui émet des avis sur toute proposition ayant un impact sur les collectivités territoriales de l'Union européenne"],"a":2,"c":"s","e":"Le Comité européen des régions est un organe consultatif et non une institution."},{"id":"2022-2-97","s":"2022-2","n":97,"d":"UE","q":"Les pays membres de l'espace Schengen sont au nombre de :","o":["26 dont 22 sont membres de l'Union européenne","28 dont 23 sont membres de l'Union européenne","31 dont 20 sont membres de l'Union européenne"],"a":0,"c":"s","e":"À la date du sujet : 26 États Schengen, dont 22 de l'UE. En 2025, on compte 29 États (Croatie, Roumanie, Bulgarie)."},{"id":"2022-2-98","s":"2022-2","n":98,"d":"UE","q":"Dans le cadre de la politique européenne de la concurrence, les aides d'Etat ne sont pas autorisées car elles sont incompatibles avec le marché unique :","o":["lorsqu'elles faussent ou menacent de fausser la concurrence en favorisant certaines entreprises ou productions affectant ainsi les échanges entre Etats membres de l'Union européenne","lorsqu'elles visent à aider au développement économique de régions dans lesquelles le niveau de vie est anormalement bas","lorsqu'elles ont un caractère social et sont octroyées aux consommateurs individuels sans discrimination liée à l'origine des produits"],"a":0,"c":"s","e":"Art. 107 TFUE : sont incompatibles les aides qui faussent la concurrence en favorisant certaines entreprises et affectent les échanges."},{"id":"2022-2-99","s":"2022-2","n":99,"d":"UE","q":"En poste à la délégation aux affaires européennes et internationales du secrétariat général du ministère de la justice, vous animez une formation et devez présenter l'agence européenne Eurojust. Vous expliquez qu'elle est chargée de :","o":["diriger des enquêtes et mener des poursuites pénales contre les auteurs d'infractions graves réalisées dans un des pays membres de l'Union européenne","coordonner une réforme du système juridictionnel européen en vue de la création d'une Cour d'assises au sein de la Cour de justice de l'Union européenne","renforcer la coordination et la coopération entre les autorités nationales chargées des enquêtes et des poursuites relatives à la criminalité grave affectant deux ou plusieurs Etats membres de l'Union européenne"],"a":2,"c":"s","e":"Eurojust coordonne la coopération judiciaire pénale entre autorités nationales. C'est le Parquet européen qui poursuit."},{"id":"2022-2-100","s":"2022-2","n":100,"d":"UE","q":"Parmi ces pays, lequel n'est pas un Etat membre du Conseil de l'Europe ?","o":["La Suisse","La Biélorussie","L'Ukraine"],"a":1,"c":"s","e":"La Biélorussie n'est pas membre du Conseil de l'Europe. La Suisse et l'Ukraine le sont."},{"id":"2022-2-101","s":"2022-2","n":101,"d":"NUM","q":"A quoi sert le VPN (Virtual Private Network ou Réseau Privé Virtuel) ?","o":["Il s'occupe du partage des fichiers etde faire des sauvegardes de données régulièrement","Il désigne un réseau crypté qui permet à une société dont les locaux seraient géographiquement dispersés de communiquer et partager de documents de manière sécurisée","Il permet de gérer les e-mails, la connexion internet et la sécurité informatique"],"a":1,"c":"s","e":"Un VPN crée un tunnel chiffré permettant aux sites distants d'une organisation d'échanger de façon sécurisée."},{"id":"2022-2-102","s":"2022-2","n":102,"d":"NUM","q":"Que contient le volet cybersécurité du plan France Relance ?","o":["Une décision du gouvernement destinée à relancer l'e-commerce en France","Une volonté gouvernementale destinée à rehausser le niveau de cyber sécurité de certaines entités de l'Etat","Un plan architectural destiné à réorganiser l'écosystème cyber français"],"a":1,"c":"s","e":"Le volet cybersécurité de France Relance (136 M€) rehausse le niveau de sécurité d'entités publiques (collectivités, hôpitaux, administrations)."},{"id":"2022-2-103","s":"2022-2","n":103,"d":"NUM","q":"Quelle est l'autorité nationale en matière de cybersécurité ?","o":["Le COMCYBER (commandement de la cyberdéfense)","L'ANSSI (agence nationale de la sécurité des systèmes d'information)","Le COMCYBERGEND (commandement de la gendarmerie dans le cyberespace)"],"a":1,"c":"s","e":"L'ANSSI est l'autorité nationale de sécurité des systèmes d'information."},{"id":"2022-2-104","s":"2022-2","n":104,"d":"NUM","q":"Quel texte définit la conduite à tenir pour l'Etat en cas d'attaque mondiale Cyber ?","o":["La loi de programmation militaire (LPM)","Le code pénal","La directive sécurité des réseaux et de l'information (SRI)"],"a":0,"c":"p","e":"Les lois de programmation militaire (2013, 2018) organisent la réponse de l'État aux cyberattaques (pouvoirs de l'ANSSI, OIV)."},{"id":"2022-2-105","s":"2022-2","n":105,"d":"NUM","q":"Vous êtes directeur général des services dans une mairie. Dans quel cas contactez-vous la Commission nationale de l'informatique et des libertés (CNIL) ?","o":["Si le réseau Très haut débit ne fonctionne pas sur le territoire de la commune","Si le maire vous sollicite pour faire un audit des systèmes d'information d'importances vitales (SIIV) de votre commune","Si vous constatez une fuite de données personnelles"],"a":2,"c":"s","e":"Une fuite de données personnelles (violation de données) doit être notifiée à la CNIL sous 72 heures (art. 33 RGPD)."},{"id":"2022-2-106","s":"2022-2","n":106,"d":"NUM","q":"Vous êtes en charge de la gestion des réseaux informatiques d'un établissement public. Vous venez d'apprendre que vos systèmes d'information (SI) systèmes d'information sont bloqués, cryptés et qu'une demande de rançon de 50 bitcoins est demandée. Que faites-vous ?","o":["Vous payez la rançon","Vous négociez et payez la rançon","Vous rendez compte de la situation à l'ANSSI et allez porter plainte"],"a":2,"c":"s","e":"Face à un rançongiciel : ne pas payer, alerter l'ANSSI / cybermalveillance.gouv.fr et déposer plainte."},{"id":"2022-2-107","s":"2022-2","n":107,"d":"NUM","q":"En charge de la sécurité des SI de votre entité, vous avez subi une attaque cyber qui est désormais résolue.Quel est votre premier réflexe ?","o":["Rebrancher les systèmes et reprendre le travail au plus vite","Ajouter quelques protections supplémentaires","Reconstruire intégralement l'architecture informatique de votre SI en y mettant les protections nécessaires"],"a":2,"c":"p","e":"Après une attaque, il faut reconstruire le système d'information sur des bases saines et durcies, pour éviter une réinfection."},{"id":"2022-2-108","s":"2022-2","n":108,"d":"NUM","q":"Quelle est l'autorité de rattachement de l'ANSSI ?","o":["La direction interministérielle du numérique","Le secrétariat général de la Défense et de la Sécurité nationale","Le ministère des armées"],"a":1,"c":"s","e":"L'ANSSI est rattachée au SGDSN (secrétariat général de la défense et de la sécurité nationale)."},{"id":"2022-2-109","s":"2022-2","n":109,"d":"NUM","q":"Le règlement général sur la protection des données (RGPD) :","o":["a été rendu applicable dans certains Etats de l'Union européenne dès lors qu'ils l'ont transposé","est directement applicable dans tous les États membres de l'Union européenne","sera automatiquement applicable au Royaume-Uni après le Brexit puisqu'il a été adopté avant"],"a":1,"c":"s","e":"Le RGPD est un règlement, directement applicable dans tous les États membres depuis le 25 mai 2018."},{"id":"2022-2-110","s":"2022-2","n":110,"d":"NUM","q":"« France transfert » est un outil permettant :","o":["le transfert de fonds","l'envoi de fichiers volumineux","l'utilisation d'une messagerie instantanée"],"a":1,"c":"s","e":"France Transfert permet l'envoi de fichiers volumineux par les agents de l'État."},{"id":"2022-2-111","s":"2022-2","n":111,"d":"NUM","q":"Que désigne la fracture numérique ?","o":["L'absence de connaissance en informatique","L'inégalité en termes d'accès et d'usage numériques","Le piratage d'un réseau informatique"],"a":1,"c":"s","e":"La fracture numérique désigne les inégalités d'accès et d'usage du numérique."},{"id":"2022-2-112","s":"2022-2","n":112,"d":"NUM","q":"Qu'est-ce que l'illectronisme ?","o":["L'incapacité de lire un texte que ce soit sous format papier ou numérique","Une absence de compétences nécessaires à l'utilisation des ressources numériques","Une allergie aux composants informatiques"],"a":1,"c":"s","e":"L'illectronisme est l'absence de compétences nécessaires à l'usage du numérique."},{"id":"2022-2-113","s":"2022-2","n":113,"d":"NUM","q":"Que recouvre le dispositif Territoire Numérique Éducatif (TNE) ?","o":["Une expérimentation consistant à rendre le très haut débit obligatoire dans toutes les communes comptant plus de 5 écoles","Une expérimentation mise en place dans quelques départements et consistant à favoriser la continuité pédagogique, à réduire la fracture numérique et à encourager l'accélération des usages du numérique au service de la réussite des élèves","Un dispositif visant à introduire l'usage exclusif du numérique éducatif dans les territoires comptant le plus grand nombre d'élèves décrocheurs"],"a":1,"c":"s","e":"Le dispositif TNE est expérimenté dans quelques départements : continuité pédagogique et réduction de la fracture numérique."},{"id":"2022-2-114","s":"2022-2","n":114,"d":"NUM","q":"Le programme France Identité Numérique lancé en 2018 est chargé de concevoir et mettre en œuvre :","o":["un service d'identification numérique pour l'ensemble des citoyens","un portail agent interministériel de gestion des ressources humaines","des guichets numériques d'accueil des étrangers en France"],"a":0,"c":"s","e":"France Identité Numérique conçoit une identité numérique sécurisée pour les citoyens (application France Identité)."},{"id":"2022-2-115","s":"2022-2","n":115,"d":"NUM","q":"Un rapport du Sénat du mois de mai 2022 relatif à la reconnaissance biométrique dans l'espace public contient des propositions pour :","o":["écarter le risque d'une société de surveillance","généraliser la reconnaissance faciale au sein des services publics","assouplir le principe de consentement des usagers en supprimant la distinction entre authentification et identification"],"a":0,"c":"s","e":"Le rapport sénatorial de mai 2022 propose des garde-fous pour écarter le risque d'une société de surveillance."},{"id":"2022-2-116","s":"2022-2","n":116,"d":"NUM","q":"Pour quelles raisons la présidente de la CNIL a mis en demeure en mai 2022 près de 22 communes françaises ?","o":["Parce qu'elles refusaient d'appliquer le principe de communication des documents administratifs à tout citoyen qui en fait la demande","Parce qu'elles refusaient de mettre en place un système de vidéo surveillance des espaces publics","Parce qu'elles n'avaient toujours pas désigné de délégué à la protection des données"],"a":2,"c":"s","e":"En mai 2022, la CNIL a mis en demeure 22 communes qui n'avaient pas désigné de DPO, pourtant obligatoire pour les organismes publics."},{"id":"2022-2-117","s":"2022-2","n":117,"d":"NUM","q":"Les opérateurs économiques chargés de la conclusion de marchés publics sont amenés à mettre en œuvre des traitements de données personnelles, en particulier de données relatives aux personnels ou aux usagers du service public. Ces traitements doivent nécessairement être réalisés dans le respect des dispositions :","o":["du RGPD qui fixent, au bénéfice des personnes concernées, un certain nombre d'obligations à la charge des organismes qui y procèdent","du code de la commande publique qui prévoient les règles et procédures que les pouvoirs adjudicateurs et les entités adjudicatrices doivent respecter pour leurs achats en matière de travaux, de fournitures et de services","du code général de la fonction publique qui rassemblent l'ensemble des règles applicables au droit de la fonction publique"],"a":0,"c":"s","e":"Tout traitement de données personnelles doit respecter le RGPD, y compris lorsqu'il est confié à un titulaire de marché public (sous-traitant, art. 28)."},{"id":"2022-2-118","s":"2022-2","n":118,"d":"NUM","q":"Vous êtes en déplacement à l'étranger et vous souhaitez lire en toute sécurité vos mails professionnels :","o":["vous vous connectez au réseau wifi de l'hôtel non sécurisé","vous utilisez un partage de connexion compatible avec la Charte de sécurité informatique de votre département ministériel","vous allez sur les ordinateurs mis à votre disposition par l'hôtel"],"a":1,"c":"s","e":"Partage de connexion conforme à la charte ministérielle. Pas de wifi public non sécurisé ni de poste partagé."},{"id":"2022-2-119","s":"2022-2","n":119,"d":"NUM","q":"Quelle est la mission d' \"ETALAB\" ?","o":["Créer un site Internet interministériel","Connecter les établissements scolaires entre eux","Coordonner la conception et la mise en œuvre de la stratégie de l'Etat dans le domaine de la donnée"],"a":2,"c":"s","e":"Etalab, département de la DINUM, coordonne la stratégie de l'État en matière de données (ouverture, circulation)."},{"id":"2022-2-120","s":"2022-2","n":120,"d":"NUM","q":"La loi pour une République numérique a été promulguée le 7 octobre 2016. Elle entend :","o":["généraliser le vote électronique pour l'ensemble des scrutins nationaux, afin de contenir l'abstention électorale ;","encourager l'innovation et l'économie numérique, promouvoir une société numérique protectrice et garantir l'accès de tous au numérique ;","encourager et promouvoir l'utilisation du numérique, dans un souci de développement durable et de limitation de l'usage du papier pour faire face notamment à la pénurie croissante de certaines matières premières."],"a":1,"c":"s","e":"La loi pour une République numérique (2016) vise l'innovation, une société numérique protectrice et l'accès de tous au numérique."},{"id":"2023-1-1","s":"2023-1","n":1,"d":"CAJ","q":"Vous êtes attaché(e) d'administration au sein d'un bureau en charge du contentieux administratif. Dans le cadre de la rédaction de vos mémoires en défense, vous êtes contraint de transmettre l'ensemble des pièces de la procédure à la partie adverse au motif que la procédure est :","o":["inquisitoire","contradictoire","écrite"],"a":1,"c":"s","e":"Le principe du contradictoire impose de communiquer toutes les pièces à la partie adverse."},{"id":"2023-1-2","s":"2023-1","n":2,"d":"CAJ","q":"Vous participez à la rédaction d'un projet d'ordonnance, votre supérieur hiérarchique vous demande si le texte est soumis à consultation obligatoire. Vous répondez qu'il faut saisir :","o":["le Conseil d'État","le Conseil constitutionnel","le Conseil économique social et environnemental"],"a":0,"c":"s","e":"Art. 38 C : les ordonnances sont prises en Conseil des ministres après avis du Conseil d'État."},{"id":"2023-1-3","s":"2023-1","n":3,"d":"CAJ","q":"Vous êtes saisi en urgence pour rédiger un diaporama pour votre directeur qui doit intervenir devant un auditoire sur \"Action Publique 2022\". Vous développez les points suivants :","o":["l'amélioration de la qualité des services publics, l'offre d'un environnement de travail modernisé aux fonctionnaires et la maîtrise des dépenses publiques","la nécessité pour les organisations publiques de respecter quatre principes de fonctionnement : égalité, équité, adaptabilité et continuité pour accomplir leur mission de service public et satisfaire les intérêts collectifs","les dispositions d'une nouvelle réforme fiscale dont l'objet est de réviser l'organisation de l'imposition pour une plus grande égalité"],"a":0,"c":"s","e":"Action publique 2022 (2017) : améliorer la qualité du service, offrir un environnement de travail modernisé aux agents et maîtriser la dépense publique."},{"id":"2023-1-4","s":"2023-1","n":4,"d":"CAJ","q":"La consultation à titre personnel d'un fichier professionnel et la communication à des tiers non habilités des informations confidentielles qu'il contient constituent :","o":["un devoir d'alerte","une violation de la loi n° 78-753 du 17 juillet 1978 instaurant un droit d'accès des citoyens aux documents administratifs","un manquement au devoir de discrétion professionnelle"],"a":2,"c":"s","e":"Consulter à titre personnel et divulguer des informations professionnelles viole la discrétion professionnelle (et le secret professionnel)."},{"id":"2023-1-5","s":"2023-1","n":5,"d":"CAJ","q":"Vous êtes chef(fe) de bureau dans une préfecture, vous venez de signer une obligation de quitter le territoire français à l'encontre d'un étranger en situation irrégulière. Les délais pour contester cette décision courent à compter de la date de :","o":["sa publication au recueil des actes administratifs de la préfecture","sa notification à l'intéressé","sa signature"],"a":1,"c":"s","e":"Pour une décision individuelle, le délai de recours court à compter de sa notification."},{"id":"2023-1-6","s":"2023-1","n":6,"d":"CAJ","q":"La police administrative a pour objet :","o":["de rechercher les auteurs des infractions commises afin de les traduire devant la justice pénale","de lutter contre le terrorisme","de maintenir l'ordre public en assurant la tranquillité, la sécurité et la salubrité publiques"],"a":2,"c":"s","e":"La police administrative, préventive, maintient l'ordre public : sécurité, tranquillité, salubrité (et dignité). A = police judiciaire."},{"id":"2023-1-7","s":"2023-1","n":7,"d":"CAJ","q":"Quel impact la loi n° 2019-828 du 6 août 2019 de transformation de la fonction publique a-t-elle eu sur les commissions administratives paritaires (CAP) ?","o":["Les CAP ne sont consultées que pour les questions relatives aux mutations, détachements ou avancements des agents","La loi a supprimé les CAP","La loi recentre la compétence des CAP sur le champ disciplinaire et les décisions individuelles défavorables"],"a":2,"c":"s","e":"Depuis la loi de 2019, les CAP sont recentrées sur le disciplinaire et les décisions individuelles défavorables."},{"id":"2023-1-8","s":"2023-1","n":8,"d":"CAJ","q":"Dans l'arrêt Blanco en date du 8 février 1873, le Tribunal des conflits consacre :","o":["le principe selon lequel l'administration ne peut retirer un acte individuel créateur de droits que s'il est illégal et avant qu'il ne soit devenu définitif","la responsabilité de État à raison des dommages causés par des services publics et reconnaît le service public comme le critère de la compétence de la juridiction administrative","la primauté du droit national sur les traités internationaux"],"a":1,"c":"s","e":"TC 1873 Blanco : responsabilité de l'État du fait des services publics, régie par des règles spéciales et relevant du juge administratif."},{"id":"2023-1-9","s":"2023-1","n":9,"d":"CAJ","q":"Quel principe est rappelé par l'article 40 du code de procédure pénale ?","o":["L'obligation pour tout officier public ou fonctionnaire qui, dans l'exercice de ses fonctions, acquiert la connaissance d'un crime ou d'un délit, d'en informer sans délai le procureur de la République","L'agent public bénéficie de la protection fonctionnelle s'il est poursuivi en justice par un tiers pour une faute commise dans l'exercice de ses fonctions","L'obligation faite à tout agent public de ne pas divulguer les informations concernant l'activité, les missions et le fonctionnement de son administration"],"a":0,"c":"s","e":"Art. 40 CPP : tout fonctionnaire qui acquiert connaissance d'un crime ou délit doit en aviser sans délai le procureur."},{"id":"2023-1-10","s":"2023-1","n":10,"d":"CAJ","q":"Quelle proposition est vraie concernant la répartition des compétences entre l'État et les collectivités territoriales s'agissant du service public de l'éducation ?","o":["L'État a la charge de tous les personnels du système éducatif et les collectivités territoriales ont la charge des bâtiments scolaires","Les collectivités territoriales et l'État ont des compétences partagées dont la répartition diffère selon qu'il s'agit d'une école, d'un collège ou d'un lycée","Les bâtiments scolaires sont la propriété de la commune sur laquelle ils sont implantés"],"a":1,"c":"s","e":"Compétences partagées : l'État (personnels enseignants, pédagogie) et les collectivités selon le niveau (communes-écoles, départements-collèges, régions-lycées)."},{"id":"2023-1-11","s":"2023-1","n":11,"d":"CAJ","q":"La loi portant nouvelle organisation territoriale de la République confie de nouvelles compétences aux régions et supprime la clause générale de compétence pour les départements et les régions. Cette même loi :","o":["renforce le rôle de la région en matière de développement économique","attribue au département la charge de l'aménagement durable du territoire","attribue à la région les compétences de solidarité"],"a":0,"c":"s","e":"La loi NOTRe renforce la région en matière de développement économique (SRDEII) et supprime la clause générale de compétence."},{"id":"2023-1-12","s":"2023-1","n":12,"d":"CAJ","q":"Les actes des collectivités territoriales font l'objet :","o":["d'un contrôle a posteriori","d'un contrôle a priori","l'un ou l'autre au choix du préfet"],"a":0,"c":"s","e":"Depuis 1982, les actes des collectivités font l'objet d'un contrôle de légalité a posteriori."},{"id":"2023-1-13","s":"2023-1","n":13,"d":"CAJ","q":"M. X s'est vu notifier une décision explicite de refus de sa demande de permis de construire le 15 janvier 2022. Face à ce refus, il a formé un recours gracieux auprès du maire de sa commune pour lui demander de revoir sa décision. En date du 5 mai 2022, M. X n'a pas obtenu de réponse de la part du maire. Que doit-il faire ?","o":["Il doit se pourvoir devant le juge administratif","Rien, il bénéficie d'une autorisation tacite de construire","Il doit réitérer sa demande auprès du maire"],"a":0,"c":"s","e":"Le silence gardé 2 mois sur le recours gracieux vaut rejet : M. X doit saisir le TA dans les 2 mois suivant ce rejet implicite."},{"id":"2023-1-14","s":"2023-1","n":14,"d":"CAJ","q":"Pour des raisons d'hygiène, le restaurant TOUTESTBON s'est vu notifier une décision de fermeture administrative qui ne peut pas émaner :","o":["du maire sur délégation du préfet","du ministre de l'intérieur","de la direction départementale de la protection des populations"],"a":1,"c":"p","e":"La fermeture administrative pour hygiène est prononcée par le préfet (sur proposition de la DDPP), ou le maire au titre de ses pouvoirs de police. Pas par le ministre de l'intérieur."},{"id":"2023-1-15","s":"2023-1","n":15,"d":"CAJ","q":"En tant qu'agent public affecté au service municipal chargé de délivrer les permis de construire, vous envoyez une décision administrative individuelle en oubliant de mentionner les voies et délais de recours. Quelle est la conséquence juridique ?","o":["Le recours reste possible à tout moment","Le délai de recours est de deux mois","Un « délai de recours raisonnable » d'un an est opposable au destinataire de la décision"],"a":2,"c":"s","e":"CE 2016 Czabaj : sans mention des voies et délais, un délai raisonnable d'un an s'applique en principe."},{"id":"2023-1-16","s":"2023-1","n":16,"d":"CAJ","q":"Quelle(s) autorité(s) dispose(nt) du pouvoir règlementaire de droit commun en vertu de la Constitution ?","o":["Le Président de la République et le Premier ministre","Le Premier ministre et l'ensemble du Gouvernement","Le Parlement"],"a":0,"c":"s","e":"Pouvoir réglementaire général : Premier ministre (art. 21 C), sous réserve des décrets délibérés en Conseil des ministres signés par le Président (art. 13)."},{"id":"2023-1-17","s":"2023-1","n":17,"d":"CAJ","q":"Les sénateurs sont élus pour un mandat de :","o":["5 ans, le Sénat étant renouvelé à l'issue du renouvellement de l'Assemblée nationale","6 ans, le Sénat étant renouvelé par moitié tous les 3 ans","6 ans, le Sénat étant renouvelé intégralement à l'issue des élections municipales et Communautaires."],"a":1,"c":"s","e":"Les sénateurs sont élus pour 6 ans ; le Sénat est renouvelé par moitié tous les 3 ans."},{"id":"2023-1-18","s":"2023-1","n":18,"d":"CAJ","q":"Les articles 76 et 77 de la Constitution régissent le statut particulier de :","o":["la Corse","la Ville de Paris","la Nouvelle-Calédonie"],"a":2,"c":"s","e":"Les articles 76 et 77 (titre XIII) régissent la Nouvelle-Calédonie."},{"id":"2023-1-19","s":"2023-1","n":19,"d":"CAJ","q":"L'article 89 de la Constitution de la Ve République impose le recours :","o":["systématique au référendum","au référendum, uniquement si l'initiative de la révision est d'origine parlementaire","au référendum, uniquement si l'initiative de la révision émane de l'exécutif"],"a":1,"c":"s","e":"Art. 89 C : une proposition de révision (d'origine parlementaire) doit être approuvée par référendum. Un projet (exécutif) peut passer par le Congrès."},{"id":"2023-1-20","s":"2023-1","n":20,"d":"CAJ","q":"Quel principe a obtenu valeur constitutionnelle par une décision du Conseil constitutionnel du 25 juillet 1979 :","o":["la continuité du service public","le droit au respect de la vie privée","la liberté d'entreprendre"],"a":0,"c":"s","e":"Décision 79-105 DC : la continuité du service public a valeur constitutionnelle."},{"id":"2023-1-21","s":"2023-1","n":21,"d":"CAJ","q":"Les lois référendaires ont-elles une autorité supérieure à celle des lois ordinaires ?","o":["Non","Oui, car elles ne peuvent pas être modifiées par des lois ordinaires","Oui, car elles ne peuvent être modifiées que par des lois constitutionnelles"],"a":0,"c":"s","e":"Une loi référendaire a la même valeur qu'une loi ordinaire et peut être modifiée par une loi ordinaire. Le Conseil constitutionnel refuse de la contrôler (1962)."},{"id":"2023-1-22","s":"2023-1","n":22,"d":"CAJ","q":"En matière législative, le Président de la République dispose :","o":["du pouvoir d'initiative","de la faculté de déférer la loi devant le Conseil constitutionnel avant de la promulguer","des pleins pouvoirs"],"a":1,"c":"s","e":"Le Président peut saisir le Conseil constitutionnel avant promulgation (art. 61) et demander une nouvelle délibération (art. 10). Il n'a pas l'initiative législative."},{"id":"2023-1-23","s":"2023-1","n":23,"d":"CAJ","q":"Une loi référendaire est une loi adoptée :","o":["après l'approbation d'un projet de loi soumis à l'ensemble des citoyens par voie de référendum","à la suite d'un référendum sur la base d'un texte émanant d'une proportion suffisante de citoyens disposant de leurs droits civiques","après l'approbation d'un projet de loi soumis à l'ensemble des citoyens par voie de référendum, après décision du Gouvernement"],"a":0,"c":"s","e":"Loi référendaire : projet de loi soumis directement au peuple par référendum (art. 11 C)."},{"id":"2023-1-24","s":"2023-1","n":24,"d":"CAJ","q":"Le rôle du Conseil Constitutionnel est d'exercer un contrôle de constitutionnalité obligatoire portant :","o":["exclusivement sur les règlements des assemblées et les lois organiques","sur les règlements des assemblées, les lois organiques et les propositions de loi issues du référendum d'initiative partagée avant qu'elles ne soient soumises a référendum","sur les règlements des assemblées, les lois organiques, les lois ordinaires et les engagements internationaux"],"a":1,"c":"s","e":"Contrôle obligatoire : lois organiques, règlements des assemblées et propositions RIP avant référendum (art. 61 C). Pas les lois ordinaires ni les traités."},{"id":"2023-1-25","s":"2023-1","n":25,"d":"CAJ","q":"En France, la Cour de Justice de la République juge :","o":["le Président de la République lorsqu'il quitte ses fonctions","les élus lorsqu'ils sont en fonction","les membres du Gouvernement pour les actes délictueux ou criminels commis dans l'exercice de leurs fonctions"],"a":2,"c":"s","e":"La CJR juge les membres du Gouvernement pour les crimes et délits commis dans l'exercice de leurs fonctions."},{"id":"2023-1-26","s":"2023-1","n":26,"d":"CAJ","q":"Une modification de la Constitution est ratifiée :","o":["soit par référendum, soit par les 3/5 des parlementaires réunis en Congrès","soit par la majorité des sénateurs, soit par la majorité des députés","soit par référendum, soit par un vote des grands électeurs"],"a":0,"c":"s","e":"Art. 89 C : révision approuvée par référendum, ou par le Congrès à la majorité des 3/5 des suffrages exprimés."},{"id":"2023-1-27","s":"2023-1","n":27,"d":"CAJ","q":"Le préambule de la Constitution de 1958 fait référence à trois sources :","o":["la Déclaration des droits de l'homme et du citoyen de 1789, le préambule de la Constitution de 1946 et la Charte de l'environnement de 2004","la Déclaration des droits de l'homme et du citoyen de 1789, le preambule de la Constitution européenne de 1946, et la Charte de l'environnement de 2004","la Déclaration des droits de l'homme et du citoyen de 1789, la Charte des Nations-Unies de 1945 et la Charte de l'environnement de 2004"],"a":0,"c":"s","e":"Le Préambule de 1958 renvoie à la DDHC de 1789, au Préambule de 1946 et à la Charte de l'environnement de 2004."},{"id":"2023-1-28","s":"2023-1","n":28,"d":"CAJ","q":"Le droit de grâce relève d'une compétence :","o":["partagée entre le Président de la République et le ministre de la justice","partagée entre le Président de la République et le Parlement","exclusive du Président de la République"],"a":2,"c":"s","e":"Art. 17 C : le droit de grâce est une compétence du Président (acte contresigné, mais qui lui appartient exclusivement)."},{"id":"2023-1-29","s":"2023-1","n":29,"d":"CAJ","q":"Vous êtes attaché(e) d'administration. En poste au sein d'une direction d'administration centrale, vous êtes sanctionné(e) en raison d'un comportement répréhensible dans l'exercice de vos fonctions. Vous décidez de faire un recours gracieux. Vous l'adressez :","o":["au supérieur hiérarchique direct de l'auteur de la décision contestée","à l'auteur de la décision contestée","à la commission de discipline"],"a":1,"c":"s","e":"Le recours gracieux s'adresse à l'auteur de la décision. Le recours hiérarchique s'adresse à son supérieur."},{"id":"2023-1-30","s":"2023-1","n":30,"d":"CAJ","q":"Vous êtes attaché(e) d'administration. Votre supérieur hiérarchique souhaite engager une procédure disciplinaire à l'encontre d'un agent titulaire et appliquer une sanction du premier groupe ne nécessitant pas de ce fait la consultation préalable du conseil de discipline. Vous lui proposez l'exclusion temporaire de fonctions de :","o":["6 mois","1 semaine","2 jours"],"a":2,"c":"s","e":"L'exclusion temporaire du 1er groupe est de 1 à 3 jours."},{"id":"2023-1-31","s":"2023-1","n":31,"d":"CAJ","q":"Le décret n° 2014-513 du 20 mai 2014 portant création d'un régime indemnitaire tenant compte des fonctions, des sujétions, de l'expertise et de l'engagement professionnel (RIFSEEP) dans la fonction publique de l'État a pour objet de rationaliser et de simplifier le paysage indemnitaire. Quels sont les principes de mise en œuvre de ce nouveau régime indemnitaire ?","o":["Valoriser uniquement l'exercice de fonctions, le niveau de responsabilité et d'expertise","Reconnaître uniquement l'engagement professionnel et la manière de servir de l'agent","Valoriser l'exercice de fonctions, le niveau de responsabilité et d'expertise, reconnaître l'engagement professionnel et la manière de servir de l'agent"],"a":2,"c":"s","e":"Le RIFSEEP valorise les fonctions, la responsabilité et l'expertise (IFSE) ainsi que l'engagement et la manière de servir (CIA)."},{"id":"2023-1-32","s":"2023-1","n":32,"d":"CAJ","q":"Quels sont les employeurs publics soumis à l'obligation d'emploi des travailleurs handicapés ?","o":["L'ensemble des employeurs publics qui rémunère au moins 20 agents a temps plein","L'ensemble des employeurs publics qui rémunère au moins 50 agents a temps plein","Uniquement les employeurs publics de la fonction publique de l'État qui rémunèrent au moins 20 agents a temps plein"],"a":0,"c":"s","e":"L'obligation d'emploi de 6 % concerne tous les employeurs publics d'au moins 20 agents ETP, dans les trois versants."},{"id":"2023-1-33","s":"2023-1","n":33,"d":"CAJ","q":"Vous êtes affecté (e) en tant qu'attaché (e) au sein d'un service déconcentré. A ce titre, vous allez percevoir en contrepartie du service fait un traitement indiciaire qui correspond a :","o":["la multiplication de l'indice majoré que vous détenez par la valeur du point d'indice","la multiplication de l'indice majoré que vous détenez par l'indice INSEE des prix à la consommation","un traitement fixe auquel s'ajoute obligatoirement la garantie individuelle du pouvoir d'achat"],"a":0,"c":"s","e":"Traitement indiciaire = indice majoré × valeur du point d'indice."},{"id":"2023-1-34","s":"2023-1","n":34,"d":"CAJ","q":"L'agent à l'encontre duquel une procédure disciplinaire est engagée à le droit de :","o":["consulter son dossier s'il est accompagné d'un avocat","consulter l'intégralité de son dossier individuel","consu
