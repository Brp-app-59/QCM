e réunion de travail où il rencontre une ancienne connaissance avec qui il a collaboré voilà plus de trente ans au sein d'un cabinet d'audit de gestion","Un agent public envisage de signer un contrat avec une société privée dirigée par l'un de ses descendants","Un chercheur public accompagne les travaux scientifiques d'un étudiant de 3ème cycle. Il s'appuie sur des publications internationales d'organismes privés"],"a":1,"c":"s","e":"Contracter avec une société dirigée par un descendant crée une interférence d'intérêts privés : c'est un conflit d'intérêts."},{"id":"2021-2-37","s":"2021-2","n":37,"d":"CAJ","q":"Quelle est la durée annuelle du temps de travail des personnels dans la fonction publique ?","o":["1607 heures","1600 heures","1593 heures"],"a":0,"c":"s","e":"1 607 heures annuelles de travail effectif."},{"id":"2021-2-38","s":"2021-2","n":38,"d":"CAJ","q":"Qu'est-ce que la masse salariale de la fonction publique ?","o":["L'ensemble des dépenses de personnel","L'ensemble des dépenses de fonctionnement","Le nombre d'agents publics"],"a":0,"c":"s","e":"La masse salariale correspond à l'ensemble des dépenses de personnel (titre 2 pour l'État)."},{"id":"2021-2-39","s":"2021-2","n":39,"d":"CAJ","q":"Vous êtes chef de service. Un fonctionnaire de votre service voudrait pouvoir exercer une activité professionnelle supplémentaire, hors de son emploi actuel dans l'administration. Vous lui indiquez que :","o":["soumis à un principe d'exclusivité, les agents publics ont interdiction d'exercer une activité professionnelle hors de leur emploi dans l'administration","les agents publics peuvent cumuler l'exercice d'une autre activité professionnelle, sans restriction","soumis à un principe d'exclusivité, les agents publics peuvent toutefois bénéficier de certaines dérogations"],"a":2,"c":"s","e":"Principe d'exclusivité avec dérogations : activités accessoires autorisées, création d'entreprise, œuvres de l'esprit…"},{"id":"2021-2-40","s":"2021-2","n":40,"d":"CAJ","q":"Dans la fonction publique de l'Etat, le pouvoir disciplinaire appartient :","o":["au conseil de discipline","à l'autorité investie du pouvoir de nomination","au supérieur hiérarchique direct"],"a":1,"c":"s","e":"Le pouvoir disciplinaire appartient à l'autorité investie du pouvoir de nomination, après avis du conseil de discipline pour les sanctions des 2e à 4e groupes."},{"id":"2021-2-41","s":"2021-2","n":41,"d":"CAJ","q":"L'exclusion temporaire de fonctions est une sanction qui peut être prononcée à l'encontre :","o":["des fonctionnaires titulaires uniquement","des fonctionnaires titulaires et des agents contractuels","des fonctionnaires titulaires, des fonctionnaires stagiaires et des agents contractuels"],"a":2,"c":"s","e":"L'exclusion temporaire existe pour les titulaires, les stagiaires (jusqu'à 15 jours) et les contractuels."},{"id":"2021-2-42","s":"2021-2","n":42,"d":"CAJ","q":"Connaissez-vous le nombre d'agents publics dans les trois fonctions publiques tel que publié par le ministère de la fonction publique ?","o":["1,4 millions d'agents publics dans la fonction publique d'Etat","5,6 millions d'agents publics","7 millions d'agents publics dans la fonction publique territoriale"],"a":1,"c":"s","e":"Environ 5,6 millions d'agents publics (FPE ≈ 2,5 M ; FPT ≈ 1,9 M ; FPH ≈ 1,2 M)."},{"id":"2021-2-43","s":"2021-2","n":43,"d":"CAJ","q":"Un agent a fait grève une matinée, il vient vous voir car il ne comprend pas la retenue sur son salaire. Quelle est la règle de retenue applicable dans la fonction publique que vous lui indiquez ?","o":["La retenue sur salaire correspond à une retenue de 1/30e de la rémunération mensuelle des agents publics","La retenue sur salaire n'est pas possible pour un service non fait inférieur à une journée","La retenue sur salaire correspond à la durée du service non fait, c'est-à-dire à une demi-journée"],"a":0,"c":"s","e":"Dans la FPE, la règle du « trentième indivisible » : toute absence pour grève, même partielle, entraîne une retenue d'1/30e. En FPT et FPH, la retenue est proportionnelle."},{"id":"2021-2-44","s":"2021-2","n":44,"d":"CAJ","q":"Vous êtes chef de bureau en préfecture. Un des agents placés sous votre responsabilité vous demande s'il peut adhérer à un parti politique. Que lui répondez-vous ?","o":["Qu'il est libre d'adhérer à un parti politique et n'a pas à demander l'autorisation","Qu'il doit demander l'autorisation au préfet","Qu'en tant qu'agent public, il n'a pas le droit d'adhérer à un parti politique"],"a":0,"c":"s","e":"La liberté d'opinion est garantie aux fonctionnaires. L'adhésion à un parti est libre ; seule l'expression est encadrée (réserve, neutralité)."},{"id":"2021-2-45","s":"2021-2","n":45,"d":"CAJ","q":"Combien de communes y a-t-il en France au 1er janvier 2020 ?","o":["Environ 33 000","Environ 35 000","Environ 37 000"],"a":1,"c":"s","e":"Environ 35 000 communes en 2020 (34 968 au 1er janvier 2020)."},{"id":"2021-2-46","s":"2021-2","n":46,"d":"CAJ","q":"Un citoyen français peut être juré dans une affaire criminelle :","o":["parce qu'il a été tiré au sort sur une liste électorale","parce qu'il est désigné par un juge","parce qu'il est volontaire"],"a":0,"c":"s","e":"Les jurés d'assises sont tirés au sort à partir des listes électorales."},{"id":"2021-2-47","s":"2021-2","n":47,"d":"CAJ","q":"Une fois transmis au contrôle de légalité, les actes des collectivités territoriales sont dits :","o":["obligatoires","contradictoires","exécutoires"],"a":2,"c":"s","e":"Les actes des collectivités sont exécutoires dès leur publication ou notification et, le cas échéant, leur transmission au préfet."},{"id":"2021-2-48","s":"2021-2","n":48,"d":"CAJ","q":"Quel âge faut-il avoir, au minimum, pour être élu sénateur ?","o":["20 ans","24 ans","30 ans"],"a":1,"c":"s","e":"L'âge minimal d'éligibilité au Sénat est de 24 ans (loi organique de 2011)."},{"id":"2021-2-49","s":"2021-2","n":49,"d":"CAJ","q":"À quelle date la loi portant Nouvelle Organisation Territoriale de la République (NOTRe) a-t-elle été promulguée ?","o":["Le 12 juillet 1999","Le 28 mars 2003","Le 7 août 2015"],"a":2,"c":"s","e":"La loi NOTRe date du 7 août 2015."},{"id":"2021-2-50","s":"2021-2","n":50,"d":"CAJ","q":"Depuis la loi organique du 15 janvier 2021, le Conseil économique, social et environnemental peut être saisi par voie de pétition par au moins 150 000 personnes :","o":["âgées de 18 ans et plus, de nationalité française ou résidant régulièrement en France","âgées de 16 ans et plus, de nationalité française ou résidant régulièrement en France","âgées de 18 ans et plus"],"a":1,"c":"s","e":"Loi organique du 15 janvier 2021 : pétition d'au moins 150 000 personnes âgées de 16 ans et plus, françaises ou résidant régulièrement en France."},{"id":"2021-2-51","s":"2021-2","n":51,"d":"CAJ","q":"Par quel processus, institutionnel et administratif, l'Etat transfère-t-il des compétences aux collectivités territoriales ?","o":["La décentralisation","La déconcentration","La délocalisation"],"a":0,"c":"s","e":"La décentralisation transfère des compétences de l'État aux collectivités. La déconcentration délègue à des agents de l'État sur le territoire."},{"id":"2021-2-52","s":"2021-2","n":52,"d":"CAJ","q":"Le département devient une \"collectivité territoriale\" avec :","o":["la loi du 10 octobre 1971","la loi du 10 septembre 1921","la loi du 10 août 1871"],"a":2,"c":"s","e":"La loi du 10 août 1871 fait du département une collectivité territoriale dotée d'un conseil général élu."},{"id":"2021-2-53","s":"2021-2","n":53,"d":"CAJ","q":"De quel ministère dépend le Bureau central des cultes en France ?","o":["Du Ministère de la justice","Du Ministère de la culture","Du Ministère de l'intérieur"],"a":2,"c":"s","e":"Le bureau central des cultes relève du ministère de l'intérieur."},{"id":"2021-2-54","s":"2021-2","n":54,"d":"CAJ","q":"Laquelle de ces missions n'est pas exercée par le Conseil d'Etat ?","o":["Conseil du Gouvernement pour la préparation des projets de loi et de décret","L'élaboration des projets de décret","Juge ultime des activités des administrations"],"a":1,"c":"s","e":"Le Conseil d'État conseille et juge, mais n'élabore pas les projets de décret (compétence des ministères)."},{"id":"2021-2-55","s":"2021-2","n":55,"d":"CAJ","q":"Quel type de structure, créé par le décret-loi du 30 octobre 1935, permet à des collectivités de s'associer entre elles ou avec des établissements publics ?","o":["Le syndicat mixte","La corporation mixte","La fédération mixte"],"a":0,"c":"s","e":"Le syndicat mixte (décret-loi du 30 octobre 1935) associe collectivités et établissements publics."},{"id":"2021-2-56","s":"2021-2","n":56,"d":"CAJ","q":"Le Président du Sénat est :","o":["élu pour 3 ans","nommé pour 5 ans","désigné pour 6 ans"],"a":0,"c":"s","e":"Le président du Sénat est élu après chaque renouvellement partiel, soit tous les 3 ans."},{"id":"2021-2-57","s":"2021-2","n":57,"d":"CAJ","q":"Dans les communes dotées d'un plan local d'urbanisme, l'urbanisme et l'attribution des permis de construire sont une compétence :","o":["de l'Etat","de la région","de la commune"],"a":2,"c":"s","e":"Avec un PLU, la commune (ou l'EPCI compétent) délivre les permis de construire au nom de la commune."},{"id":"2021-2-58","s":"2021-2","n":58,"d":"CAJ","q":"Laquelle des autorités administratives indépendantes suivantes à un pouvoir de sanction directe ?","o":["La Commission d'accès aux documents administratifs","Le Défenseur des droits","La Commission nationale informatique et libertés"],"a":2,"c":"s","e":"La CNIL dispose d'un pouvoir de sanction (amendes). La CADA rend des avis ; le Défenseur des droits formule des recommandations."},{"id":"2021-2-59","s":"2021-2","n":59,"d":"CAJ","q":"Vous êtes chef de service et vous devez réorganiser votre service. Devant quel type d'instance devez-vous présenter votre projet ?","o":["Le comité technique","La commission administrative paritaire","Le conseil commun de la fonction publique"],"a":0,"c":"s","e":"À la date du sujet, les réorganisations relevaient du comité technique. Aujourd'hui, c'est le CSA."},{"id":"2021-2-60","s":"2021-2","n":60,"d":"CAJ","q":"Alors que vous êtes fonctionnaire du ministère de l'intérieur, le doyen de la faculté de droit vous sollicite pour animer les séances de travaux dirigés de droit administratif des étudiants inscrits en deuxième année de licence. Que faites-vous, étant précisé que cette proposition vous intéresse énormément ?","o":["Avant de vous engager, vous saisissez votre autorité hiérarchique afin d'obtenir l'autorisation de cumuler cette activité d'enseignement avec vos fonctions","Vous acceptez immédiatement, sans autre formalité, compte tenu de la grande latitude dont vous bénéficiez dans l'aménagement de votre emploi du temps","Vous acceptez immédiatement, sans autre formalité, s'agissant d'une activité accessoire"],"a":0,"c":"s","e":"L'enseignement est une activité accessoire cumulable, mais soumise à autorisation préalable de l'autorité hiérarchique."},{"id":"2021-2-61","s":"2021-2","n":61,"d":"FP","q":"La loi de finances initiale (LFI) doit être adoptée par le Parlement au plus tard :","o":["le 1er janvier de l'année N","le 31 décembre de l'année N-1","le 1er mars de l'année N"],"a":1,"c":"s","e":"La LFI doit être adoptée avant le 1er janvier : le Parlement dispose de 70 jours (art. 47 C), sinon la loi est mise en vigueur par ordonnance."},{"id":"2021-2-62","s":"2021-2","n":62,"d":"FP","q":"Parmi les sept titres de présentation des crédits retenus dans la loi organique relative aux lois de finances (LOLF), ne figurent pas :","o":["les dotations des pouvoirs publics","les dépenses d'opérations financières","les dépenses d'amortissement"],"a":2,"c":"s","e":"Les 7 titres LOLF : dotations des pouvoirs publics, personnel, fonctionnement, charges de la dette, investissement, intervention, opérations financières. Pas d'« amortissement »."},{"id":"2021-2-63","s":"2021-2","n":63,"d":"FP","q":"La remise gracieuse de débet peut être accordée, à sa demande, au comptable public par :","o":["son supérieur hiérarchique","le ministre chargé du budget","la Cour des comptes"],"a":1,"c":"s","e":"La remise gracieuse du débet d'un comptable relève du ministre chargé du budget (régime antérieur à 2023)."},{"id":"2021-2-64","s":"2021-2","n":64,"d":"FP","q":"Citez la chronologie des phases administratives de la procédure comptable :","o":["engagement, liquidation, ordonnancement, paiement","ordonnancement, engagement, liquidation, paiement","liquidation, ordonnancement, engagement, paiement"],"a":0,"c":"s","e":"Ordre de la dépense : engagement, liquidation, ordonnancement (phases administratives), puis paiement (phase comptable)."},{"id":"2021-2-65","s":"2021-2","n":65,"d":"FP","q":"La taxe sur la valeur ajoutée est, au sens de la LOLF :","o":["un prélèvement obligatoire","une recette non fiscale","une recette fiscale"],"a":2,"c":"s","e":"Au sens de la LOLF, la TVA est une recette fiscale de l'État."},{"id":"2021-2-66","s":"2021-2","n":66,"d":"FP","q":"La notion de déficit public correspond :","o":["au déficit des collectivités territoriales, de la sécurité sociale et de l'Etat","à l'endettement de l'Etat","au déficit budgétaire"],"a":0,"c":"s","e":"Le déficit public (au sens de Maastricht) couvre toutes les administrations publiques : État, collectivités, sécurité sociale."},{"id":"2021-2-67","s":"2021-2","n":67,"d":"FP","q":"Nouvellement installé dans un poste, le comptable peut, en cas de doute sur la gestion de son prédécesseur et ce, dans un délai de 6 mois :","o":["saisir la Cour des comptes","émettre des réserves","avertir l'inspection générale des finances"],"a":1,"c":"s","e":"Le comptable entrant peut émettre des réserves motivées sur la gestion de son prédécesseur dans les 6 mois."},{"id":"2021-2-68","s":"2021-2","n":68,"d":"FP","q":"La loi de règlement (LR) :","o":["constate les résultats financiers de chaque année civile","modifie en cours d'exercice les dispositions de la LFI, compte tenu de l'évolution de la conjoncture économique et financière","fixe temporairement les comptes de l'année écoulée"],"a":0,"c":"s","e":"La loi de règlement (aujourd'hui « loi relative aux résultats de la gestion ») arrête les résultats de l'exercice écoulé."},{"id":"2021-2-69","s":"2021-2","n":69,"d":"FP","q":"Qu'est-ce qu'un CBCM ?","o":["Un contrôleur du budget et des charges mixtes","Un chef du bureau de contrôle des missions","Un contrôleur budgétaire et comptable ministériel"],"a":2,"c":"s","e":"CBCM = contrôleur budgétaire et comptable ministériel."},{"id":"2021-2-70","s":"2021-2","n":70,"d":"FP","q":"La possibilité de modifier la répartition des crédits entre deux programmes relevant du même périmètre ministériel correspond à :","o":["un décret de transfert","un décret de virement","un décret d'avance"],"a":1,"c":"s","e":"Virement : entre programmes d'un même ministère. Transfert : entre programmes de ministères différents."},{"id":"2021-2-71","s":"2021-2","n":71,"d":"FP","q":"Quelle est la limite fixée pour le report des crédits hors titre 2 ouverts en loi de finances initiale ?","o":["4 %","3 %","2 %"],"a":1,"c":"p","e":"Art. 15 LOLF : report des crédits de paiement hors titre 2 limité, en principe, à 3 % des crédits initiaux du programme."},{"id":"2021-2-72","s":"2021-2","n":72,"d":"FP","q":"La nomenclature des dépenses de l'Etat par destination se décompose en :","o":["missions","titres","prévisions"],"a":0,"c":"s","e":"La nomenclature par destination : missions, programmes, actions. Les titres correspondent à la nomenclature par nature."},{"id":"2021-2-73","s":"2021-2","n":73,"d":"FP","q":"Un déficit budgétaire est caractérisé dans l'une des situations suivantes. Laquelle ?","o":["Les intérêts de l'emprunt représentent plus de 50% des dépenses","Les engagements réalisés ne pourront pas être honorés","Les recettes du budget général sont inférieures aux dépenses"],"a":2,"c":"s","e":"Déficit budgétaire : recettes du budget de l'État inférieures à ses dépenses."},{"id":"2021-2-74","s":"2021-2","n":74,"d":"FP","q":"Dans quelle annexe explicative sont contenus les projets annuels de performance (PAP) ?","o":["Jaune budgétaire","Bleu budgétaire","Orange budgétaire"],"a":1,"c":"s","e":"Les PAP figurent dans les « bleus budgétaires », annexes du PLF par mission."},{"id":"2021-2-75","s":"2021-2","n":75,"d":"FP","q":"Vous êtes rapporteur à la Cour des comptes, votre rôle est de juger les comptes :","o":["des ordonnateurs","des comptables publics","des élus"],"a":1,"c":"s","e":"La Cour des comptes juge les comptes des comptables publics (régime antérieur à 2023, où elle juge aussi les gestionnaires)."},{"id":"2021-2-76","s":"2021-2","n":76,"d":"FP","q":"Vous occupez les fonctions de contrôleur budgétaire régional. Vous êtes un agent rattaché au :","o":["ministère de l'économie, des finances et de la relance","ministère de l'intérieur","ministère de tutelle de la mission"],"a":0,"c":"s","e":"Le contrôleur budgétaire régional relève du ministère chargé du budget (DGFiP / contrôle budgétaire), placé auprès du préfet de région."},{"id":"2021-2-77","s":"2021-2","n":77,"d":"FP","q":"La LOLF a réformé un texte préexistant qui régissait la comptabilité publique. Il s'agit de :","o":["la loi organique de 1969","l'ordonnance de 1959","l'ordonnance de 1969"],"a":1,"c":"s","e":"La LOLF du 1er août 2001 a remplacé l'ordonnance organique du 2 janvier 1959."},{"id":"2021-2-78","s":"2021-2","n":78,"d":"FP","q":"Le projet annuel de performance :","o":["analyse les prévisions de chaque recette budgétaire et présente les dépenses fiscales","retrace l'effort financier pour réduire la dette publique de l'Etat","présente par programme les actions, les objectifs poursuivis, les résultats à atteindre au moyen d'indicateurs précis"],"a":2,"c":"s","e":"Le PAP présente, par programme, les actions, objectifs et indicateurs de performance."},{"id":"2021-2-79","s":"2021-2","n":79,"d":"FP","q":"Le « Programme de stabilité » doit être impérativement envoyé chaque année :","o":["à la Commission européenne","à la Cour des comptes","au Président de l'Assemblée nationale"],"a":0,"c":"s","e":"Le programme de stabilité est transmis chaque année (avril) à la Commission européenne dans le cadre du semestre européen."},{"id":"2021-2-80","s":"2021-2","n":80,"d":"FP","q":"Vous êtes responsable d'un centre de services partagés, relié à un ordonnateur secondaire. Vous transmettez des factures au comptable public pour mise en paiement. Le comptable peut rejeter une facture pour l'une des raisons suivantes, laquelle ?","o":["En vous indiquant que le matériel acheté est trop cher par rapport aux autres factures qu'il peut recevoir","En vous indiquant que le prix du matériel acheté n'est pas conforme au bordereau de prix unitaire annexé au marché public","En vous indiquant que l'entreprise choisie n'a pas régularisé sa situation fiscale depuis son dernier contrôle"],"a":1,"c":"s","e":"Le comptable contrôle la validité de la créance, dont la conformité du prix au marché. Il n'apprécie pas l'opportunité (A)."},{"id":"2021-2-81","s":"2021-2","n":81,"d":"UE","q":"Quelle est la politique commune de l'Union européenne (UE) la plus importante en termes de budget ?","o":["La politique agricole commune","La politique industrielle","La politique culturelle"],"a":0,"c":"s","e":"La PAC reste la première politique commune en volume budgétaire, avec la cohésion."},{"id":"2021-2-82","s":"2021-2","n":82,"d":"UE","q":"En 2021, les ressources propres de l'Union européenne reposent sur :","o":["les contributions des Etats","les contributions des Etats, les droits de douanes","les contributions des Etats, les droits de douanes, la TVA"],"a":2,"c":"s","e":"Ressources propres : droits de douane, ressource TVA, contribution RNB des États (et ressource plastique depuis 2021)."},{"id":"2021-2-83","s":"2021-2","n":83,"d":"UE","q":"Quel pays, membre de l'Union européenne, n'a pas adopté l'euro ?","o":["Le Luxembourg","L'Irlande","Le Danemark"],"a":2,"c":"s","e":"Le Danemark bénéficie d'une clause d'exemption (opt-out) et n'a pas adopté l'euro."},{"id":"2021-2-84","s":"2021-2","n":84,"d":"UE","q":"Dans le cadre du mécanisme de contrôle du principe de subsidiarité, les parlements nationaux peuvent :","o":["effectuer un recours devant la Cour de justice de l'Union européenne","adresser un avis motivé aux présidents du Parlement européen, du Conseil et de la Commission européenne","prendre une résolution transmise au Parlement européen"],"a":1,"c":"s","e":"Protocole n° 2 : les parlements nationaux adressent un avis motivé aux présidents du Parlement, du Conseil et de la Commission (procédure du « carton jaune »)."},{"id":"2021-2-85","s":"2021-2","n":85,"d":"UE","q":"La durée du mandat de la Commission européenne est de :","o":["6 ans","5 ans","4 ans"],"a":1,"c":"s","e":"La Commission est désignée pour 5 ans, en phase avec la législature du Parlement européen."},{"id":"2021-2-86","s":"2021-2","n":86,"d":"UE","q":"La Charte des droits fondamentaux de l'Union européenne consacre les 6 valeurs individuelles et universelles :","o":["liberté, égalité, solidarité, citoyenneté, justice et fraternité","liberté, égalité, solidarité, citoyenneté, justice et équité","liberté, égalité, solidarité, citoyenneté, justice et dignité"],"a":2,"c":"s","e":"Les six chapitres de la Charte : dignité, libertés, égalité, solidarité, citoyenneté, justice."},{"id":"2021-2-87","s":"2021-2","n":87,"d":"UE","q":"Quelle juridiction dépend de l'Union européenne ?","o":["La Cour de justice de l'Union européenne","La Cour européenne des droits de l'homme","La Convention de sauvegarde des droits de l'homme et des libertés fondamentales"],"a":0,"c":"s","e":"La CJUE est l'institution juridictionnelle de l'UE. La CEDH relève du Conseil de l'Europe."},{"id":"2021-2-88","s":"2021-2","n":88,"d":"UE","q":"Les valeurs de l'Union européenne ont été affirmées pour la première fois par :","o":["le Traité de Lisbonne","la Charte des droits fondamentaux de l'Union européenne","le Traité de Maastricht"],"a":1,"c":"p","e":"La Charte (2000) proclame les valeurs indivisibles et universelles de l'Union. L'article 2 TUE issu de Lisbonne (2007) les consacre ensuite dans les traités. Question ambiguë."},{"id":"2021-2-89","s":"2021-2","n":89,"d":"UE","q":"Parmi ces Etats membres, lequel fait l'objet d'une procédure sur le fondement de l'article 7 du Traité sur l'Union européenne (TUE) ?","o":["La République tchèque","La Pologne","La Bulgarie"],"a":1,"c":"s","e":"La Pologne (2017) puis la Hongrie (2018) ont fait l'objet de la procédure de l'article 7 TUE."},{"id":"2021-2-90","s":"2021-2","n":90,"d":"UE","q":"Quelle est la valeur juridique de la Charte des droits fondamentaux de l'Union européenne ?","o":["Inférieure à celle des traités","Identique à celle des traités","Elle n'a aucune valeur juridique"],"a":1,"c":"s","e":"Depuis Lisbonne (art. 6 TUE), la Charte a la même valeur juridique que les traités."},{"id":"2021-2-91","s":"2021-2","n":91,"d":"UE","q":"Quel est l'objectif de l'Autorité européenne du travail ?","o":["Se substituer aux Etats membres de l'Union européenne en matière d'inspection du travail d'ici 2025","Mettre en place un système de sécurité sociale au niveau de l'Union européenne d'ici 2025","Contribuer à assurer la mobilité équitable de la main d'œuvre dans l'Union européenne"],"a":2,"c":"s","e":"L'Autorité européenne du travail (2019) contribue à une mobilité équitable de la main-d'œuvre."},{"id":"2021-2-92","s":"2021-2","n":92,"d":"UE","q":"Vous êtes en poste à la délégation aux affaires européennes et internationales du ministère de l'enseignement supérieur, de la recherche et de l'innovation. Vous devez préparer des éléments de langage pour une intervention publique de la ministre qui encouragera la mobilité des étudiants. Vous valoriserez dans votre contribution les initiatives du programme :","o":["Erasmus +","Leonardo da Vinci","Jules Verne"],"a":0,"c":"s","e":"Erasmus+ est le programme européen pour l'éducation, la formation, la jeunesse et le sport."},{"id":"2021-2-93","s":"2021-2","n":93,"d":"UE","q":"Vous travaillez au bureau des étrangers d'une préfecture. Lors de l'examen du dossier d'un demandeur d'asile, vous constatez que cette demande relève d'un autre Etat membre de l'Union européenne. Dans ce cadre, vous êtes chargé de la mise en œuvre du :","o":["règlement Berlin III","règlement Dublin III","règlement Schengen III"],"a":1,"c":"s","e":"Le règlement Dublin III (2013) détermine l'État responsable de l'examen d'une demande d'asile."},{"id":"2021-2-94","s":"2021-2","n":94,"d":"UE","q":"Parmi les Etats suivants, non membres de l'Union européenne, lequel a pour monnaie l'euro ?","o":["Le Kosovo","Le Liechtenstein","La Norvège"],"a":0,"c":"p","e":"Le Kosovo utilise l'euro unilatéralement. Le Liechtenstein utilise le franc suisse, la Norvège la couronne."},{"id":"2021-2-95","s":"2021-2","n":95,"d":"UE","q":"La directive Seveso porte sur les établissements :","o":["agricoles","de tourisme","classés à haut risque industriel"],"a":2,"c":"s","e":"La directive Seveso vise les sites industriels à haut risque (accident de Seveso, 1976)."},{"id":"2021-2-96","s":"2021-2","n":96,"d":"UE","q":"À quelle date est entré en vigueur l'accord de retrait qui entérine le départ du Royaume-Uni de l'Union européenne ?","o":["Le 23 juin 2016 à minuit","Le 31 janvier 2020 à minuit","Le 31 décembre 2020 à minuit"],"a":1,"c":"s","e":"L'accord de retrait est entré en vigueur le 31 janvier 2020 à minuit, heure de Bruxelles. La période de transition a pris fin le 31 décembre 2020."},{"id":"2021-2-97","s":"2021-2","n":97,"d":"UE","q":"L'adhésion d'un nouvel Etat à l'Union européenne requiert, de la part des Etats membres, une décision :","o":["à la majorité simple","à l'unanimité","à la majorité qualifiée"],"a":1,"c":"s","e":"Art. 49 TUE : unanimité du Conseil, approbation du Parlement européen, ratification par tous les États."},{"id":"2021-2-98","s":"2021-2","n":98,"d":"UE","q":"Quel pays n'est pas membre de l'Union européenne parce que ses citoyens ont refusé deux fois l'adhésion, par référendum en 1972 et en 1994 ?","o":["La Norvège","La Finlande","La Suisse"],"a":0,"c":"s","e":"La Norvège a rejeté l'adhésion par référendum en 1972 et en 1994."},{"id":"2021-2-99","s":"2021-2","n":99,"d":"UE","q":"Quel traité a donné naissance à l'Union européenne ?","o":["Le traité de Lisbonne","Le traité de Rome","Le traité de Maastricht"],"a":2,"c":"s","e":"Le traité de Maastricht (1992) institue l'Union européenne."},{"id":"2021-2-100","s":"2021-2","n":100,"d":"UE","q":"Quel article du TUE permet à un Etat membre de se retirer volontairement de l'Union européenne ?","o":["L'article 50","L'article 72","L'article 101"],"a":0,"c":"s","e":"Art. 50 TUE (Lisbonne) : retrait volontaire, utilisé par le Royaume-Uni."},{"id":"2021-2-101","s":"2021-2","n":101,"d":"NUM","q":"Au sujet de l'anonymisation des données personnelles, le règlement général sur la protection des données (RGPD) :","o":["comporte une obligation générale qui s'applique à tous les organismes traitant des données personnelles","ne comporte pas d'obligation générale d'anonymisation, il s'agit d'une solution parmi d'autres","effectue une distinction entre les organismes privés et publics"],"a":1,"c":"s","e":"Le RGPD ne pose pas d'obligation générale d'anonymisation : c'est une mesure possible parmi d'autres (pseudonymisation…)."},{"id":"2021-2-102","s":"2021-2","n":102,"d":"NUM","q":"Votre administration souhaite mettre en place la consultation de documents via une authentification par des dispositifs biométriques, elle vous demande si cela est possible immédiatement, ou s'il faut obtenir une autorisation. Vous lui répondez qu'il est nécessaire d'effectuer une demande d'autorisation auprès :","o":["de la préfecture","des services de police","de la Commission nationale de l'informatique et des libertés"],"a":2,"c":"p","e":"Pour les traitements biométriques de l'État, la loi Informatique et libertés prévoit un décret en Conseil d'État après avis de la CNIL. Réponse attendue : la CNIL."},{"id":"2021-2-103","s":"2021-2","n":103,"d":"NUM","q":"Le chef d'établissement de votre lycée souhaite mettre les photos des personnels de son lycée sur le site internet, il doit :","o":["demander l'autorisation à chacun des personnels et aux autorités de tutelles","demander l'autorisation à chacun des personnels","c'est interdit, les photos des agents publics sont confidentielles"],"a":1,"c":"s","e":"Droit à l'image : l'autorisation de chaque personne est nécessaire avant diffusion de sa photo."},{"id":"2021-2-104","s":"2021-2","n":104,"d":"NUM","q":"Quel est le nom du service en ligne proposé par l'Etat pour sécuriser et simplifier la connexion à plus de 700 services en ligne ?","o":["FranceConnect","Service public","Place de l'emploi public"],"a":0,"c":"s","e":"FranceConnect est le dispositif d'identification de l'État."},{"id":"2021-2-105","s":"2021-2","n":105,"d":"NUM","q":"Que permet de faire la plateforme « internet-signalement.gouv.fr » (anciennement PHAROS), gérée par le ministère de l'intérieur ?","o":["Signaler de façon dématérialisée des infractions au code de la route","Signaler la présence de contenu illicite sur internet","Déposer une pré-plainte en ligne"],"a":1,"c":"s","e":"PHAROS / internet-signalement.gouv.fr permet de signaler des contenus illicites en ligne."},{"id":"2021-2-106","s":"2021-2","n":106,"d":"NUM","q":"Votre direction vous demande de simplifier le circuit de validation et de signature des documents de votre service. Dans ce cadre, vous décidez de mettre en place une signature électronique qualifiée. En quoi consiste cette dernière ?","o":["Une copie scannée de la signature physique appliquée sur le document","Une signature effectuée sur le document via une tablette et un stylet","Une certification chiffrée et cryptée de la validation du document"],"a":2,"c":"s","e":"La signature électronique qualifiée repose sur un certificat qualifié et un dispositif sécurisé (eIDAS). Ce n'est pas une image scannée."},{"id":"2021-2-107","s":"2021-2","n":107,"d":"NUM","q":"Le plan France Très haut débit (THD), lancé au printemps 2013, vise à couvrir l'intégralité du territoire en très haut débit, d'ici à :","o":["2022","2024","2026"],"a":0,"c":"s","e":"Le plan France THD visait une couverture intégrale en très haut débit d'ici 2022."},{"id":"2021-2-108","s":"2021-2","n":108,"d":"NUM","q":"Quel est l'un des piliers du marché unique numérique ?","o":["Centraliser sur un serveur les données numériques européennes","Améliorer l'accès aux biens et services numériques dans toute l'Union européenne pour les consommateurs et les entreprises","Créer un marché numérique réservé aux citoyens européens"],"a":1,"c":"s","e":"Le marché unique numérique vise à améliorer l'accès aux biens et services numériques dans l'UE."},{"id":"2021-2-109","s":"2021-2","n":109,"d":"NUM","q":"L'un des objectifs principaux de l'intranet d'une administration publique est de :","o":["favoriser l'accessibilité en interne des contenus et services proposés par cette administration","créer des recettes financières pour alimenter le budget de cette administration","faire de la publicité pour des enseignes commerciales partenaires de cette administration"],"a":0,"c":"s","e":"L'intranet rend accessibles en interne les contenus et services de l'administration."},{"id":"2021-2-110","s":"2021-2","n":110,"d":"NUM","q":"Vous prenez votre poste en tant que gestionnaire d'un établissement scolaire du second degré, le chef d'établissement souhaite placer des caméras de vidéosurveillance à l'entrée du lycée. Les caméras peuvent être orientées pour filmer :","o":["exclusivement l'entrée du lycée","toute la rue","l'entrée du lycée et ses abords"],"a":0,"c":"s","e":"Selon la CNIL, un établissement ne peut filmer que ses propres accès, pas la voie publique."},{"id":"2021-2-111","s":"2021-2","n":111,"d":"NUM","q":"Pourquoi parle-t-on d'encodage des caractères en informatique ?","o":["Parce qu'un ordinateur travaille seulement avec des lettres (de A à Z)","Parce qu'un ordinateur travaille seulement en binaire (avec des 0 et des 1)","Pour compresser des données"],"a":1,"c":"s","e":"L'ordinateur ne manipule que du binaire : l'encodage (ASCII, UTF-8) associe un code à chaque caractère."},{"id":"2021-2-112","s":"2021-2","n":112,"d":"NUM","q":"Qu'est-ce qu'un FAI ?","o":["Un fournisseur d'accès à internet","Un fournisseur d'accès à l'innovation","Un fournisseur d'accès informatique"],"a":0,"c":"s","e":"FAI = fournisseur d'accès à Internet."},{"id":"2021-2-113","s":"2021-2","n":113,"d":"NUM","q":"Un lien hypertexte permet :","o":["d'accéder à des informations reliées entre elles","de compléter automatiquement la saisie d'un document","de créer une arborescence de données en mémoire"],"a":0,"c":"s","e":"Le lien hypertexte relie des ressources entre elles."},{"id":"2021-2-114","s":"2021-2","n":114,"d":"NUM","q":"Le réseau minitel a cessé d'être exploité en :","o":["1998","2005","2012"],"a":2,"c":"s","e":"Le Minitel a été arrêté le 30 juin 2012."},{"id":"2021-2-115","s":"2021-2","n":115,"d":"NUM","q":"Le Comité Européen de la Protection des Données :","o":["a pour mission de désigner les référents RGPD des Etats membres de l'Union européenne","garantit l'application du RGPD dans les Etats membres de l'Union européenne","élabore la réglementation du droit d'accès à internet dans l'Union européenne"],"a":1,"c":"s","e":"Le CEPD veille à l'application cohérente du RGPD dans l'UE."},{"id":"2021-2-116","s":"2021-2","n":116,"d":"NUM","q":"De quoi vous protège un antivirus ?","o":["De toutes les tentatives de piratage","De tous les virus","De certains virus, logiciels malveillants et comportements suspects"],"a":2,"c":"s","e":"Aucun antivirus ne protège de tout : il détecte certains logiciels malveillants et comportements suspects."},{"id":"2021-2-117","s":"2021-2","n":117,"d":"NUM","q":"Que signifie HDMI en français ?","o":["Haut débit multi interface","Haute définition multicanal interfacé","Interface multimédia à haute définition"],"a":2,"c":"s","e":"HDMI = High-Definition Multimedia Interface, soit interface multimédia haute définition."},{"id":"2021-2-118","s":"2021-2","n":118,"d":"NUM","q":"Un data center (centre de données) est :","o":["une infrastructure composée d'ordinateurs et d'espaces de stockage d'informations sous forme numérique","une base de données accessible au public","un fournisseur de services cloud (nuage)"],"a":0,"c":"s","e":"Un data center est une infrastructure d'hébergement de serveurs et de stockage."},{"id":"2021-2-119","s":"2021-2","n":119,"d":"NUM","q":"Qu'est-ce que la RAM ?","o":["La mémoire du disque dur d'un ordinateur","La mémoire vive d'un ordinateur","Une mémoire supplémentaire externe d'un ordinateur"],"a":1,"c":"s","e":"La RAM est la mémoire vive, volatile."},{"id":"2021-2-120","s":"2021-2","n":120,"d":"NUM","q":"Une photo publiée sur les réseaux sociaux :","o":["reste soumise aux règles du droit d'auteur","devient la propriété du réseau social qui l'héberge","devient libre de droits"],"a":0,"c":"s","e":"La publication d'une photo ne transfère pas les droits d'auteur : ils restent au photographe (sauf licence consentie)."},{"id":"2022-1-1","s":"2022-1","n":1,"d":"CAJ","q":"Parmi les propositions suivantes, quelle autorité dispose du pouvoir de police administrative générale ?","o":["Le député","Le ministre des armées","Le maire"],"a":2,"c":"s","e":"Le maire détient la police administrative générale au niveau communal (art. L. 2212-2 CGCT), comme le préfet et le Premier ministre à leur échelon."},{"id":"2022-1-2","s":"2022-1","n":2,"d":"CAJ","q":"Vous êtes un(e) fonctionnaire du ministère de l'enseignement supérieur, de la recherche et de l'innovation mis(e) à disposition d'un établissement public de santé. À ce titre, vous :","o":["êtes rémunéré(e) par votre administration d'origine","êtes rémunéré(e) par votre organisme d'accueil","bénéficiez d'une rémunération versée à parts égales par votre administration d'origine et par votre organisme d'accueil"],"a":0,"c":"s","e":"L'agent mis à disposition reste dans son corps et continue d'être rémunéré par son administration d'origine, en principe remboursée par l'organisme d'accueil."},{"id":"2022-1-3","s":"2022-1","n":3,"d":"CAJ","q":"Dans quelle partie du territoire français continue à s'appliquer le régime concordataire de 1801 régissant les relations entre les religions et l'Etat ?","o":["La Nouvelle-Calédonie","La Polynésie française","L'Alsace-Moselle"],"a":2,"c":"s","e":"Le Concordat de 1801 continue de s'appliquer en Alsace-Moselle, qui n'était pas française en 1905."},{"id":"2022-1-4","s":"2022-1","n":4,"d":"CAJ","q":"L'intercommunalité désigne :","o":["la fusion de cinq communes","la coopération entre communes au sein d'un établissement public de coopération intercommunale","la commission qui exerce la tutelle d'une commune ayant des problèmes de gestion"],"a":1,"c":"s","e":"L'intercommunalité est la coopération entre communes au sein d'un EPCI."},{"id":"2022-1-5","s":"2022-1","n":5,"d":"CAJ","q":"La transparence administrative trouve son origine :","o":["dans la loi du 12 avril 2000 relative aux droits des citoyens dans leurs relations avec les administrations","dans le décret du 28 novembre 1983 concernant les relations entre l'administration et les usagers","dans la loi du 17 juillet 1978 portant diverses mesures d'amélioration des relations entre l'administration et le public"],"a":2,"c":"s","e":"La loi du 17 juillet 1978 (création de la CADA) consacre la liberté d'accès aux documents administratifs."},{"id":"2022-1-6","s":"2022-1","n":6,"d":"CAJ","q":"Le sigle « 3DS » du projet de loi ainsi nommé signifie :","o":["déconcentration, décentralisation, décomplexification et simplification","différenciation, décentralisation, déconcentration et simplification","décentralisation, développement durable, simplification"],"a":1,"c":"s","e":"Loi 3DS (21 février 2022) : différenciation, décentralisation, déconcentration et simplification."},{"id":"2022-1-7","s":"2022-1","n":7,"d":"CAJ","q":"Vous êtes en poste au sein d'un pôle d'appui juridique en région relevant du ministère de l'intérieur. Un agent de préfecture souhaite anticiper la survenance d'un recours contre un arrêté préfectoral de déclaration d'utilité publique en vue de l'expropriation d'un bien privé, et vous demande de quel ordre de juridiction relèverait ce contentieux, le cas échéant. Que lui indiquez-vous ?","o":["Le contentieux relève de la juridiction administrative","Le contentieux relève de la juridiction judiciaire","Le Tribunal des conflits doit être saisi pour régler cette question de compétence"],"a":0,"c":"s","e":"L'arrêté de DUP est un acte administratif contesté devant le juge administratif. Seule la phase judiciaire (transfert de propriété, indemnités) relève du juge judiciaire."},{"id":"2022-1-8","s":"2022-1","n":8,"d":"CAJ","q":"Qui exerce traditionnellement la présidence du Conseil d'Etat ?","o":["Le secrétaire général du Gouvernement","Le vice-président du Conseil d'Etat","Le Premier ministre"],"a":1,"c":"p","e":"Le Premier ministre est formellement président du Conseil d'État, mais c'est le vice-président qui exerce effectivement la présidence."},{"id":"2022-1-9","s":"2022-1","n":9,"d":"CAJ","q":"En poste dans un rectorat, votre hiérarchie vous demande comment justifier un refus de communiquer un document administratif. Vous lui indiquez que c'est possible lorsque :","o":["la personne concernée n'est pas un ressortissant français","il n'y a pas d'intérêt à agir","le document est préparatoire à une décision qui n'a pas encore été prise"],"a":2,"c":"s","e":"Art. L. 311-2 CRPA : pas de communication des documents préparatoires tant que la décision n'est pas prise."},{"id":"2022-1-10","s":"2022-1","n":10,"d":"CAJ","q":"L'administration ne peut abroger ou retirer une décision créatrice de droits que si cette décision est :","o":["illégale, et si le retrait intervient dans le délai de quatre mois suivant la prise de cette décision","illégale","illégale, et si le retrait intervient dans le délai de deux mois suivant la prise de cette décision"],"a":0,"c":"s","e":"Art. L. 242-1 CRPA : abrogation ou retrait d'une décision créatrice de droits si elle est illégale et dans les 4 mois suivant son édiction (jurisprudence Ternon)."},{"id":"2022-1-11","s":"2022-1","n":11,"d":"CAJ","q":"Laquelle de ces institutions est une autorité administrative indépendante :","o":["la commission du contentieux du stationnement payant","la Haute autorité pour la transparence de la vie publique","l'Office national des forêts"],"a":1,"c":"s","e":"La HATVP (2013) est une AAI. L'ONF est un EPIC."},{"id":"2022-1-12","s":"2022-1","n":12,"d":"CAJ","q":"La notion juridique de voie de fait désigne une action de l'administration qui porte atteinte :","o":["soit au droit de propriété, soit à une liberté fondamentale","uniquement à une liberté fondamentale","uniquement au droit de propriété"],"a":0,"c":"s","e":"Voie de fait (TC 2013 Bergoend) : atteinte à la liberté individuelle ou extinction du droit de propriété. A est la réponse attendue parmi les propositions."},{"id":"2022-1-13","s":"2022-1","n":13,"d":"CAJ","q":"En tant que fonctionnaire, vos garanties fondamentales sont fixées par :","o":["la Constitution","la loi","le décret"],"a":1,"c":"s","e":"Art. 34 C : la loi fixe les garanties fondamentales accordées aux fonctionnaires."},{"id":"2022-1-14","s":"2022-1","n":14,"d":"CAJ","q":"Un décret délibéré en Conseil des ministres est pris par :","o":["le Président de la République","le Premier ministre","le ministre compétent"],"a":0,"c":"s","e":"Art. 13 C : le Président signe les décrets délibérés en Conseil des ministres."},{"id":"2022-1-15","s":"2022-1","n":15,"d":"CAJ","q":"Avant d'être inscrites dans le statut général des fonctionnaires par la loi du 20 avril 2016 relative à la déontologie et aux droits et obligations des fonctionnaires, les obligations de dignité, d'impartialité, d'intégrité et de probité étaient :","o":["consacrées par des dispositions d'ordre réglementaire","portées par le droit européen","consacrées par le juge administratif"],"a":2,"c":"s","e":"Dignité, impartialité, intégrité et probité étaient des obligations dégagées par le juge administratif avant d'être codifiées en 2016."},{"id":"2022-1-16","s":"2022-1","n":16,"d":"CAJ","q":"Quelles sont les sanctions disciplinaires du premier groupe applicables au fonctionnaire titulaire ?","o":["L'avertissement, le blâme et l'exclusion temporaire de fonctions de 1 à 3 jours","L'avertissement, le blâme, l'abaissement d'échelon à l'échelon immédiatement inférieur à celui détenu par le fonctionnaire et l'exclusion temporaire de fonctions de 4 à 15 jours","L'avertissement, le blâme, la radiation du tableau d'avancement et la révocation"],"a":0,"c":"s","e":"1er groupe : avertissement, blâme, exclusion temporaire de 1 à 3 jours (depuis 2019)."},{"id":"2022-1-17","s":"2022-1","n":17,"d":"CAJ","q":"Quelle juridiction est compétente en matière de contentieux de la fonction publique ?","o":["La juridiction prud'homale","La juridiction administrative","La juridiction judiciaire"],"a":1,"c":"s","e":"Le contentieux de la fonction publique relève de la juridiction administrative."},{"id":"2022-1-18","s":"2022-1","n":18,"d":"CAJ","q":"Vous êtes, en tant que fonctionnaire :","o":["titularisé dans un emploi donnant une possibilité d'avancement à divers niveaux de responsabilité","titularisé dans un grade donnant vocation à occuper des emplois correspondant à un certain niveau de responsabilité","titulaire de votre grade et de votre emploi correspondant à un certain niveau de responsabilité"],"a":1,"c":"s","e":"Séparation du grade et de l'emploi : le fonctionnaire est titulaire de son grade, qui donne vocation à occuper certains emplois."},{"id":"2022-1-19","s":"2022-1","n":19,"d":"CAJ","q":"En tant que fonctionnaire de l'Etat, vous pouvez percevoir des indemnités liées à votre statut et, le cas échéant, des indemnités liées à votre manière de servir, dont :","o":["l'indemnité de formation, de spécialisation et d'engagement","l'indemnité de fonctions, de sujétion et d'expertise","le complément indemnitaire annuel"],"a":2,"c":"s","e":"Le CIA (RIFSEEP) tient compte de l'engagement et de la manière de servir. L'IFSE est liée aux fonctions."},{"id":"2022-1-20","s":"2022-1","n":20,"d":"CAJ","q":"Vous êtes chef de service dans une direction régionale de l'environnement, de l'aménagement et du logement. L'un des ingénieurs des travaux publics de l'Etat vous informe vouloir travailler sur une mission de trois années, pour un bureau d'étude privé n'exerçant pas de mission de service public. L'agent va donc solliciter une position de :","o":["mise à disposition","détachement","disponibilité"],"a":2,"c":"s","e":"Travailler pour un organisme privé non chargé d'une mission de service public se fait en disponibilité pour convenances personnelles (ou création d'entreprise)."},{"id":"2022-1-21","s":"2022-1","n":21,"d":"CAJ","q":"Depuis le 1er février 2020, quelle instance effectue les contrôles déontologiques des agents publics de l'Etat ?","o":["La commission de déontologie de la fonction publique","La Haute Autorité de transparence de la vie publique","Le Conseil supérieur de la fonction publique de l'Etat"],"a":1,"c":"s","e":"Depuis le 1er février 2020 (loi de 2019), la HATVP a repris les missions de la commission de déontologie de la fonction publique."},{"id":"2022-1-22","s":"2022-1","n":22,"d":"CAJ","q":"Les sanctions disciplinaires applicables aux fonctionnaires se répartissent :","o":["en quatre groupes, par ordre décroissant de sévérité","en quatre groupes, par ordre croissant de sévérité","en cinq groupes, par ordre décroissant de sévérité"],"a":1,"c":"s","e":"Quatre groupes de sanctions, du moins sévère au plus sévère."},{"id":"2022-1-23","s":"2022-1","n":23,"d":"CAJ","q":"Vous êtes chef de service. Vous constatez qu'un fonctionnaire chargé de l'accueil du public distribue au guichet des tracts politiques. À votre avis, cet agent enfreint-il une obligation déontologique ?","o":["Non, car tout fonctionnaire bénéficie de la liberté d'opinion","Oui, car une obligation de neutralité s'impose à tout fonctionnaire dans l'exercice de ses fonctions","Oui, car une obligation de probité s'impose à tout fonctionnaire"],"a":1,"c":"s","e":"L'obligation de neutralité interdit toute manifestation d'opinion politique dans le service."},{"id":"2022-1-24","s":"2022-1","n":24,"d":"CAJ","q":"L'accident survenu durant le temps et sur le lieu du service est :","o":["reconnu imputable au service lorsque l'agent en apporte la preuve","présumé imputable au service","présumé imputable au service en l'absence de faute personnelle"],"a":2,"c":"s","e":"Art. L. 822-18 CGFP : présomption d'imputabilité au service, sauf faute personnelle ou circonstance particulière détachant l'accident du service."},{"id":"2022-1-25","s":"2022-1","n":25,"d":"CAJ","q":"Vous êtes un agent en situation de handicap et souhaitez bénéficier de la reconnaissance de la qualité de travailleur handicapé (RQTH). Auprès de qui devez-vous déposer votre demande ?","o":["La maison départementale des personnes handicapées (MDPH) de votre lieu de résidence","La médecine du travail de votre administration","Le référent handicap de votre administration"],"a":0,"c":"s","e":"La demande de RQTH se dépose à la MDPH ; la décision est prise par la CDAPH."},{"id":"2022-1-26","s":"2022-1","n":26,"d":"CAJ","q":"En tant qu'agent public, vous pouvez user de votre droit de retrait lorsque :","o":["vous avez un motif raisonnable de penser que vous vous trouvez exposé à un danger grave et imminent pour votre vie ou votre santé et/ou vous constatez une défectuosité dans les systèmes de protection","vous avez sollicité par écrit l'usage de ce droit à votre chef de service en motivant cette demande sans condition particulière","vous avez sollicité par écrit l'usage de ce droit à votre chef de service en motivant cette demande par un risque pour votre qualité de vie au travail, localisé sur votre lieu de travail"],"a":0,"c":"s","e":"Droit de retrait : motif raisonnable de penser à un danger grave et imminent, ou défectuosité des systèmes de protection. Pas d'autorisation préalable."},{"id":"2022-1-27","s":"2022-1","n":27,"d":"CAJ","q":"Vous êtes attaché d'administration de l'Etat. À ce titre, en tant que fonctionnaire, vous pouvez être placé dans :","o":["cinq positions administratives : activité, détachement, disponibilité, congé parental ou mise à disposition","quatre positions administratives : activité, détachement, disponibilité ou congé parental","trois positions administratives : activité, détachement ou disponibilité"],"a":1,"c":"s","e":"Quatre positions : activité, détachement, disponibilité, congé parental. La mise à disposition est une modalité de l'activité."},{"id":"2022-1-28","s":"2022-1","n":28,"d":"CAJ","q":"Un fonctionnaire travaillant sous votre autorité vous demande s'il peut s'absenter pour participer à une campagne électorale car il se présente à une élection politique locale. Que lui répondez-vous ?","o":["Un agent public se présentant à une élection politique bénéficie d'un nombre de jours d'autorisation d'absence plafonné pour pouvoir participer à la campagne électorale","Un agent public se présentant à une élection politique bénéficie d'un nombre illimité de jours d'autorisation d'absence pour pouvoir participer à la campagne électorale","Aucune autorisation d'absence ne peut être accordée aux agents publics se présentant à une élection politique"],"a":0,"c":"s","e":"Les candidats bénéficient d'autorisations d'absence plafonnées (par exemple 10 jours pour les municipales, 20 jours pour les législatives)."},{"id":"2022-1-29","s":"2022-1","n":29,"d":"CAJ","q":"Vous êtes le référent déontologue d'un établissement public. Un agent contractuel se présentant comme un lanceur d'alerte souhaite dénoncer un conflit d'intérêt concernant son supérieur hiérarchique. Vous lui indiquez que la protection du lanceur d'alerte dans la fonction publique :","o":["ne s'applique pas aux agents contractuels","s'applique aux agents contractuels mais ne recouvre que la dénonciation des crimes et délits","s'applique aux agents contractuels et recouvre la dénonciation des crimes et délits ainsi que les conflits d'intérêts"],"a":2,"c":"s","e":"La protection des lanceurs d'alerte couvre aussi les contractuels, pour les crimes, délits et conflits d'intérêts."},{"id":"2022-1-30","s":"2022-1","n":30,"d":"CAJ","q":"Qu'est-ce qu'un glissement vieillesse technicité (GVT) positif ?","o":["Une augmentation de la qualification des agents résultant d'un accroissement d'expérience dans la fonction publique","Un solde qui traduit l'augmentation de la masse salariale du fait de la progression des agents dans leurs grilles indiciaires","Une augmentation de la qualification des agents résultant d'un accroissement d'expérience sur des postes d'une même famille professionnelle au sein de la fonction publique"],"a":1,"c":"s","e":"GVT positif : hausse de la masse salariale due à la progression des agents dans leurs grilles (avancements, promotions)."},{"id":"2022-1-31","s":"2022-1","n":31,"d":"CAJ","q":"Quelle sanction disciplinaire ne fait pas l'objet d'une inscription dans le dossier de l'agent ?","o":["L'avertissement","L'exclusion temporaire de fonctions d'une durée maximale de 3 jours","Le blâme"],"a":0,"c":"s","e":"L'avertissement n'est pas inscrit au dossier individuel. Le blâme et l'exclusion de 1 à 3 jours y sont inscrits (effacement automatique après 3 ans)."},{"id":"2022-1-32","s":"2022-1","n":32,"d":"CAJ","q":"Dans le cadre de la législation sur le non cumul des mandats, quelle est la réponse juste ?","o":["Un ministre peut être maire d'une grande ville de plus de 100 000 habitants","Un député peut être vice-président d'un conseil régional","Un maire d'une petite commune de moins de 1000 habitants peut présider un conseil départemental"],"a":0,"c":"s","e":"Aucune loi n'interdit à un ministre d'être maire (règle politique, pas juridique). Un député ne peut exercer une fonction exécutive locale ; la loi interdit le cumul maire et président de conseil départemental quelle que soit la taille de la commune."},{"id":"2022-1-33","s":"2022-1","n":33,"d":"CAJ","q":"Qu'interdit le principe d'égalité en France ?","o":["Que des personnes placées dans des situations différentes soient traitées de façon identique","Que des personnes placées dans des situations identiques soient traitées différemment","Que des personnes placées dans des situations identiques soient traitées de façon identique"],"a":1,"c":"s","e":"Le principe d'égalité interdit de traiter différemment des personnes dans une situation identique. Il n'interdit pas de traiter pareil des situations différentes."},{"id":"2022-1-34","s":"2022-1","n":34,"d":"CAJ","q":"Les ordonnances prévues à l'article 38 de la Constitution n'acquièrent pleine valeur législative qu'après leur :","o":["légalisation","déclassement","ratification expresse"],"a":2,"c":"s","e":"Depuis 2008 (art. 38 C), l'ordonnance n'acquiert valeur législative qu'après ratification expresse."},{"id":"2022-1-35","s":"2022-1","n":35,"d":"CAJ","q":"Pour être recevable, une proposition de loi doit :","o":["être conforme aux orientations gouvernementales","avoir été examinée en commission des finances du Sénat.","ne pas avoir pour conséquence soit une diminution des ressources publiques soit la création ou l'aggravation d'une charge publique"],"a":2,"c":"s","e":"Art. 40 C : irrecevabilité financière des propositions qui diminuent les ressources ou créent/aggravent une charge publique."},{"id":"2022-1-36","s":"2022-1","n":36,"d":"CAJ","q":"En droit français, quelle(s) norme(s) se situe(nt) au sommet de la hiérarchie des normes ?","o":["Les actes administratifs réglementaires","La Constitution et le « bloc de constitutionnalité »","Les traités et les accords internationaux"],"a":1,"c":"s","e":"La Constitution et le bloc de constitutionnalité sont au sommet de la hiérarchie des normes en droit interne."},{"id":"2022-1-37","s":"2022-1","n":37,"d":"CAJ","q":"Pour être recevable, une motion de censure doit être signée par 1/10e au moins des membres :","o":["du Sénat","de l'Assemblée nationale","du Sénat et de l'Assemblée nationale"],"a":1,"c":"s","e":"Art. 49 al. 2 C : la motion de censure doit être signée par au moins 1/10 des députés."},{"id":"2022-1-38","s":"2022-1","n":38,"d":"CAJ","q":"Selon la Constitution, quelle est l'autorité responsable de la Défense nationale ?","o":["Le Premier ministre","Le Président de la République","Le ministre des armées"],"a":0,"c":"s","e":"Art. 21 C : le Premier ministre est responsable de la défense nationale. Le Président est chef des armées (art. 15)."},{"id":"2022-1-39","s":"2022-1","n":39,"d":"CAJ","q":"La question prioritaire de constitutionnalité peut être utilisée par les collectivités territoriales depuis :","o":["2008","2010","2012"],"a":1,"c":"s","e":"La QPC est ouverte depuis le 1er mars 2010 à toute partie à un litige, y compris les collectivités territoriales."},{"id":"2022-1-40","s":"2022-1","n":40,"d":"CAJ","q":"L'article 16 de la Constitution du 4 octobre 1958 :","o":["introduit la question prioritaire de constitutionnalité","pose le principe du contrôle de légalité","régit les pouvoirs exceptionnels du Président de la République"],"a":2,"c":"s","e":"L'article 16 organise les pouvoirs exceptionnels du Président en cas de crise grave."},{"id":"2022-1-41","s":"2022-1","n":41,"d":"CAJ","q":"Sous la Ve République, le chef des armées est :","o":["le Premier ministre","le Président de la République","le chef d'état-major des armées nommé par le Président de la République"],"a":1,"c":"s","e":"Art. 15 C : le Président de la République est le chef des armées."},{"id":"2022-1-42","s":"2022-1","n":42,"d":"CAJ","q":"Le nombre de conseillers pour un ministre de plein exercice est, par principe, limité à :","o":["8 conseillers","12 conseillers","15 conseillers"],"a":2,"c":"p","e":"Décret de 2020 : un cabinet de ministre compte au plus 15 membres (13 pour un ministre délégué, 8 pour un secrétaire d'État)."},{"id":"2022-1-43","s":"2022-1","n":43,"d":"CAJ","q":"Le Conseil constitutionnel est renouvelé par tiers :","o":["tous les 3 ans","tous les 4 ans","tous les 5 ans"],"a":0,"c":"s","e":"Le Conseil constitutionnel est renouvelé par tiers tous les 3 ans."},{"id":"2022-1-44","s":"2022-1","n":44,"d":"CAJ","q":"Dans le cadre de la navette parlementaire, qui statue en dernier ressort en cas de désaccord entre les deux chambres ?","o":["Le Conseil constitutionnel","Le Sénat","L'Assemblée nationale"],"a":2,"c":"s","e":"Art. 45 C : en cas de désaccord persistant, le Gouvernement peut donner le dernier mot à l'Assemblée nationale."},{"id":"2022-1-45","s":"2022-1","n":45,"d":"CAJ","q":"Quelle affirmation, relative aux commissions d'enquête parlementaires, est inexacte ?","o":["Les personnes auditionnées peuvent être des membres du Gouvernement, des commissaires européens, des chercheurs, des représentants des milieux socioprofessionnels…","Elles peuvent être initiées par une pétition recueillant au moins 500 000 signatures","Les auditions sont, par principe, ouvertes à la presse et retransmises en direct sur le site internet de l'Assemblée nationale"],"a":1,"c":"s","e":"Une commission d'enquête ne peut pas être créée par pétition citoyenne (seul le CESE peut être saisi par pétition de 150 000 personnes). Les auditions sont en principe publiques."},{"id":"2022-1-46","s":"2022-1","n":46,"d":"CAJ","q":"De quel(s) pouvoir(s) la Haute Autorité pour la transparence de la vie publique est-elle dotée ?","o":["Un pouvoir de sanction administrative","Un pouvoir de contrôle","Un pouvoir de contrôle et un pouvoir de sanction administrative"],"a":1,"c":"p","e":"La HATVP contrôle déclarations de patrimoine et d'intérêts et le respect des règles déontologiques. Elle peut enjoindre, mais transmet au parquet plutôt que de sanctionner elle-même."},{"id":"2022-1-47","s":"2022-1","n":47,"d":"CAJ","q":"Le chancelier des universités est aussi :","o":["le vice-recteur d'académie","le directeur de cabinet du recteur d'académie","le recteur d'académie"],"a":2,"c":"s","e":"Le recteur de région académique est chancelier des universités."},{"id":"2022-1-48","s":"2022-1","n":48,"d":"CAJ","q":"Quel texte a autorisé le droit de vote des femmes en France ?","o":["La Constitution du 4 octobre 1958","L'ordonnance du 21 avril 1944","La Constitution du 27 octobre 1946"],"a":1,"c":"s","e":"L'ordonnance du 21 avril 1944 accorde le droit de vote et d'éligibilité aux femmes."},{"id":"2022-1-49","s":"2022-1","n":49,"d":"CAJ","q":"Combien existe-t-il de tribunaux administratifs en France ?","o":["100","31","42"],"a":2,"c":"s","e":"42 tribunaux administratifs (31 en métropole, 11 outre-mer)."},{"id":"2022-1-50","s":"2022-1","n":50,"d":"CAJ","q":"Qui assure le secrétariat du Conseil des ministres ?","o":["Le secrétaire général de la Présidence de la République","Le secrétaire général du Gouvernement","Le ministre, porte-parole du Gouvernement"],"a":1,"c":"s","e":"Le SGG assure le secrétariat du Conseil des ministres."},{"id":"2022-1-51","s":"2022-1","n":51,"d":"CAJ","q":"Quelle est la durée d'un mandat de conseiller municipal ?","o":["Cinq ans","Six ans","Sept ans"],"a":1,"c":"s","e":"Les conseillers municipaux sont élus pour 6 ans."},{"id":"2022-1-52","s":"2022-1","n":52,"d":"CAJ","q":"Depuis la loi du 7 août 2015 portant nouvelle organisation territoriale de la République, quelle est l'autorité compétente en matière de mobilité interurbaine ?","o":["Le conseil départemental","Le conseil régional","La métropole"],"a":1,"c":"s","e":"Loi NOTRe : la région est l'autorité organisatrice des transports interurbains."},{"id":"2022-1-53","s":"2022-1","n":53,"d":"CAJ","q":"Depuis le 1er avril 2021, les compétences des différentes entités chargées des questions économiques et sociales sont attribuées à :","o":["la direction régionale et interdépartementale de l'environnement, de l'aménagement et des transports (DRIEAT) fusionnant la direction régionale et interdépartementale de l'équipement et de l'aménagement (DRIEA) et la direction régionale et interdépartementale de l'environnement et de l'énergie (DRIEE)","la direction de la recherche, des études, de l'évaluation et des statistiques (DREES) fusionnant les schémas régionaux de développement économique et social","la direction régionale et interdépartementale de l'économie, de l'emploi, du travail et des solidarités (DREETS) réunissant la direction régionale des entreprises, de la concurrence, de la consommation, du travail et de l'emploi (DIRECCTE) et la direction régionale de la cohésion sociale (DRCS)"],"a":2,"c":"s","e":"Les DREETS (1er avril 2021) regroupent les DIRECCTE et les services de cohésion sociale."},{"id":"2022-1-54","s":"2022-1","n":54,"d":"CAJ","q":"Dans le cadre de la réforme de l'Etat, lesquelles des missions suivantes ont été attribuées à l'Institut national du service public ?","o":["Le recrutement et la formation initiale des cadres supérieurs de la fonction publique de l'Etat","Le recrutement, la formation initiale et la politique des ressources humaines des cadres supérieurs de la fonction publique de l'Etat","Le recrutement et la formation de tous les cadres supérieurs de la fonction publique de l'Etat, de la fonction publique territoriale et de la fonction publique hospitalière"],"a":0,"c":"s","e":"L'INSP (2022) recrute et forme (initialement et en continu) les cadres supérieurs de l'État. La politique RH de l'encadrement supérieur relève de la DIESE."},{"id":"2022-1-55","s":"2022-1","n":55,"d":"CAJ","q":"Dans le cadre d'un contentieux administratif, votre supérieur hiérarchique vous demande des éléments sur la formation en assemblée du contentieux du Conseil d'Etat. Vous lui indiquez que l'assemblée statue sur les affaires qui présentent une importance remarquable, et que :","o":["présidée par le président du Conseil d'Etat, elle comprend 17 membres","présidée par le vice-président du Conseil d'Etat, elle comprend 17 membres","présidée par le vice-président du Conseil d'Etat, elle comprend 10 membres"],"a":1,"c":"s","e":"L'Assemblée du contentieux, présidée par le vice-président, compte 17 membres et juge les affaires d'importance remarquable."},{"id":"2022-1-56","s":"2022-1","n":56,"d":"CAJ","q":"Le principe de l'organisation décentralisée de la République est posé par :","o":["la loi","la Constitution","un principe général du droit"],"a":1,"c":"s","e":"Art. 1er C (révision du 28 mars 2003) : « Son organisation est décentralisée »."},{"id":"2022-1-57","s":"2022-1","n":57,"d":"CAJ","q":"Le contrôleur général des lieux de privation de liberté est :","o":["une autorité administrative indépendante","rattaché au ministère de la justice","un fonctionnaire du ministère de l'intérieur"],"a":0,"c":"s","e":"Le CGLPL (2007) est une AAI."},{"id":"2022-1-58","s":"2022-1","n":58,"d":"CAJ","q":"Qui est le garant de l'indépendance de l'autorité judiciaire en France :","o":["le ministre de la justice","le Premier ministre","le Président de la République"],"a":2,"c":"s","e":"Art. 64 C : le Président est garant de l'indépendance de l'autorité judiciaire."},{"id":"2022-1-59","s":"2022-1","n":59,"d":"CAJ","q":"Une agence régionale de santé est :","o":["un service déconcentré du ministère de la santé","un service à compétence nationale","un établissement public à caractère administratif placé sous tutelle du ministère de la santé"],"a":2,"c":"s","e":"Les ARS sont des établissements publics administratifs sous tutelle des ministres chargés de la santé et des affaires sociales."},{"id":"2022-1-60","s":"2022-1","n":60,"d":"CAJ","q":"Un établissement public local d'enseignement est :","o":["un service déconcentré du ministère de l'éducation nationale, habilité à recevoir des subventions de la part des collectivités territoriales","une entité de droit public dotée de la personnalité morale sous tutelle d'une collectivité territoriale, habilitée à recevoir des subventions de la part du ministère de l'éducation nationale","une entité de droit public dotée de la personnalité morale et de compétences relevant pour certaines de l'Etat et pour d'autres des collectivités territoriales"],"a":2,"c":"s","e":"L'EPLE est un établissement public doté de la personnalité morale, aux compétences partagées entre l'État (pédagogie, personnels) et la collectivité (bâtiments, fonctionnement)."},{"id":"2022-1-61","s":"2022-1","n":61,"d":"FP","q":"Vous êtes adjoint gestionnaire en EPLE, votre chef d'établissement s'est absenté pour une réunion importante au rectorat et vous devez passer une commande urgente auprès d'un fournisseur. Le bon de commande valant engagement financier de l'établissement peut être signé :","o":["de droit, par le chef d'établissement adjoint","par vous, sur la base d'une délégation de signature formalisée","de droit, par l'agent comptable de l'établissement"],"a":1,"c":"s","e":"Le chef d'établissement (ordonnateur) peut déléguer sa signature à l'adjoint gestionnaire. Rien n'est « de droit » sans délégation formalisée."},{"id":"2022-1-62","s":"2022-1","n":62,"d":"FP","q":"Parmi le champ d'intervention des chambres régionales des comptes, laquelle est une fausse proposition ?","o":["L'intervention en cas de retard dans le vote du budget primitif","L'intervention lorsque le budget n'a pas été voté en équilibre réel","L'intervention lorsque le budget est en excédent"],"a":2,"c":"s","e":"Les CRC interviennent en cas de budget non voté dans les délais, non voté en équilibre réel, de compte administratif en déficit ou de dépense obligatoire non inscrite. Pas en cas d'excédent."},{"id":"2022-1-63","s":"2022-1","n":63,"d":"FP","q":"Quelle autorité au sein de la Cour des comptes intervient pour adresser un référé aux administrations étatiques ?","o":["Le Premier président","Le président de chambre","Le procureur général"],"a":0,"c":"s","e":"Les référés de la Cour des comptes sont signés par le Premier président."},{"id":"2022-1-64","s":"2022-1","n":64,"d":"FP","q":"La charge de la dette de l'Etat est :","o":["un crédit global","un crédit évaluatif","un crédit limitatif"],"a":1,"c":"s","e":"Les crédits de la charge de la dette sont évaluatifs : ils peuvent être dépassés."},{"id":"2022-1-65","s":"2022-1","n":65,"d":"FP","q":"L'article 14 de la Déclaration des Droits de l'Homme et du Citoyen pose le principe :","o":["du recouvrement des créances de l'Etat","du consentement à l'impôt","du besoin pour la force publique de disposer de ressources"],"a":1,"c":"s","e":"Art. 14 DDHC : les citoyens peuvent constater la nécessité de la contribution publique et la consentir librement."},{"id":"2022-1-66","s":"2022-1","n":66,"d":"FP","q":"Un régisseur d'avances et de recettes est :","o":["un comptable public","un ordonnateur principal","un ordonnateur secondaire"],"a":0,"c":"p","e":"Le régisseur agit pour le compte du comptable public et manie des fonds publics. Parmi les propositions, c'est le rattachement comptable qui est attendu."},{"id":"2022-1-67","s":"2022-1","n":67,"d":"FP","q":"Le principe d'universalité budgétaire implique :","o":["l'obligation de présenter toutes les dépenses et toutes les recettes dans un seul et même document","la présentation de l'objet des dépenses budgétaires par structure bénéficiaire","la non-affectation des recettes de l'Etat à une dépense spécifique"],"a":0,"c":"s","e":"Universalité : toutes les recettes et dépenses dans un document unique (C = règle de non-affectation, qui en découle)."},{"id":"2022-1-68","s":"2022-1","n":68,"d":"FP","q":"Les dépenses relatives aux minimas sociaux sont partagées entre plusieurs acteurs :","o":["les départements et l'Etat","les organismes sociaux et les communes","les régions et les organismes sociaux"],"a":0,"c":"s","e":"Les minima sociaux sont partagés entre l'État (AAH, ASS…) et les départements (RSA)."},{"id":"2022-1-69","s":"2022-1","n":69,"d":"FP","q":"En cas d'urgence pour augmenter les crédits ouverts en loi de finances initiale, le Gouvernement peut prendre :","o":["un décret pour aléas de gestion","un décret d'avance","un décret de dépenses accidentelles"],"a":1,"c":"s","e":"Le décret d'avance ouvre des crédits supplémentaires en urgence, dans les limites fixées par la LOLF."},{"id":"2022-1-70","s":"2022-1","n":70,"d":"FP","q":"La règle du service fait interdit :","o":["de rémunérer les agents du service public sans vérifier l'exécution effective des tâches qui leur sont dévolues","de procéder à un paiement avant réalisation de la prestation commandée","de recruter des comptables n'ayant pas participé à la journée défense et citoyenneté"],"a":1,"c":"s","e":"Règle du service fait : pas de paiement avant l'exécution de la prestation (pas de paiement d'avance, sauf exceptions)."},{"id":"2022-1-71","s":"2022-1","n":71,"d":"FP","q":"La gestion de la dette, de la trésorerie de l'Etat ainsi que les activités post-marché est assumée par :","o":["l'agence France Trésor","le Trésor Public","la direction du budget"],"a":0,"c":"s","e":"L'Agence France Trésor gère la dette et la trésorerie de l'État."},{"id":"2022-1-72","s":"2022-1","n":72,"d":"FP","q":"Les perspectives de dépenses et d'emplois de l'année n+1 sont notifiées aux différents ministères par le biais :","o":["d'une lettre-plafond signée par le Premier ministre","de la publication d'un arrêté ministériel","d'une note visée par la direction du budget"],"a":0,"c":"s","e":"Les lettres-plafonds du Premier ministre notifient aux ministres plafonds de crédits et d'emplois."},{"id":"2022-1-73","s":"2022-1","n":73,"d":"FP","q":"Quelles sont les politiques publiques les plus coûteuses du budget de l'Etat ?","o":["La défense et les sécurités","La justice, le conseil et le contrôle de l'Etat","L'éducation et la recherche"],"a":2,"c":"s","e":"L'enseignement scolaire et la recherche-enseignement supérieur sont les missions les plus dotées du budget de l'État."},{"id":"2022-1-74","s":"2022-1","n":74,"d":"FP","q":"Encadré depuis 2006 par la loi organique relative aux lois de finances (LOLF), le budget annuel est également élaboré dans le respect de :","o":["la loi de règlement initiale","la loi de programmation des finances publiques","la loi de programme budgétaire"],"a":1,"c":"s","e":"Le budget annuel s'inscrit dans la trajectoire de la loi de programmation des finances publiques (LPFP)."},{"id":"2022-1-75","s":"2022-1","n":75,"d":"FP","q":"Les rapports annuels de performance (RAP) sont annexés :","o":["au collectif budgétaire","à la loi de règlement","à la loi de finances initiale"],"a":1,"c":"s","e":"Les RAP sont annexés au projet de loi de règlement (aujourd'hui loi relative aux résultats de la gestion)."},{"id":"2022-1-76","s":"2022-1","n":76,"d":"FP","q":"Quelle est l'autorité interlocutrice du contrôleur budgétaire et comptable ministériel ?","o":["Le responsable de budget opérationnel de programme","Le responsable d'unité opérationnelle","Le contrôleur de gestion"],"a":0,"c":"p","e":"Le contrôleur budgétaire dialogue avec les responsables de programme et de BOP, notamment sur la soutenabilité de la programmation."},{"id":"2022-1-77","s":"2022-1","n":77,"d":"FP","q":"La taxe sur la valeur ajoutée est, au sens de la loi organique relative aux lois de finances :","o":["un prélèvement obligatoire","une recette non fiscale","une recette fiscale"],"a":2,"c":"s","e":"La TVA est une recette fiscale au sens de la LOLF."},{"id":"2022-1-78","s":"2022-1","n":78,"d":"FP","q":"Vous êtes responsable du service « budget et administration » d'une école de formation du service public. Votre chef d'établissement, ordonnateur secondaire, vous indique que l'achat d'un matériel a été reporté à l'année suivante. Il souhaite que les crédits ainsi libérés soient employés pour le versement de primes annuelles destinées au personnel de l'école :","o":["vous lui indiquez que vous allez solliciter cette fongibilité au responsable du budget opérationnel de programme","vous lui indiquez que vous allez procéder à une modification de votre programmation budgétaire en ce sens","vous lui indiquez que ce n'est pas possible en raison du principe de fongibilité asymétrique"],"a":2,"c":"s","e":"Fongibilité asymétrique : les crédits de fonctionnement ne peuvent abonder le titre 2 (dépenses de personnel, dont les primes)."},{"id":"2022-1-79","s":"2022-1","n":79,"d":"FP","q":"Le déficit public correspond :","o":["au déficit budgétaire","à l'endettement de l'Etat","au déficit des collectivités territoriales, de la sécurité sociale et de l'Etat"],"a":2,"c":"s","e":"Le déficit public couvre toutes les administrations publiques : État, collectivités, sécurité sociale."},{"id":"2022-1-80","s":"2022-1","n":80,"d":"FP","q":"La responsabilité disciplinaire de l'ordonnateur public relève de la Cour de discipline budgétaire et financière, excepté pour :","o":["les ordonnateurs principaux","les ordonnateurs secondaires","les ordonnateurs exerçant les fonctions de membre du Gouvernement"],"a":2,"c":"s","e":"Avant 2023, les membres du Gouvernement n'étaient pas justiciables de la CDBF."},{"id":"2022-1-81","s":"2022-1","n":81,"d":"UE","q":"L'organe juridictionnel actuel de l'Union européenne, la Cour de justice de l'Union européenne, a historiquement été constitué :","o":["en 1952 avec le Traité instituant la Communauté européenne du charbon et de l'acier","en 1992 avec le Traité sur l'Union européenne","en 2009 avec le Traité sur le fonctionnement de l'Union européenne"],"a":0,"c":"s","e":"L'ancêtre de la CJUE est la Cour de justice de la CECA, créée en 1952."},{"id":"2022-1-82","s":"2022-1","n":82,"d":"UE","q":"La Convention européenne de sauvegarde des droits de l'homme et des libertés fondamentales a été ratifiée par :","o":["47 Etats dont les 27 membres de l'Union européenne","27 Etats dont 22 sont membres de l'Union européenne","37 Etats dont 19 sont membres de l'Union européenne"],"a":0,"c":"s","e":"À la date du sujet : 47 États, dont les 27 de l'UE. La Russie a été exclue en mars 2022 : 46 aujourd'hui."},{"id":"2022-1-83","s":"2022-1","n":83,"d":"UE","q":"Parmi les principes fondamentaux qui sont à la base de l'Union et qui sont énoncés par le traité d'Amsterdam, on retrouve :","o":["la liberté religieuse","la liberté de la presse","la démocratie"],"a":2,"c":"s","e":"Le traité d'Amsterdam (art. 6 TUE) énonce les principes de liberté, de démocratie, de respect des droits de l'homme et de l'État de droit."},{"id":"2022-1-84","s":"2022-1","n":84,"d":"UE","q":"La Cour de justice de l'Union européenne statue à titre préjudiciel :","o":["lorsque la Commission européenne la saisit parce qu'un État membre a manqué aux obligations qui lui incombent en vertu des traités","lorsqu'un juge national la saisit pour lui poser une question relative à l'interprétation ou la validité du droit de l'Union européenne","lorsqu'un Etat membre la saisit pour juger de la légalité d'un acte de la Commission européenne destiné à produire des effets juridiques à l'égard des tiers"],"a":1,"c":"s","e":"Question préjudicielle (art. 267 TFUE) : un juge national interroge la CJUE sur l'interprétation ou la validité du droit de l'UE."},{"id":"2022-1-85","s":"2022-1","n":85,"d":"UE","q":"L'article 7 du Traité sur l'Union européenne donne la possibilité à l'Union européenne de sanctionner un Etat membre qui ne respecterait pas ses valeurs fondatrices. Lequel des pays suivants a déjà été visé par cette procédure ?","o":["Le Royaume-Uni","La Pologne","Le Danemark"],"a":1,"c":"s","e":"La Pologne (2017) et la Hongrie (2018) ont été visées par l'article 7 TUE."},{"id":"2022-1-86","s":"2022-1","n":86,"d":"UE","q":"Le président de la Commission européenne est élu par :","o":["le Parlement européen sur proposition du Conseil de l'Union européenne","le Conseil de l'Union européenne sur proposition du Conseil européen","le Parlement européen sur proposition du Conseil européen"],"a":2,"c":"s","e":"Art. 17 TUE : le Conseil européen propose un candidat, que le Parlement européen élit."},{"id":"2022-1-87","s":"2022-1","n":87,"d":"UE","q":"En 2021, la France a été :","o":["le premier contributeur au budget de l'Union européenne devant l'Allemagne","le deuxième contributeur au budget de l'Union européenne derrière l'Allemagne","le troisième contributeur au budget de l'Union européenne derrière l'Allemagne et l'Italie"],"a":1,"c":"s","e":"En 2021, la France était le 2e contributeur au budget de l'UE, derrière l'Allemagne."},{"id":"2022-1-88","s":"2022-1","n":88,"d":"UE","q":"La France a assuré la présidence du Conseil de l'Union européenne pour la première fois en :","o":["1974","1968","1959"],"a":2,"c":"s","e":"La France a assuré la première présidence du Conseil au premier semestre 1959."},{"id":"2022-1-89","s":"2022-1","n":89,"d":"UE","q":"Les Etats européens définissent le cadre financier pluriannuel de l'Union européenne au moins :","o":["tous les ans","tous les 5 ans","tous les 7 ans"],"a":1,"c":"p","e":"Art. 312 TFUE : le CFP est établi pour une période d'au moins cinq ans. En pratique, il couvre 7 ans (2021-2027)."},{"id":"2022-1-90","s":"2022-1","n":90,"d":"UE","q":"Quelle est la mission de la Banque européenne d'investissement ?","o":["Contribuer, en faisant appel aux marchés des capitaux, au financement des déficits publics des Etats membres de la zone euro","Contribuer, en faisant appel aux marchés des capitaux et à ses ressources propres, au développement équilibré du marché intérieur dans l'intérêt de l'Union européenne","Se substituer aux Etats membres de l'Union européenne en matière de soutien aux investissements des PME d'ici 2027"],"a":1,"c":"s","e":"La BEI emprunte sur les marchés pour financer des projets contribuant au développement équilibré de l'UE."},{"id":"2022-1-91","s":"2022-1","n":91,"d":"UE","q":"Quel est le dernier pays à avoir intégré l'Union européenne en 2013 ?","o":["Le Kosovo","L'Islande","La Croatie"],"a":2,"c":"s","e":"La Croatie a adhéré le 1er juillet 2013."},{"id":"2022-1-92","s":"2022-1","n":92,"d":"UE","q":"L'accord de commerce et de coopération entre le Royaume-Uni et l'Union européenne, signé le 24 décembre 2020, comprend des dispositions permettant :","o":["le libre accès des pêcheurs européens aux eaux britanniques","la libre circulation des personnes entre le Royaume-Uni et la France","des échanges de biens et services sans droits de douane ni quotas"],"a":2,"c":"s","e":"L'accord de commerce et de coopération prévoit des échanges de biens sans droits de douane ni quotas."},{"id":"2022-1-93","s":"2022-1","n":93,"d":"UE","q":"Parmi ces pays, lequel n'est pas candidat pour intégrer l'Union européenne ?","o":["L'Islande","La Turquie","Le Monténégro"],"a":0,"c":"s","e":"L'Islande a retiré sa candidature en 2015. La Turquie et le Monténégro sont candidats."},{"id":"2022-1-94","s":"2022-1","n":94,"d":"UE","q":"Dans quel Traité ont été posés les bases et les principes de la politique européenne de l'environnement :","o":["le Traité de Rome","l'Acte unique européen","le Traité de Nice"],"a":1,"c":"s","e":"L'Acte unique européen (1986) donne une base juridique à la politique environnementale."},{"id":"2022-1-95","s":"2022-1","n":95,"d":"UE","q":"Depuis quand un Etat a-t-il la possibilité de se retirer de l'Union ?","o":["Depuis le traité de Lisbonne","Depuis le traité de Maastricht","Depuis le traité de Rome"],"a":0,"c":"s","e":"La clause de retrait (art. 50 TUE) a été introduite par le traité de Lisbonne."},{"id":"2022-1-96","s":"2022-1","n":96,"d":"UE","q":"Pour accéder à la monnaie unique, les Etats doivent respecter les critères de convergence définis lors du Traité de Maastricht. Parmi eux :","o":["le plafond de 3% du PIB pour le déficit public annuel","le plafond de 3% du PIB pour la dette publique","le plafond de 2% d'inflation"],"a":0,"c":"s","e":"Critère de Maastricht : déficit public ≤ 3 % du PIB. La dette est plafonnée à 60 %, l'inflation est appréciée par rapport aux trois meilleurs."},{"id":"2022-1-97","s":"2022-1","n":97,"d":"UE","q":"Parmi ces Etats membres de l
