<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM IRA/ISP — entraînement quotidien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F9; --sheet:#FFFFFF; --ink:#16243F; --ink-soft:#4A5872; --rule:#D5DBE6;
  --encre:#1F3FA8; --encre-wash:#E6ECFB; --ok:#1E7A52; --ok-wash:#E3F3EB; --ko:#B3261E; --ko-wash:#FBE7E5;
  --warn:#8A5A00; --warn-wash:#FFF3D6; --abs:#6B7486;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F1522; --sheet:#172033; --ink:#E6EBF5; --ink-soft:#A3AEC4; --rule:#2B3750;
  --encre:#8FA8FF; --encre-wash:#1E2A4D; --ok:#5BD29A; --ok-wash:#123526; --ko:#FF8A80; --ko-wash:#3A1715;
  --warn:#FFCB6B; --warn-wash:#3A2C0C; --abs:#8E97AA;}}
:root[data-theme="dark"]{
  --paper:#0F1522; --sheet:#172033; --ink:#E6EBF5; --ink-soft:#A3AEC4; --rule:#2B3750;
  --encre:#8FA8FF; --encre-wash:#1E2A4D; --ok:#5BD29A; --ok-wash:#123526; --ko:#FF8A80; --ko-wash:#3A1715;
  --warn:#FFCB6B; --warn-wash:#3A2C0C; --abs:#8E97AA;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px;border-bottom:2px solid var(--ink)}
header.top h1{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.streak{font-size:.9rem;color:var(--ink-soft);text-align:right}
.streak b{color:var(--ink);font-size:1.1rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:190px;background:none;border:0;padding:12px 6px;font-weight:600;font-size:.92rem;color:var(--ink-soft);border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--encre);border-top-color:var(--encre)}
section[hidden]{display:none}
h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.25;margin:22px 0 8px}
p.lead{color:var(--ink-soft);margin:0 0 16px;max-width:62ch}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);padding:11px 18px;border-radius:4px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--encre);color:#fff}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
label.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--encre)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-soft)}
select,input[type=search]{font:inherit;font-size:.95rem;padding:8px 10px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);min-width:0}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.plan div{border-left:3px solid var(--encre);padding:2px 0 2px 10px}
.plan b{display:block;font-size:1.5rem;font-family:var(--serif)}
.plan span{font-size:.85rem;color:var(--ink-soft)}
/* question sheet */
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--ink-soft);margin:14px 0 8px;gap:8px;flex-wrap:wrap}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--encre);transition:width .25s}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:3px;background:var(--encre-wash);color:var(--encre);font-weight:600}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.qtext{font-family:var(--serif);font-size:1.18rem;line-height:1.6;margin:6px 0 18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:12px;width:100%}
.choice:hover:not(:disabled){border-color:var(--encre)}
.box{width:34px;height:34px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:1rem;border-radius:2px;position:relative;background:var(--sheet)}
.choice .txt{padding-top:5px}
.choice.picked .box{background:var(--encre);border-color:var(--encre);color:#fff}
.choice.good{border-color:var(--ok);background:var(--ok-wash)}
.choice.good .box{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.bad{border-color:var(--ko);background:var(--ko-wash)}
.choice.bad .box{background:var(--ko);border-color:var(--ko);color:#fff}
.choice:disabled{cursor:default}
.skip{margin-top:12px;background:none;border:1.5px dashed var(--abs);color:var(--ink-soft);border-radius:6px;padding:10px;width:100%;font-weight:500}
.feedback{margin-top:16px;border-radius:6px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--sheet);border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.feedback.bad{border-left-color:var(--ko)}
.feedback.abs{border-left-color:var(--abs)}
.feedback h3{margin:0 0 6px;font-size:1rem}
.feedback p{margin:0;font-family:var(--serif);line-height:1.65}
.feedback .note{margin-top:10px;font-family:var(--sans);font-size:.85rem;color:var(--warn)}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.score{font-family:var(--serif);font-size:3.2rem;line-height:1;margin:8px 0}
.stats{width:100%;border-collapse:collapse;font-size:.95rem}
.stats td,.stats th{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:left}
.stats th{font-weight:600;color:var(--ink-soft);font-size:.85rem}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--encre)}
/* bank */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
table.bank{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}
table.bank th{position:sticky;top:0;background:var(--sheet);text-align:left;padding:10px 8px;border-bottom:2px solid var(--ink);font-size:.82rem;white-space:nowrap}
table.bank td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.bank td.q{font-family:var(--serif);min-width:260px}
table.bank .opt{display:block;margin-top:4px;color:var(--ink-soft)}
table.bank .opt.ans{color:var(--ok);font-weight:600}
table.bank td.e{min-width:240px;color:var(--ink-soft)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.9rem}
.empty{padding:24px;text-align:center;color:var(--ink-soft)}
.review-item{border-bottom:1px solid var(--rule);padding:12px 0}
.review-item:last-child{border-bottom:0}
.review-item .q{font-family:var(--serif)}
.small{font-size:.85rem;color:var(--ink-soft)}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
@media (max-width:520px){ .qtext{font-size:1.08rem} .plan b{font-size:1.25rem} h2{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="data" type="application/json">[{"id":"2021-1-1","s":"2021-1","n":1,"d":"CAJ","q":"Culture numérique : ...................................................................................... 20 questions (n° 101 à 120) Pour chaque question, une seule réponse est possible. La réponse est apportée sur la grille en cochant la case (A., B. ou C.) correspondant au choix du candidat. Barème : Bonne réponse : ………. +1 point Mauvaise réponse : …… -1 point","o":["bstention : …………….. 0 point N.B: les questions n°7, n°12, n°32 et n°90 ont été annulées par décision des présidents de jury. TRÈS IMPORTANT Ɣ\u0003 Aucun document n'est autorisé durant cette épreuve. Ɣ\u0003 Avant de commencer cette épreuve, il vous est recommandé de vérifier le sujet et, le cas échéant, de signaler immédiatement aux surveillants toute anomalie (page manquante, document illisible, etc.). Ɣ\u0003 Les réponses aux questions doivent être complétées sur la grille dédiée, qui seule sera corrigée. Il est interdit aux candidats de signer la grille ou d'y mettre un signe quelconque pouvant en indiquer la provenance. Ɣ\u0003 Le présent sujet doit impérativement être remis, conjointement avec la grille, avant de quitter la salle. 1. La question prioritaire de constitutionnalité : A. peut être posée par tout citoyen ayant eu connaissance d'une disposition réglementaire portant atteinte aux droits et libertés que la Constitution garantit","peut être posée en l'absence de tout litige","s'applique à une loi déjà entrée en vigueur"],"a":2,"c":"s","e":"La QPC (art. 61-1 C) vise une disposition législative déjà en vigueur, contestée à l'occasion d'un litige en cours. Elle ne porte pas sur un règlement et suppose une instance."},{"id":"2021-1-2","s":"2021-1","n":2,"d":"CAJ","q":"Le discours du Président de la République devant le Parlement réuni en Congrès est suivi :","o":["d'un débat avec vote","d'un débat sans vote, sans sa présence","d'un débat sans vote, en sa présence"],"a":1,"c":"s","e":"Art. 18 C (révision 2008) : la déclaration du Président peut donner lieu, hors sa présence, à un débat qui ne fait l'objet d'aucun vote."},{"id":"2021-1-3","s":"2021-1","n":3,"d":"CAJ","q":"Dans la hiérarchie des normes, les principes généraux du droit auxquels se réfère le juge administratif se situent :","o":["au-dessus du bloc législatif et au-dessous du bloc conventionnel","au-dessus du bloc réglementaire et au-dessous du bloc législatif","au-dessous du bloc réglementaire"],"a":1,"c":"s","e":"Les PGD ont une valeur infra-législative et supra-décrétale (Chapus) : ils s'imposent au pouvoir réglementaire mais la loi peut y déroger."},{"id":"2021-1-4","s":"2021-1","n":4,"d":"CAJ","q":"Hors cas d'urgence, le Conseil constitutionnel doit statuer sur la constitutionnalité d'une loi avant sa promulgation dans un délai de :","o":["deux mois","quinze jours","un mois"],"a":2,"c":"s","e":"Art. 61 C : le Conseil constitutionnel statue dans le délai d'un mois, ramené à 8 jours en cas d'urgence à la demande du Gouvernement."},{"id":"2021-1-5","s":"2021-1","n":5,"d":"CAJ","q":"Les députés sont élus au :","o":["suffrage universel direct, scrutin majoritaire à deux tours","suffrage universel indirect, scrutin majoritaire à deux tours","suffrage universel direct, scrutin proportionnel à deux tours"],"a":0,"c":"s","e":"Députés : suffrage universel direct, scrutin uninominal majoritaire à deux tours par circonscription."},{"id":"2021-1-6","s":"2021-1","n":6,"d":"CAJ","q":"Les membres du Conseil constitutionnel sont nommés pour :","o":["un mandat de six ans","un mandat de neuf ans","à vie"],"a":1,"c":"s","e":"Mandat de 9 ans non renouvelable ; renouvellement par tiers tous les 3 ans (art. 56 C)."},{"id":"2021-1-8","s":"2021-1","n":8,"d":"CAJ","q":"Le référendum d'initiative partagée permet à une proposition de loi :","o":["présentée par au moins un cinquième des membres de l'Assemblée nationale, d'être inscrite à l'ordre du jour de l'Assemblée si elle est soutenue par 10 % des électeurs","présentée par au moins la moitié des membres du Parlement, d'être inscrite à l'ordre du jour des assemblées si elle est soutenue par au moins trois millions d'électeurs","présentée par au moins un cinquième des membres du Parlement, d'être inscrite à l'ordre du jour des assemblées si elle est soutenue par 10 % des électeurs"],"a":2,"c":"s","e":"Art. 11 C (RIP, 2008) : initiative d'1/5 des membres du Parlement, soutenue par 1/10 des électeurs inscrits."},{"id":"2021-1-9","s":"2021-1","n":9,"d":"CAJ","q":"La Cour de justice de la République est compétente pour juger de la responsabilité pénale à raison des actes accomplis dans l'exercice des fonctions, qualifiés de crimes ou délits au moment où ils ont été commis :","o":["du Président de la République","des membres du Gouvernement","des membres du Gouvernement et des parlementaires"],"a":1,"c":"s","e":"Art. 68-1 C : la CJR juge les membres du Gouvernement pour les crimes et délits commis dans l'exercice de leurs fonctions."},{"id":"2021-1-10","s":"2021-1","n":10,"d":"CAJ","q":"Selon l'article 8 de la Constitution, les membres du Gouvernement sont nommés par :","o":["le Président de la République sur proposition du Premier ministre","le Premier ministre sur proposition du Président de la République","le secrétaire général du Gouvernement"],"a":0,"c":"s","e":"Art. 8 al. 2 C : le Président nomme les autres membres du Gouvernement sur proposition du Premier ministre."},{"id":"2021-1-11","s":"2021-1","n":11,"d":"CAJ","q":"Un député représente :","o":["sa circonscription d'élection","la Nation","le département où il a été élu"],"a":1,"c":"s","e":"Mandat national : chaque député représente la Nation tout entière, pas sa seule circonscription (mandat impératif interdit, art. 27 C)."},{"id":"2021-1-13","s":"2021-1","n":13,"d":"CAJ","q":"Selon l'article 72 de la Constitution, dans les collectivités territoriales de la République, le représentant de l'Etat représente :","o":["le Premier ministre","le ministre de l'intérieur","chacun des membres du Gouvernement"],"a":2,"c":"s","e":"Art. 72 al. 6 C : le représentant de l'État est le représentant de chacun des membres du Gouvernement."},{"id":"2021-1-14","s":"2021-1","n":14,"d":"CAJ","q":"Selon l'article 72-3 de la Constitution :","o":["la République française reconnaît les peuples d'outre-mer, dans un idéal commun de liberté, d'égalité et de fraternité","la République reconnaît, au sein du peuple français, les populations d'outre-mer, dans un idéal commun de liberté, d'égalité et de fraternité","la République française reconnaît le peuple corse, dans un idéal commun de liberté, d'égalité et de fraternité"],"a":1,"c":"s","e":"Art. 72-3 C : « La République reconnaît, au sein du peuple français, les populations d'outre-mer ». Le Conseil constitutionnel refuse la notion de « peuple corse »."},{"id":"2021-1-15","s":"2021-1","n":15,"d":"CAJ","q":"L'article 16 de la Constitution relatif aux pouvoirs exceptionnels pouvant être confiés au Président de la République a été activé :","o":["jamais","une fois, en 1961","deux fois, en 1961 et 1968"],"a":1,"c":"s","e":"L'article 16 n'a été utilisé qu'une fois, d'avril à septembre 1961, lors du putsch des généraux à Alger."},{"id":"2021-1-16","s":"2021-1","n":16,"d":"CAJ","q":"Le Tribunal des conflits :","o":["tranche les conflits de compétence entre les juridictions de l'ordre judiciaire et les juridictions de l'ordre administratif","renvoie systématiquement l'affaire qui lui est soumise à un juge judiciaire ou administratif","n'est amené à rejuger une affaire que s'il a été saisi par le préfet"],"a":0,"c":"s","e":"Le Tribunal des conflits tranche les conflits de compétence entre ordre judiciaire et ordre administratif."},{"id":"2021-1-17","s":"2021-1","n":17,"d":"CAJ","q":"Les trois conditions permettant d'engager la responsabilité de l'administration sont :","o":["un préjudice, une faute, un lien de causalité","un préjudice, un fait générateur, un lien de causalité","un préjudice matériel réparable, un fait générateur, un lien de causalité"],"a":1,"c":"s","e":"Il faut un préjudice, un fait générateur (faute ou non, la responsabilité sans faute existe) et un lien de causalité. « Faute » (A) est trop restrictif."},{"id":"2021-1-18","s":"2021-1","n":18,"d":"CAJ","q":"Les missions du Conseil d'Etat sont :","o":["conseiller le Gouvernement et le Parlement, juger les litiges relatifs aux actes de l'administration, gérer la juridiction administrative","conseiller le Gouvernement, juger tous les litiges relatifs aux actes de l'Etat, gérer la juridiction administrative","conseiller le Gouvernement, trancher certains litiges relatifs aux actes de l'administration, gérer la juridiction administrative"],"a":0,"c":"p","e":"Le Conseil d'État conseille le Gouvernement et, depuis 2008, le Parlement (propositions de loi), juge en dernier ressort les litiges administratifs et gère la juridiction administrative."},{"id":"2021-1-19","s":"2021-1","n":19,"d":"CAJ","q":"Le principe qui fonde la théorie de l'imprévision est :","o":["le principe de continuité","le principe de neutralité","le principe d'égalité"],"a":0,"c":"s","e":"La théorie de l'imprévision (CE 1916 Gaz de Bordeaux) vise à assurer la continuité du service public malgré un bouleversement économique du contrat."},{"id":"2021-1-20","s":"2021-1","n":20,"d":"CAJ","q":"Un recours pour excès de pouvoir vise à obtenir :","o":["la sanction du fonctionnaire à l'origine de l'acte administratif objet du recours","la suspension d'un acte administratif","l'annulation d'un acte administratif"],"a":2,"c":"s","e":"Le REP vise l'annulation d'un acte administratif illégal. La suspension relève du référé."},{"id":"2021-1-21","s":"2021-1","n":21,"d":"CAJ","q":"La procédure du référé liberté vise :","o":["une liberté fondamentale à laquelle un citoyen aurait porté atteinte de manière grave et manifestement illégale","une atteinte grave et manifestement illégale à la liberté d'administration des collectivités territoriales","une liberté fondamentale à laquelle une administration aurait porté atteinte de manière grave et manifestement illégale"],"a":2,"c":"s","e":"Art. L. 521-2 CJA : atteinte grave et manifestement illégale à une liberté fondamentale par une personne publique (ou un organisme chargé d'un service public). Le juge statue en 48 h."},{"id":"2021-1-22","s":"2021-1","n":22,"d":"CAJ","q":"La norme communautaire d'application directe dans le droit interne français est :","o":["le règlement européen","la directive européenne","la jurisprudence du Conseil de l'Europe"],"a":0,"c":"s","e":"Art. 288 TFUE : le règlement est obligatoire dans tous ses éléments et directement applicable. La directive doit être transposée."},{"id":"2021-1-23","s":"2021-1","n":23,"d":"CAJ","q":"L'un de ces principes n'organise pas le régime juridique du service public « à la française » :","o":["la mutabilité","la concurrence","la continuité"],"a":1,"c":"s","e":"Les « lois de Rolland » : continuité, égalité (dont neutralité), mutabilité (adaptabilité). La concurrence n'en fait pas partie."},{"id":"2021-1-24","s":"2021-1","n":24,"d":"CAJ","q":"Un lanceur d'alerte protégé par la loi française est :","o":["une personne physique qui révèle ou signale une menace ou un préjudice graves pour l'intérêt général","une personne physique ou morale qui révèle ou signale une menace ou un préjudice graves pour l'intérêt général","exclusivement un agent public qui révèle ou signale, dans l'exercice de ses fonctions, une menace ou un préjudice graves pour l'intérêt général"],"a":0,"c":"s","e":"Loi Sapin II (2016, modifiée en 2022) : le lanceur d'alerte est une personne physique. Les personnes morales (associations…) peuvent être « facilitateurs »."},{"id":"2021-1-25","s":"2021-1","n":25,"d":"CAJ","q":"Lequel de ces principes ne fait pas partie des principes fondamentaux du service public ?","o":["la continuité du service public","l'égalité devant le service public","la gratuité du service public"],"a":2,"c":"s","e":"La gratuité n'est pas un principe du service public : de nombreux services sont payants (redevances)."},{"id":"2021-1-26","s":"2021-1","n":26,"d":"CAJ","q":"Un service à compétence nationale est :","o":["un service d'administration centrale dont la mission est de concevoir une politique publique","un service déconcentré de l'Etat réparti sur l'ensemble du territoire national","un service à vocation opérationnelle dont la compétence s'étend sur l'ensemble du territoire français"],"a":2,"c":"s","e":"Décret de 1997 : un SCN exerce des missions à caractère opérationnel et à compétence nationale (ex. AFA, archives nationales)."},{"id":"2021-1-27","s":"2021-1","n":27,"d":"CAJ","q":"L'organisation des administrations centrales relève :","o":["du pouvoir constituant","du pouvoir réglementaire","du pouvoir législatif"],"a":1,"c":"s","e":"L'organisation des administrations centrales relève du pouvoir réglementaire (décrets d'organisation)."},{"id":"2021-1-28","s":"2021-1","n":28,"d":"CAJ","q":"L'avis du CESE doit être obligatoirement recueilli :","o":["sur tous les projets de plan et les projets de loi de programmation à caractère économique, social ou environnemental","sur tout projet ou proposition de loi","sur les projets de loi de programmation définissant les orientations pluriannuelles des finances publiques"],"a":0,"c":"s","e":"Art. 70 C : tout plan ou projet de loi de programmation à caractère économique, social ou environnemental est soumis pour avis au CESE."},{"id":"2021-1-29","s":"2021-1","n":29,"d":"CAJ","q":"Les personnels techniques des lycées sont recrutés et gérés par :","o":["le ministère de l'éducation nationale","les régions","les rectorats d'académie"],"a":1,"c":"s","e":"Depuis la loi du 13 août 2004, les régions recrutent et gèrent les personnels techniques (ATTEE) des lycées ; les départements pour les collèges."},{"id":"2021-1-30","s":"2021-1","n":30,"d":"CAJ","q":"Dans un ministère, le secrétaire général assure une mission :","o":["de responsable hiérarchique de tous les directeurs et directeurs généraux du ministère","de représentation du ministre et d'organisation de son Cabinet","de coordination des services et de modernisation du ministère"],"a":2,"c":"s","e":"Le secrétaire général d'un ministère coordonne les services et pilote la modernisation (décret de 2014). Il n'est pas le supérieur hiérarchique des directeurs."},{"id":"2021-1-31","s":"2021-1","n":31,"d":"CAJ","q":"La collectivité chef de file en matière d'aide sociale, d'autonomie des personnes et de solidarité des territoires est :","o":["la région","le département","la métropole en tant qu'établissement public de coopération intercommunale"],"a":1,"c":"s","e":"Loi MAPTAM (2014) : le département est chef de file pour l'action sociale, l'autonomie des personnes et la solidarité des territoires."},{"id":"2021-1-33","s":"2021-1","n":33,"d":"CAJ","q":"Quel est le statut de la Nouvelle-Calédonie ?","o":["une collectivité sui generis","un territoire d'outre-mer","un pays d'outre-mer"],"a":0,"c":"s","e":"La Nouvelle-Calédonie est une collectivité sui generis régie par le titre XIII de la Constitution (accord de Nouméa)."},{"id":"2021-1-34","s":"2021-1","n":34,"d":"CAJ","q":"Le préfet est le représentant direct dans le département :","o":["du Président de la République","du Premier ministre et des ministres","uniquement du ministre de l'intérieur"],"a":1,"c":"s","e":"Décret de 2004 : le préfet est le représentant direct du Premier ministre et de chaque ministre dans le département."},{"id":"2021-1-35","s":"2021-1","n":35,"d":"CAJ","q":"Les services déconcentrés de l'éducation nationale, au niveau de l'académie, sont placés sous l'autorité :","o":["du directeur académique des services de l'éducation nationale","du recteur","de l'inspecteur d'académie"],"a":1,"c":"s","e":"L'académie est placée sous l'autorité du recteur. Le DASEN agit au niveau départemental."},{"id":"2021-1-36","s":"2021-1","n":36,"d":"CAJ","q":"Le Défenseur des droits est :","o":["un délégué interministériel, placé sous la responsabilité hiérarchique du Premier ministre","un service placé sous l'autorité du Garde des sceaux, ministre de la justice","une autorité administrative indépendante"],"a":2,"c":"s","e":"Le Défenseur des droits est une autorité administrative indépendante de rang constitutionnel (art. 71-1 C)."},{"id":"2021-1-37","s":"2021-1","n":37,"d":"CAJ","q":"Un groupement d'intérêt public :","o":["est une structure de coopération entre personnes physiques ou morales dont l'objectif est de faciliter le développement économique d'entreprises par la mutualisation de ressources, matérielles ou humaines","permet à des partenaires publics et privés de mettre en commun des moyens pour la mise en œuvre de missions d'intérêt général","est un organisme de mécénat qui permet la mise à disposition d'un patrimoine au service d'une cause d'intérêt général. Il est créé par décret en Conseil d'Etat"],"a":1,"c":"s","e":"Le GIP associe des partenaires publics (et éventuellement privés) pour exercer ensemble des activités d'intérêt général à but non lucratif."},{"id":"2021-1-38","s":"2021-1","n":38,"d":"CAJ","q":"Est justiciable devant la Cour de discipline budgétaire et financière :","o":["tout fonctionnaire ou agent civil ou militaire de l'Etat, des collectivités territoriales, de leurs établissements publics","tout membre du Gouvernement, ministre ou secrétaire d'Etat","tout comptable public"],"a":0,"c":"p","e":"À la date du sujet, tout fonctionnaire ou agent pouvait être poursuivi devant la CDBF, mais pas les ministres. La CDBF a été supprimée au 1er janvier 2023 (réforme RGP)."},{"id":"2021-1-39","s":"2021-1","n":39,"d":"CAJ","q":"Le bureau central des cultes, chargé des relations avec les autorités représentatives des religions présentes en France est, en application de la loi de 1905, rattaché :","o":["à l'Observatoire de la laïcité","au secrétariat général du Gouvernement","au ministère de l'intérieur"],"a":2,"c":"s","e":"Le bureau central des cultes relève du ministère de l'intérieur."},{"id":"2021-1-40","s":"2021-1","n":40,"d":"CAJ","q":"Le secrétariat général aux affaires européennes a essentiellement pour mission :","o":["de conduire les négociations au sein des instances du Conseil de l'Union européenne","de représenter le ministre chargé des affaires européennes auprès du Conseil de l'Union européenne","d'assurer la coordination interministérielle pour les questions européennes ainsi que pour les activités de l'Organisation de coopération et de développement économiques"],"a":2,"c":"s","e":"Le SGAE, placé auprès du Premier ministre, assure la coordination interministérielle sur les questions européennes et l'OCDE."},{"id":"2021-1-41","s":"2021-1","n":41,"d":"CAJ","q":"La publication des lois et décrets au Journal officiel est assurée par :","o":["l'Imprimerie nationale","le secrétariat général du Gouvernement","le service de communication du cabinet du Premier ministre"],"a":1,"c":"s","e":"Le SGG veille à la publication des textes au Journal officiel, réalisée par la DILA qui lui est rattachée."},{"id":"2021-1-42","s":"2021-1","n":42,"d":"CAJ","q":"Le démembrement d'une administration publique consiste à :","o":["supprimer un service public","confier tout ou partie de son activité à une institution de droit privé afin de bénéficier d'un régime juridique plus souple","modifier l'organisation d'une administration centrale"],"a":1,"c":"s","e":"Le démembrement consiste à confier une activité à des organismes distincts, souvent de droit privé (associations…), pour plus de souplesse de gestion."},{"id":"2021-1-43","s":"2021-1","n":43,"d":"CAJ","q":"Les agences régionales de santé :","o":["sont des services déconcentrés de l'Etat","sont des groupements d'intérêt public créés par l'Etat et la Sécurité sociale","sont des établissements publics, dotés de l'autonomie morale et financière, placés sous la tutelle des ministères chargés des affaires sociales et de la santé"],"a":2,"c":"s","e":"Les ARS (2010) sont des établissements publics administratifs de l'État, placés sous la tutelle des ministres chargés de la santé et des affaires sociales."},{"id":"2021-1-44","s":"2021-1","n":44,"d":"CAJ","q":"Les directions régionales des finances publiques sont placées sous l'autorité :","o":["du ministre chargé des comptes publics","des préfets de régions","de la Cour des comptes"],"a":0,"c":"s","e":"Les DRFiP relèvent du réseau de la DGFiP et donc du ministre chargé des comptes publics, et non du préfet."},{"id":"2021-1-45","s":"2021-1","n":45,"d":"CAJ","q":"Localement, la gestion opérationnelle de crise est assurée par :","o":["le maire de la commune concernée","le préfet de département","le directeur régional ou départemental du service ministériel concerné"],"a":1,"c":"s","e":"Le préfet de département est directeur des opérations lorsque la crise dépasse la commune ou ses moyens. Il est le pivot de la gestion de crise."},{"id":"2021-1-46","s":"2021-1","n":46,"d":"CAJ","q":"Le comité de l'administration régionale :","o":["réunit, sous la présidence du préfet de région, les préfets de département et des directeurs régionaux des services de l'Etat","réunit, sous la présidence du préfet de région, les services de la préfecture et du conseil régional","est présidé alternativement par le préfet de région et par le président du conseil régional"],"a":0,"c":"s","e":"Le CAR réunit, sous la présidence du préfet de région, les préfets de département et les chefs des services régionaux de l'État."},{"id":"2021-1-47","s":"2021-1","n":47,"d":"CAJ","q":"Qu'institue la loi de transformation de la fonction publique de 2019 en matière de droit et d'inclusion des personnes handicapées ?","o":["Le comité interministériel du handicap","Le fonds pour l'insertion des personnes handicapées dans la fonction publique","Le droit de consulter un référent handicap"],"a":2,"c":"s","e":"La loi du 6 août 2019 crée le droit, pour tout agent, de consulter un référent handicap."},{"id":"2021-1-48","s":"2021-1","n":48,"d":"CAJ","q":"Il est possible de devenir attaché d'administration hors classe de l'Etat par :","o":["l'inscription au tableau d'avancement","un concours","un examen professionnel"],"a":0,"c":"s","e":"L'accès au grade d'attaché hors classe se fait au choix, par inscription au tableau d'avancement."},{"id":"2021-1-49","s":"2021-1","n":49,"d":"CAJ","q":"L'agence France Compétences créée par la loi du 5 septembre 2018 a pour mission principale :","o":["le développement de la formation initiale des étudiants","la régulation et le financement de la formation professionnelle et de l'apprentissage","la représentation de la francophonie dans le monde professionnel étranger"],"a":1,"c":"s","e":"France Compétences (2019) régule et finance la formation professionnelle et l'apprentissage."},{"id":"2021-1-50","s":"2021-1","n":50,"d":"CAJ","q":"Quelle décision administrative ne relève pas d'une mesure disciplinaire ?","o":["La mise à la retraite d'office d'un agent public","La suspension d'un agent public","L'abaissement d'échelon d'un agent public"],"a":1,"c":"s","e":"La suspension est une mesure conservatoire, prise dans l'intérêt du service, et non une sanction."},{"id":"2021-1-51","s":"2021-1","n":51,"d":"CAJ","q":"Depuis 2018, un fonctionnaire placé en disponibilité peut conserver ses droits à l'avancement d'échelon et de grade durant 5 ans dans le cas où :","o":["il exerce une activité professionnelle au cours de la période de disponibilité","il justifie d'une inscription dans un cycle de formation initiale au cours de la période de disponibilité","il est à moins de trois ans de son départ à la retraite"],"a":0,"c":"s","e":"Loi « Avenir professionnel » (2018) : maintien des droits à avancement pendant 5 ans en disponibilité si l'agent exerce une activité professionnelle."},{"id":"2021-1-52","s":"2021-1","n":52,"d":"CAJ","q":"Que signifie l'acronyme RIFSEEP ?","o":["Régime interministériel lié à la fonction, aux sujétions, à l'expertise et à l'expérience professionnelle","Régime indemnitaire tenant compte des fonctions, des sujétions, de l'emploi et de l'expérience professionnelle","Régime indemnitaire tenant compte des fonctions, des sujétions, de l'expertise et de l'engagement professionnel"],"a":2,"c":"s","e":"RIFSEEP : régime indemnitaire tenant compte des fonctions, des sujétions, de l'expertise et de l'engagement professionnel (décret 2014)."},{"id":"2021-1-53","s":"2021-1","n":53,"d":"CAJ","q":"Le gestionnaire d'un collège public est un agent :","o":["de l'académie","du conseil départemental","du conseil régional"],"a":0,"c":"s","e":"Le gestionnaire d'EPLE est un personnel de l'État (académie), même si le collège relève du département."},{"id":"2021-1-54","s":"2021-1","n":54,"d":"CAJ","q":"Un fonctionnaire peut-il mener des activités à but lucratif dans le cadre du statut d'autoentrepreneur ?","o":["Non","Oui, selon des conditions fixées par la loi et le règlement","Oui, sans restriction"],"a":1,"c":"s","e":"Un fonctionnaire peut créer une micro-entreprise dans le cadre du cumul d'activités accessoires, sous conditions (autorisation, déclaration)."},{"id":"2021-1-55","s":"2021-1","n":55,"d":"CAJ","q":"Les emplois de fonctionnaire des administrations publiques françaises sont ouverts :","o":["aux personnes de nationalité française exclusivement","aux personnes de nationalité française et à celles disposant d'un titre de séjour en France, quelle que soit leur nationalité","aux personnes de nationalité française et, sauf exception, aux ressortissants des Etats membres de l'Union européenne"],"a":2,"c":"s","e":"Les ressortissants de l'UE et de l'EEE peuvent accéder aux emplois publics, hors ceux liés à la souveraineté ou à l'exercice de prérogatives de puissance publique."},{"id":"2021-1-56","s":"2021-1","n":56,"d":"CAJ","q":"La loi du 20 avril 2016 relative à la déontologie et aux droits et obligations des fonctionnaires :","o":["ne s'applique pas aux militaires","oblige tout agent public à dénoncer les faits pénalement répréhensibles dont il a connaissance","permet à un agent lanceur d'alerte de dénoncer un conflit d'intérêt"],"a":2,"c":"s","e":"La loi du 20 avril 2016 protège l'agent qui signale de bonne foi un conflit d'intérêts."},{"id":"2021-1-57","s":"2021-1","n":57,"d":"CAJ","q":"Quelle est la durée annuelle de travail effectif des agents civils de l'Etat ?","o":["heures","heures","heures"],"a":1,"c":"s","e":"1 607 heures de travail effectif par an (décret de 2000), journée de solidarité incluse."},{"id":"2021-1-58","s":"2021-1","n":58,"d":"CAJ","q":"Les listes des candidats aux élections professionnelles sont composées :","o":["d'un nombre de femmes et d'hommes correspondant à la part des femmes et des hommes inscrits sur les listes électorales","d'un nombre paritaire de femmes et d'hommes","d'un nombre de femmes au moins égal à 40 % des candidats"],"a":0,"c":"s","e":"Loi du 6 août 2019 : les listes comportent une proportion de femmes et d'hommes correspondant à leur part dans le corps électoral."},{"id":"2021-1-59","s":"2021-1","n":59,"d":"CAJ","q":"Que désigne l'acronyme GVT ou glissement vieillissement technicité ?","o":["Le système de gestion et de vérification des traitements des fonctionnaires","Le garant de la valeur technique du point d'indice de la fonction publique","L'effet sur la masse salariale des avancements à l'ancienneté et des promotions"],"a":2,"c":"s","e":"Le GVT mesure l'effet sur la masse salariale des avancements et promotions (GVT positif)."},{"id":"2021-1-60","s":"2021-1","n":60,"d":"CAJ","q":"Les comités sociaux d'administration, nouvelles instances de dialogue social, sont mis en place dans la fonction publique d'Etat :","o":["dès 2021","en 2022","en 2023"],"a":1,"c":"s","e":"Les CSA fusionnant CT et CHSCT ont été installés à l'issue des élections professionnelles de décembre 2022."},{"id":"2021-1-61","s":"2021-1","n":61,"d":"FP","q":"Qui est l'ordonnateur au sein d'un EPLE ?","o":["L'agent comptable","Le chef d'établissement, proviseur ou principal","Le gestionnaire"],"a":1,"c":"s","e":"Dans l'EPLE, le chef d'établissement est l'ordonnateur ; l'agent comptable est le comptable."},{"id":"2021-1-62","s":"2021-1","n":62,"d":"FP","q":"Que signifie le principe d'universalité en matière de finances publiques ?","o":["La durée de l'exercice budgétaire est fixée à un an","L'ensemble des dépenses et des recettes doit figurer dans un document unique","Il ne doit pas y avoir de compensation entre dépenses et recettes de l'Etat, ni affectation d'une recette à une dépense déterminée"],"a":1,"c":"s","e":"Universalité : toutes les recettes et dépenses figurent dans un document unique. A = annualité ; C = règles de non-contraction et de non-affectation, qui découlent de l'universalité mais ne la définissent pas."},{"id":"2021-1-63","s":"2021-1","n":63,"d":"FP","q":"À quoi correspond la gestion de fait ?","o":["Aux opérations dont les comptables publics sont chargés","À l'ordre donné par l'ordonnateur au comptable de payer une dépense","Au maniement de deniers publics par une personne qui n'a pas la qualité de comptable public"],"a":2,"c":"s","e":"La gestion de fait est le maniement de deniers publics par une personne non habilitée (qui n'a pas la qualité de comptable public)."},{"id":"2021-1-64","s":"2021-1","n":64,"d":"FP","q":"Qui certifie les comptes de l'Etat ?","o":["La Cour des comptes","Le Parlement","Le Président de la République"],"a":0,"c":"s","e":"Art. 47-2 C et art. 58 LOLF : la Cour des comptes certifie la régularité, la sincérité et la fidélité des comptes de l'État."},{"id":"2021-1-65","s":"2021-1","n":65,"d":"FP","q":"S'agissant des finances publiques des Etats membres, le traité de Maastricht de 1992 fixe les critères de convergence suivants :","o":["un déficit public annuel inférieur à 6 % du PIB, une dette publique inférieure à 90 % du PIB","un déficit public annuel inférieur à 3 % du PIB, une dette publique inférieure à 60 % du PIB","un déficit public annuel inférieur à 5 % du PIB, une dette publique inférieure à 40 % du PIB"],"a":1,"c":"s","e":"Maastricht : déficit public annuel ≤ 3 % du PIB et dette publique ≤ 60 % du PIB."},{"id":"2021-1-66","s":"2021-1","n":66,"d":"FP","q":"Le contrôle budgétaire d'une commune relève de la compétence :","o":["du directeur départemental des finances publiques","du comptable public de la commune","du préfet en lien avec la chambre régionale des comptes"],"a":2,"c":"s","e":"Le préfet exerce le contrôle budgétaire des collectivités en lien avec la chambre régionale des comptes (art. L. 1612-1 s. CGCT)."},{"id":"2021-1-67","s":"2021-1","n":67,"d":"FP","q":"La loi organique relative aux lois de finances introduit une nouvelle nomenclature budgétaire qui se décline en :","o":["missions et programmes","missions et projets","programmes et actions"],"a":0,"c":"s","e":"LOLF : crédits votés par mission et répartis en programmes (subdivisés en actions). Le couple structurant est « missions et programmes »."},{"id":"2021-1-68","s":"2021-1","n":68,"d":"FP","q":"Parmi ces propositions, laquelle ne relève pas des « impôts et taxes affectés » :","o":["la contribution sociale généralisée","l'impôt sur le revenu","la contribution solidarité autonomie"],"a":1,"c":"s","e":"L'impôt sur le revenu est une recette du budget général. La CSG (sécurité sociale) et la CSA (CNSA) sont des impôts affectés."},{"id":"2021-1-69","s":"2021-1","n":69,"d":"FP","q":"Lequel de ces principes n'est pas un principe budgétaire de nos finances publiques ?","o":["Le principe de sincérité","Le principe de réciprocité","Le principe d'annualité"],"a":1,"c":"s","e":"La « réciprocité » n'est pas un principe budgétaire. Les principes sont annualité, unité, universalité, spécialité et sincérité."},{"id":"2021-1-70","s":"2021-1","n":70,"d":"FP","q":"Le projet de loi de finances doit être examiné en premier lieu par :","o":["l'Assemblée nationale","le Sénat","peu importe pourvu que la règle de 70 jours d'examen soit respectée"],"a":0,"c":"s","e":"Art. 39 C : les projets de loi de finances sont soumis en premier lieu à l'Assemblée nationale."},{"id":"2021-1-71","s":"2021-1","n":71,"d":"FP","q":"Les impôts directs locaux constituent le socle de l'autonomie financière reconnue aux collectivités territoriales par l'article 72-2 de la Constitution. À ce titre, une collectivité territoriale peut :","o":["créer un impôt pour équilibrer son budget","créer un impôt, déterminer son assiette et le taux d'imposition","déterminer l'assiette et le taux d'imposition dans les limites prévues par la loi"],"a":2,"c":"s","e":"Art. 72-2 C : les collectivités peuvent fixer l'assiette et le taux des impositions dans les limites prévues par la loi. Seule la loi crée l'impôt."},{"id":"2021-1-72","s":"2021-1","n":72,"d":"FP","q":"L'impôt de solidarité sur la fortune :","o":["a été remplacé par l'impôt sur la fortune immobilière","a été totalement supprimé","a été remplacé par l'impôt de financement de l'investissement"],"a":0,"c":"s","e":"L'ISF a été remplacé en 2018 par l'impôt sur la fortune immobilière (IFI)."},{"id":"2021-1-73","s":"2021-1","n":73,"d":"FP","q":"Le premier budget de l'Etat voté et exécuté selon les principes de la LOLF est celui de l'année :","o":["2001","2006","2010"],"a":1,"c":"s","e":"La LOLF (2001) a été pleinement appliquée pour la première fois au budget 2006."},{"id":"2021-1-74","s":"2021-1","n":74,"d":"FP","q":"L'article 40 de la Constitution interdit aux amendements parlementaires :","o":["d'aggraver les charges publiques","d'augmenter les ressources publiques","de diminuer les charges publiques"],"a":0,"c":"s","e":"Art. 40 C : irrecevabilité financière des amendements qui diminuent les ressources ou créent/aggravent une charge publique."},{"id":"2021-1-75","s":"2021-1","n":75,"d":"FP","q":"Dans le cadre de la préparation du projet de loi de finances, les lettres de cadrage sont envoyées par :","o":["le Premier ministre aux différents ministres","le Président de la République au Premier ministre et au ministre des finances","le Premier ministre aux préfets de région"],"a":0,"c":"s","e":"Le Premier ministre adresse aux ministres les lettres de cadrage, puis les lettres-plafonds."},{"id":"2021-1-76","s":"2021-1","n":76,"d":"FP","q":"Qu'est-ce que la fongibilité asymétrique ?","o":["La possibilité de répartition des crédits sur l'ensemble des titres","L'augmentation des crédits par anticipation de l'année suivante","La redistribution des crédits au sein d'un titre, ou d'un titre vers un autre à l'exception du titre 2 (dépenses de personnel)"],"a":2,"c":"s","e":"Fongibilité asymétrique : les crédits sont redéployables entre titres d'un programme, sauf vers le titre 2 (personnel), qui ne peut être abondé."},{"id":"2021-1-77","s":"2021-1","n":77,"d":"FP","q":"Une fois la loi de finances adoptée définitivement par le Parlement, les parlementaires peuvent la déférer devant :","o":["le Conseil d'Etat","le Conseil constitutionnel","la Cour des comptes"],"a":1,"c":"s","e":"La loi de finances peut être déférée au Conseil constitutionnel (60 députés ou 60 sénateurs)."},{"id":"2021-1-78","s":"2021-1","n":78,"d":"FP","q":"Quelle collectivité publique peut présenter un budget en déséquilibre ?","o":["La région","La commune","L'Etat"],"a":2,"c":"s","e":"L'État peut voter un budget en déficit. Les collectivités sont soumises à la règle de l'équilibre réel (art. L. 1612-4 CGCT)."},{"id":"2021-1-79","s":"2021-1","n":79,"d":"FP","q":"Le Premier ministre a dévoilé le plan de relance doté de 100 milliards d'euros dont 40 milliards issus de l'Union européenne. Comment s'appelle ce plan?","o":["Plan de Relance","France Relance","Soutenir la France"],"a":1,"c":"s","e":"Plan « France Relance » (septembre 2020) : 100 Md€, dont 40 Md€ de financements européens."},{"id":"2021-1-80","s":"2021-1","n":80,"d":"FP","q":"Quel est le premier poste de dépense de l'Etat en 2019 ?","o":["L'éducation et la recherche","La charge de la dette","La défense et la sécurité"],"a":0,"c":"s","e":"Éducation et recherche forment le premier poste de dépenses de l'État, devant la défense et la charge de la dette."},{"id":"2021-1-81","s":"2021-1","n":81,"d":"UE","q":"La convention d'application des accords de Schengen est entrée en vigueur en :","o":["1985","1990","1995"],"a":2,"c":"p","e":"La convention d'application a été signée en 1990 et formellement en vigueur en 1993, mais effectivement appliquée le 26 mars 1995. Réponse attendue : 1995."},{"id":"2021-1-82","s":"2021-1","n":82,"d":"UE","q":"L'autorité bancaire européenne à son siège à :","o":["Paris","Francfort","Londres"],"a":0,"c":"s","e":"L'Autorité bancaire européenne a quitté Londres pour Paris en 2019 (Brexit)."},{"id":"2021-1-83","s":"2021-1","n":83,"d":"UE","q":"De quand date la première élection du Parlement européen au suffrage universel ?","o":["1974","1979","1986"],"a":1,"c":"s","e":"Première élection du Parlement européen au suffrage universel direct en juin 1979."},{"id":"2021-1-84","s":"2021-1","n":84,"d":"UE","q":"Parmi les pays suivants ayant déposé leur candidature à l'Union européenne, lequel a suspendu les négociations d'adhésion et s'est retiré du processus ?","o":["La Turquie","L'Islande","La Macédoine du Nord"],"a":1,"c":"s","e":"L'Islande a gelé les négociations en 2013 puis retiré sa candidature en 2015."},{"id":"2021-1-85","s":"2021-1","n":85,"d":"UE","q":"Le Conseil européen :","o":["n'est pas une institution de l'Union européenne","est une institution de l'Union européenne depuis les traités de Rome","est une institution de l'Union européenne depuis le traité de Lisbonne"],"a":2,"c":"s","e":"Le Conseil européen est devenu une institution de l'UE avec le traité de Lisbonne (entré en vigueur en 2009)."},{"id":"2021-1-86","s":"2021-1","n":86,"d":"UE","q":"Le traité de Lisbonne est :","o":["le traité fondateur de l'Union européenne","le traité actuellement en vigueur","le traité qui a précédé le traité de Maastricht"],"a":1,"c":"s","e":"Le traité de Lisbonne (2007), qui modifie le TUE et le TFUE, est le traité actuellement en vigueur."},{"id":"2021-1-87","s":"2021-1","n":87,"d":"UE","q":"Qui n'a pas été président de la Commission européenne ?","o":["Jacques Delors","François-Xavier Ortoli","Simone Veil"],"a":2,"c":"s","e":"Simone Veil a présidé le Parlement européen (1979-1982), pas la Commission. Delors et Ortoli ont présidé la Commission."},{"id":"2021-1-88","s":"2021-1","n":88,"d":"UE","q":"Le président de la Commission européenne :","o":["définit les orientations dans le cadre desquelles la Commission exerce sa mission","définit les orientations de l'Union européenne","préside les sommets de la zone euro"],"a":0,"c":"s","e":"Art. 17 TUE : le président définit les orientations dans le cadre desquelles la Commission exerce sa mission. Les orientations de l'UE relèvent du Conseil européen."},{"id":"2021-1-89","s":"2021-1","n":89,"d":"UE","q":"Combien l'Union européenne compte-t-elle de langues officielles ?","o":["24","3","12"],"a":0,"c":"s","e":"L'UE compte 24 langues officielles."},{"id":"2021-1-91","s":"2021-1","n":91,"d":"UE","q":"Depuis le traité de Lisbonne, quelle politique échappe encore à la Cour de justice de l'Union européenne?","o":["La politique monétaire","La politique étrangère et de sécurité commune","La politique commerciale"],"a":1,"c":"s","e":"La PESC échappe en principe à la compétence de la CJUE (art. 24 TUE), sauf exceptions (mesures restrictives)."},{"id":"2021-1-92","s":"2021-1","n":92,"d":"UE","q":"Les accords commerciaux et de partenariat économique de l'Union européenne conclus par la Commission avec des pays tiers doivent être ratifiés :","o":["par les parlements des Etats membres","par le Parlement européen","par le Parlement européen et les parlements des Etats membres"],"a":1,"c":"p","e":"Les accords commerciaux de compétence exclusive de l'UE sont conclus par le Conseil après approbation du Parlement européen. Seuls les accords mixtes exigent aussi les parlements nationaux."},{"id":"2021-1-93","s":"2021-1","n":93,"d":"UE","q":"Qui sont les membres du Conseil européen ?","o":["Les chefs d'Etat ou de gouvernement, le président du Conseil européen et le président de la Commission européenne","Les chefs d'Etat et le président du Conseil de l'Union européenne","Les chefs d'Etat ou de gouvernement, le président du Conseil de l'Europe et le président de la Commission européenne"],"a":0,"c":"s","e":"Art. 15 TUE : chefs d'État ou de gouvernement, président du Conseil européen et président de la Commission. Le Haut représentant participe sans être membre."},{"id":"2021-1-94","s":"2021-1","n":94,"d":"UE","q":"La Cour de Justice de l'Union européenne siège :","o":["à Bruxelles","à Luxembourg","à Strasbourg"],"a":1,"c":"s","e":"La CJUE siège à Luxembourg."},{"id":"2021-1-95","s":"2021-1","n":95,"d":"UE","q":"Le Haut représentant de l'Union européenne pour les affaires étrangères et la politique de sécurité est :","o":["Josep Borrell Fontelles","Catherine Ashton","Ursula Von der Leyen"],"a":0,"c":"s","e":"Josep Borrell était Haut représentant de 2019 à 2024. Kaja Kallas lui a succédé en décembre 2024."},{"id":"2021-1-96","s":"2021-1","n":96,"d":"UE","q":"La politique agricole commune comprend :","o":["des quotas laitiers","des subventions exclusivement à l'exportation","des subventions directes"],"a":2,"c":"s","e":"La PAC comprend des aides directes aux agriculteurs (1er pilier). Les quotas laitiers ont été supprimés en 2015."},{"id":"2021-1-97","s":"2021-1","n":97,"d":"UE","q":"L'euro est en circulation sous forme fiduciaire depuis :","o":["2002","1999","1995"],"a":0,"c":"s","e":"Les pièces et billets en euros circulent depuis le 1er janvier 2002. L'euro scriptural existe depuis 1999."},{"id":"2021-1-98","s":"2021-1","n":98,"d":"UE","q":"Quel Etat ne fait pas partie de l'espace Schengen ?","o":["La Norvège","L'Irlande","L'Estonie"],"a":1,"c":"s","e":"L'Irlande n'est pas dans l'espace Schengen. La Norvège (non-UE) et l'Estonie en font partie."},{"id":"2021-1-99","s":"2021-1","n":99,"d":"UE","q":"Quel est l'instrument de base de codification des valeurs et droits fondamentaux de l'Union européenne ?","o":["L'article 7 du traité de l'Union européenne","La charte des droits fondamentaux de l'Union européenne","La convention européenne de sauvegarde des droits de l'homme et des libertés fondamentales"],"a":1,"c":"s","e":"La Charte des droits fondamentaux de l'UE (2000) codifie valeurs et droits. Elle est contraignante depuis Lisbonne. La CEDH relève du Conseil de l'Europe."},{"id":"2021-1-100","s":"2021-1","n":100,"d":"UE","q":"L'arrêt CJCE du 15 juillet 1964 Costa c/ Enel consacre :","o":["l'effet direct des normes communautaires","un privilège de juridiction sur les questions de droit communautaire","la primauté du droit communautaire sur le droit interne"],"a":2,"c":"s","e":"CJCE, 15 juillet 1964, Costa c/ Enel : primauté du droit communautaire. L'effet direct résulte de Van Gend en Loos (1963)."},{"id":"2021-1-101","s":"2021-1","n":101,"d":"NUM","q":"Qu'est-ce qu'une donnée ouverte (en anglais « open data ») ?","o":["Une donnée librement accessible et réutilisable","Une définition en ligne modifiable par tout internaute","Un système de partage de données en ligne"],"a":0,"c":"s","e":"L'open data désigne des données librement accessibles et réutilisables."},{"id":"2021-1-102","s":"2021-1","n":102,"d":"NUM","q":"Qu'est-ce que le hameçonnage (en anglais « phishing ») ?","o":["Un procédé informatique permettant d'intercepter des courriels privés sur internet","Une technologie relevant de la cybercriminalité consistant à obtenir frauduleusement des données personnelles auprès d'un internaute","Une technique permettant de pirater des séries ou des films sur internet, en ayant recours aux échanges de pair à pair"],"a":1,"c":"s","e":"Le hameçonnage consiste à usurper l'identité d'un tiers de confiance pour soutirer des données personnelles ou bancaires."},{"id":"2021-1-103","s":"2021-1","n":103,"d":"NUM","q":"Quelle autorité est chargée de lutter contre le piratage informatique ?","o":["ARCEP","HADOPI","Défenseur des droits"],"a":1,"c":"s","e":"À la date du sujet, la HADOPI luttait contre le piratage des œuvres. Elle a fusionné avec le CSA dans l'ARCOM en 2022."},{"id":"2021-1-104","s":"2021-1","n":104,"d":"NUM","q":"Comment appelle-t-on, en anglais, le matériel physique constituant les ordinateurs de bureau et les terminaux :","o":["software","computer engineering","hardware"],"a":2,"c":"s","e":"Hardware = matériel ; software = logiciel."},{"id":"2021-1-105","s":"2021-1","n":105,"d":"NUM","q":"Qu'appelle-t-on un spam ?","o":["Un programme malveillant","Un courriel indésirable","Un dysfonctionnement informatique"],"a":1,"c":"s","e":"Un spam est un courriel indésirable, souvent publicitaire."},{"id":"2021-1-106","s":"2021-1","n":106,"d":"NUM","q":"Que signifie le \"www\" précédant la plupart des adresses URL sur internet ?","o":["Web World Wide","World With Web","World Wide Web"],"a":2,"c":"s","e":"WWW = World Wide Web."},{"id":"2021-1-107","s":"2021-1","n":107,"d":"NUM","q":"Vous rédigez un courriel avec des destinataires en \"Cci\". Que désigne ce champ ?","o":["Les destinataires invisibles pour les autres destinataires","Le destinataire principal","Les destinataires secondaires, en copie du courriel"],"a":0,"c":"s","e":"Cci (copie carbone invisible) : les destinataires ne sont pas visibles des autres."},{"id":"2021-1-108","s":"2021-1","n":108,"d":"NUM","q":"Que signifie « l'erreur 404 » dans le protocole de communication http sur le réseau internet ?","o":["La ressource n'existe pas à l'adresse demandée","L'accès à la ressource est soumis à autorisation","La ressource a été déplacée vers une nouvelle adresse"],"a":0,"c":"s","e":"Erreur 404 : ressource introuvable. 403 = accès interdit ; 301 = ressource déplacée."},{"id":"2021-1-109","s":"2021-1","n":109,"d":"NUM","q":"Lors de leur navigation, les internautes laissent des traces informatiques. Cet ensemble d'informations est recueilli à l'aide d'un témoin de connexion appelé :","o":["tracker","cookie","data compileur"],"a":1,"c":"s","e":"Le cookie (« témoin de connexion ») est déposé sur le terminal lors de la navigation."},{"id":"2021-1-110","s":"2021-1","n":110,"d":"NUM","q":"Un proxy est :","o":["un serveur qui fait l'intermédiaire entre un réseau local privé et le réseau internet","un câble permettant de brancher son ordinateur sur le réseau internet","un code qui permet de savoir à partir de quel ordinateur, dans quel pays, quelle ville, une connexion a été établie"],"a":0,"c":"s","e":"Un proxy est un serveur intermédiaire entre le réseau local et Internet."},{"id":"2021-1-111","s":"2021-1","n":111,"d":"NUM","q":"La désignation d'un délégué à la protection des données est-elle obligatoire au sein des organismes et autorités publics ?","o":["Non","Elle est fortement recommandée","Oui"],"a":2,"c":"s","e":"Art. 37 RGPD : la désignation d'un DPO est obligatoire pour les autorités et organismes publics."},{"id":"2021-1-112","s":"2021-1","n":112,"d":"NUM","q":"Le droit à la déconnexion est :","o":["la possibilité pour un employeur de mettre fin à la connexion sur internet d'un agent pour des motifs déontologiques","le droit pour un agent de ne pas être en permanence joignable pour des motifs liés à l'exécution de son travail","le droit pour un agent d'être en télétravail sans avoir accès systématiquement à un poste informatique"],"a":1,"c":"s","e":"Le droit à la déconnexion permet de ne pas être joignable en permanence pour le travail."},{"id":"2021-1-113","s":"2021-1","n":113,"d":"NUM","q":"Qu'est-ce que FranceConnect ?","o":["Une solution proposée par l'Etat pour sécuriser et simplifier la connexion à plus de 700 services en ligne","La plateforme d'accès à internet de la fonction publique d'Etat","Le réseau social des agents de la fonction publique d'Etat"],"a":0,"c":"s","e":"FranceConnect permet de se connecter à de nombreux services en ligne avec un identifiant existant (impots.gouv, Ameli…)."},{"id":"2021-1-114","s":"2021-1","n":114,"d":"NUM","q":"La loi « pour un Etat au service d'une société de confiance » reconnaît :","o":["le droit pour l'usager de démontrer la mauvaise foi de l'administration","l'absence de sanction lors de la première erreur commise de mauvaise foi par l'usager","le principe \"dites-le nous une fois\", qui contribue à la réduction de la charge administrative pour les usagers en réduisant la redondance des informations demandées"],"a":2,"c":"s","e":"La loi ESSOC (2018) consacre le droit à l'erreur de bonne foi et le principe « Dites-le nous une fois ». A et B sont inversés sur la bonne ou mauvaise foi."},{"id":"2021-1-115","s":"2021-1","n":115,"d":"NUM","q":"En matière de communication des documents administratifs, l'administration doit :","o":["assurer le droit d'accès aux documents inachevés","assurer la diffusion des documents autorisés sans masquer aucune information","assurer le droit d'accès aux documents rattachés à une décision définitive et non couverte par un secret protégé"],"a":2,"c":"s","e":"Le droit d'accès (CRPA) porte sur les documents achevés, non préparatoires et non couverts par un secret protégé."},{"id":"2021-1-116","s":"2021-1","n":116,"d":"NUM","q":"Où trouve-t-on sur internet les offres d'emploi de la fonction publique ?","o":["Sur le site \"Priorité à l'emploi public\", qui publie les postes vacants ou susceptibles d'être vacants destinés aux trois catégories d'agents","Sur le site \"Place de l'emploi public\" qui affiche les offres d'emploi des trois fonctions publiques","Sur le site \"Place des emplois publics\" qui rend visible les offres destinées aussi bien aux titulaires qu'aux contractuels de la fonction publique d'Etat."],"a":1,"c":"s","e":"La « Place de l'emploi public » (PEP) diffuse les offres des trois versants de la fonction publique."},{"id":"2021-1-117","s":"2021-1","n":117,"d":"NUM","q":"Vous êtes en poste au sein de la direction des sécurités d'une préfecture. La mairie du chef-lieu de département vous fait part de son souhait de mettre en place, au sein de sa commune, un système de vidéoprotection associé à un dispositif de reconnaissance faciale. Vous informez votre interlocuteur que ce dernier dispositif :","o":["peut être déployé après une simple délibération du conseil municipal","peut seulement faire l'objet d'une expérimentation strictement encadrée","est strictement interdit"],"a":1,"c":"p","e":"Aucun cadre légal n'autorise la reconnaissance faciale en vidéoprotection. La CNIL n'admet que des expérimentations très encadrées."},{"id":"2021-1-118","s":"2021-1","n":118,"d":"NUM","q":"Quel est l'objectif du programme « Tech.gouv » ?","o":["Accélérer la transformation numérique du service public","Renforcer la coordination entre les acteurs de la cybersécurité en Europe","Déployer la 5e génération des standards pour la téléphonie mobile"],"a":0,"c":"s","e":"TECH.GOUV (DINUM, 2019) vise à accélérer la transformation numérique du service public."},{"id":"2021-1-119","s":"2021-1","n":119,"d":"NUM","q":"Qui est concerné par le règlement général sur la protection des données ?","o":["Tous les organismes établis seulement sur le territoire de l'Union européenne dont l'activité cible directement les résidents européens","Tous les organismes établis n'importe où dans le monde","Tous les organismes établis sur le territoire de l'Union européenne et tous les organismes implantés hors de l'Union européenne dont l'activité cible directement les résidents européens"],"a":2,"c":"s","e":"Art. 3 RGPD : organismes établis dans l'UE et organismes hors UE ciblant des résidents européens."},{"id":"2021-1-120","s":"2021-1","n":120,"d":"NUM","q":"L'illectronisme est :","o":["la difficulté ou l'incapacité que rencontre une personne à utiliser les appareils numériques et outils informatiques","le refus d'un agent public d'utiliser une application électronique","le fait pour un usager de ne pas avoir accès aux démarches administratives électroniques"],"a":0,"c":"s","e":"L'illectronisme est la difficulté ou l'incapacité à utiliser les outils numériques."},{"id":"2021-2-1","s":"2021-2","n":1,"d":"CAJ","q":"Culture numérique : ....................................................................... 20 questions (n° 101 à 120) Pour chaque question, une seule réponse est possible. La réponse est apportée sur la grille en cochant la case (A., B. ou C.) correspondant au choix du candidat. Barème : Bonne réponse : .................... +1 point Mauvaise réponse : ............... -0,5 point","o":["bstention : ........................... 0 point TRÈS IMPORTANT ● Aucun document n'est autorisé durant cette épreuve. ● Avant de commencer cette épreuve, il vous est recommandé de vérifier le sujet et, le cas échéant, de signaler immédiatement aux surveillants toute anomalie (page manquante, document illisible, etc.). ● Les réponses aux questions doivent être complétées sur la grille dédiée, qui seule sera corrigée. Il est interdit aux candidats de signer la grille ou d'y mettre un signe quelconque pouvant en indiquer la provenance. ● Il est interdit aux candidats de signer leur composition ou d'y mettre un signe quelconque pouvant indiquer la provenance de la copie (exemples non limitatifs : identité, initiales, n° de candidat ou d'anonymat, lieu du centre d'épreuves, signature). 1. Les mesures d'ordre intérieur sont en principe : A. susceptibles de recours pour excès de pouvoir","insusceptibles de recours pour excès de pouvoir","susceptibles de recours judiciaire"],"a":1,"c":"s","e":"Les mesures d'ordre intérieur (MOI) sont en principe insusceptibles de REP, car elles ne font pas grief. La jurisprudence en a réduit le champ (Marie, Hardouin 1995)."},{"id":"2021-2-2","s":"2021-2","n":2,"d":"CAJ","q":"Le conflit négatif d'attribution oppose :","o":["un ordre de juridiction se déclarant compétent et un autre ordre de juridiction se déclarant incompétent","deux ordres de juridiction se déclarant chacun compétent","deux ordres de juridiction se déclarant chacun incompétent"],"a":2,"c":"s","e":"Conflit négatif : les deux ordres de juridiction se déclarent chacun incompétents. Le Tribunal des conflits tranche."},{"id":"2021-2-3","s":"2021-2","n":3,"d":"CAJ","q":"Comment étaient appelés les rapporteurs publics devant les juridictions administratives jusqu'en 2009 ?","o":["Les commissaires de la République","Les commissaires du Gouvernement","Les commissaires de la loi"],"a":1,"c":"s","e":"Le rapporteur public s'appelait « commissaire du Gouvernement » jusqu'au décret de 2009."},{"id":"2021-2-4","s":"2021-2","n":4,"d":"CAJ","q":"En matière de contentieux administratif :","o":["le juge dirige seul l'instruction","la procédure est orale","la procédure n'est pas contradictoire"],"a":0,"c":"s","e":"La procédure administrative est inquisitoire (le juge dirige l'instruction), écrite et contradictoire."},{"id":"2021-2-5","s":"2021-2","n":5,"d":"CAJ","q":"La procédure consultative consiste à :","o":["saisir la population par voie de référendum","recueillir l'avis de l'opposition","solliciter l'avis d'une autorité individuelle ou d'un organisme avant de prendre une décision"],"a":2,"c":"s","e":"La procédure consultative consiste à solliciter l'avis d'un organisme ou d'une autorité avant de décider."},{"id":"2021-2-6","s":"2021-2","n":6,"d":"CAJ","q":"Travaillant dans un service de ressources humaines, vous êtes consulté par un agent qui souhaite savoir s'il peut exercer librement une activité de photographe au titre des œuvres de l'esprit, vous lui répondez :","o":["qu'il peut être photographe professionnel pour des mariages, baptêmes et pour diverses soirées événementielles","que les activités artistiques (un photographe qui photographie les montagnes, un illustrateur qui expose dans des galeries d'art...) relèvent du régime de libre exercice des œuvres de l'esprit","qu'aucune activité au titre des œuvres de l'esprit ne lui est permise par le code de la propriété intellectuelle"],"a":1,"c":"s","e":"La production d'œuvres de l'esprit (art, photo artistique) est libre. Une activité de photographe de mariages est une activité commerciale soumise au régime du cumul."},{"id":"2021-2-7","s":"2021-2","n":7,"d":"CAJ","q":"Quel est le principe évoqué par le Conseil d'Etat le 28 mai 1954 dans l'affaire Barel ?","o":["Le principe de continuité du service public","Le principe d'égal accès aux emplois publics","Le principe de liberté d'aller et de venir"],"a":1,"c":"s","e":"CE Ass. 1954 Barel : on ne peut écarter un candidat de l'ENA pour ses opinions politiques (égal accès aux emplois publics)."},{"id":"2021-2-8","s":"2021-2","n":8,"d":"CAJ","q":"Lorsqu'une demande est adressée à une administration incompétente, cette dernière :","o":["doit la transmettre à l'administration compétente et en aviser l'auteur","doit la retourner à son auteur","doit la classer purement et simplement"],"a":0,"c":"s","e":"Art. L. 114-2 CRPA : l'administration incompétente transmet la demande à l'autorité compétente et en avise l'intéressé."},{"id":"2021-2-9","s":"2021-2","n":9,"d":"CAJ","q":"Par principe, le silence gardé pendant deux mois par l'administration :","o":["vaut décision de rejet","vaut décision d'acceptation","oblige le demandeur à réitérer sa requête"],"a":1,"c":"s","e":"Depuis la loi du 12 novembre 2013, le silence gardé 2 mois vaut acceptation, sauf nombreuses exceptions (SVA)."},{"id":"2021-2-10","s":"2021-2","n":10,"d":"CAJ","q":"Quel juge est compétent pour connaître des actions en réparation de dommages causés par un véhicule administratif ?","o":["Le juge administratif ou le juge judiciaire, selon que le véhicule cause un dommage à une personne publique ou privée","Le juge administratif","Le juge judiciaire"],"a":2,"c":"s","e":"Loi du 31 décembre 1957 : le juge judiciaire est compétent pour les dommages causés par tout véhicule, y compris administratif."},{"id":"2021-2-11","s":"2021-2","n":11,"d":"CAJ","q":"Vous êtes un agent public d'une collectivité territoriale. Vous êtes amené à utiliser un véhicule de service. Vous est-il permis :","o":["de stationner ce véhicule de service près d'une plage durant vos vacances d'été","de l'utiliser lors d'un déplacement professionnel avec un ordre de mission","de garer le véhicule tous les soirs à votre domicile dans votre garage"],"a":1,"c":"s","e":"Un véhicule de service ne s'utilise que pour les besoins du service, avec un ordre de mission. Le remisage à domicile est soumis à autorisation."},{"id":"2021-2-12","s":"2021-2","n":12,"d":"CAJ","q":"Le code de la commande publique, en vigueur depuis le 1er janvier 2019, régit :","o":["tous les contrats administratifs publics","les contrats à titre onéreux d'opérateurs privés","les marchés publics, les concessions et autres contrats publics mixtes"],"a":2,"c":"s","e":"Le code de la commande publique (1er avril 2019) régit marchés publics, concessions et autres contrats de la commande publique."},{"id":"2021-2-13","s":"2021-2","n":13,"d":"CAJ","q":"À quel grand principe du service public la décision du Conseil constitutionnel du 25 juillet 1979 a-t-elle reconnu une valeur constitutionnelle ?","o":["la continuité","l'égalité","la mutabilité"],"a":0,"c":"s","e":"Décision 79-105 DC du 25 juillet 1979 : la continuité du service public a valeur constitutionnelle."},{"id":"2021-2-14","s":"2021-2","n":14,"d":"CAJ","q":"Le fonctionnement du service public se caractérise notamment par :","o":["le principe de spécialité","le principe de protection","le principe de mutabilité"],"a":2,"c":"s","e":"La mutabilité (adaptabilité) est l'un des trois principes du service public (lois de Rolland)."},{"id":"2021-2-15","s":"2021-2","n":15,"d":"CAJ","q":"Vous êtes affecté(e) dans un centre des impôts. Un usager souhaite contester le montant de son assiette fiscale et vous demande comment procéder. Que devez-vous lui répondre ?","o":["Qu'il doit directement déposer un recours contentieux auprès du tribunal administratif","Qu'il doit, avant toute chose, formuler un recours administratif préalable auprès de son centre des impôts","Qu'en matière fiscale, il n'y a pas de contentieux possible"],"a":1,"c":"s","e":"En matière fiscale, une réclamation préalable auprès de l'administration est obligatoire avant tout recours contentieux (LPF)."},{"id":"2021-2-16","s":"2021-2","n":16,"d":"CAJ","q":"Vous êtes en poste au sein d'une direction des collectivités locales d'une préfecture. Un candidat aux élections départementales vous contacte afin de connaître la réglementation sur les conditions d'éligibilité. Vous informez votre interlocuteur que :","o":["le candidat doit avoir 20 ans révolus","le candidat doit être domicilié dans le département ou y être inscrit au rôle des contributions directes","le candidat n'est pas obligé d'avoir la qualité d'électeur"],"a":1,"c":"s","e":"Éligibilité au conseil départemental : 18 ans, qualité d'électeur, domicile dans le département ou inscription au rôle d'une contribution directe."},{"id":"2021-2-17","s":"2021-2","n":17,"d":"CAJ","q":"La région :","o":["ne peut exercer de tutelle sur les collectivités de son ressort","exerce une tutelle sur les communes de son ressort","exerce une tutelle sur les départements de son ressort"],"a":0,"c":"s","e":"Art. 72 al. 5 C : aucune collectivité territoriale ne peut exercer une tutelle sur une autre."},{"id":"2021-2-18","s":"2021-2","n":18,"d":"CAJ","q":"Sous la Ve République, l'Assemblée nationale a été dissoute à :","o":["9 reprises","5 reprises","2 reprises"],"a":1,"c":"s","e":"À la date du sujet : 5 dissolutions (1962, 1968, 1981, 1988, 1997). Une 6e a eu lieu en juin 2024."},{"id":"2021-2-19","s":"2021-2","n":19,"d":"CAJ","q":"Qui négocie et ratifie les traités ?","o":["Le ministre des affaires étrangères","Le chef de l'Etat","Le Parlement"],"a":1,"c":"s","e":"Art. 52 C : le Président de la République négocie et ratifie les traités."},{"id":"2021-2-20","s":"2021-2","n":20,"d":"CAJ","q":"La Constitution de la Ve République a été adoptée par référendum le 28 septembre 1958. À quelle date a-t-elle été promulguée ?","o":["Le 4 octobre 1958","Le 7 novembre 1958","Le 6 décembre 1958"],"a":0,"c":"s","e":"La Constitution a été promulguée le 4 octobre 1958, d'où son nom."},{"id":"2021-2-21","s":"2021-2","n":21,"d":"CAJ","q":"L'indépendance de l'autorité judiciaire est garantie par :","o":["le Conseil constitutionnel","le Conseil d'Etat","le Président de la République"],"a":2,"c":"s","e":"Art. 64 C : le Président de la République est garant de l'indépendance de l'autorité judiciaire, assisté du CSM."},{"id":"2021-2-22","s":"2021-2","n":22,"d":"CAJ","q":"Quel élément du droit positif français définit ce qu'est une Constitution ?","o":["L'article 16 de la Déclaration des droits de l'homme et du citoyen","L'article 16 de la Constitution de 1958","Le préambule de la Constitution de 1946"],"a":0,"c":"s","e":"Art. 16 DDHC : « Toute société dans laquelle la garantie des droits n'est pas assurée, ni la séparation des pouvoirs déterminée, n'a point de Constitution »."},{"id":"2021-2-23","s":"2021-2","n":23,"d":"CAJ","q":"Élu dans le cadre d'une circonscription, chaque député, compte tenu de la mission de vote de la loi et de contrôle de l'action du Gouvernement dévolue à l'Assemblée nationale, a pour mission :","o":["de représenter le département où il a été élu","de représenter la Nation tout entière","de représenter sa circonscription d'élection"],"a":1,"c":"s","e":"Mandat national : le député représente la Nation tout entière."},{"id":"2021-2-24","s":"2021-2","n":24,"d":"CAJ","q":"Le régime politique français repose sur le principe :","o":["de la souveraineté des institutions","de la souveraineté populaire","de la souveraineté nationale"],"a":2,"c":"p","e":"Art. 3 C : « La souveraineté nationale appartient au peuple ». La France combine souveraineté nationale et exercice populaire ; la réponse attendue est la souveraineté nationale."},{"id":"2021-2-25","s":"2021-2","n":25,"d":"CAJ","q":"Qu'est-ce qu'une ordonnance ?","o":["Un acte pris seul par le Président de la République","Un acte pris par le Gouvernement en matière législative","Un acte pris par le Parlement contre le Gouvernement"],"a":1,"c":"s","e":"Art. 38 C : le Gouvernement, habilité par le Parlement, prend par ordonnance des mesures relevant du domaine de la loi."},{"id":"2021-2-26","s":"2021-2","n":26,"d":"CAJ","q":"La Charte de l'environnement de 2004, qui a introduit de nouveaux principes, droits et devoirs en matière d'environnement dans le droit français, possède une valeur :","o":["constitutionnelle","symbolique","législative"],"a":0,"c":"s","e":"La Charte de l'environnement fait partie du bloc de constitutionnalité (loi constitutionnelle de 2005)."},{"id":"2021-2-27","s":"2021-2","n":27,"d":"CAJ","q":"Les \"suffrages exprimés\" dans le système électoral français correspondent à :","o":["tous les bulletins, en dehors des bulletins blancs ou nuls","tous les bulletins, en dehors des bulletins nuls","tous les bulletins déposés dans l'urne"],"a":0,"c":"s","e":"Suffrages exprimés = bulletins valables, hors blancs et nuls (blancs décomptés à part depuis 2014)."},{"id":"2021-2-28","s":"2021-2","n":28,"d":"CAJ","q":"Selon l'article 7 de la Constitution, en cas d'empêchement du Président du Sénat, l'interim des fonctions de Président de la République est confié :","o":["au Président de l'Assemblée nationale","au Gouvernement","au garde des sceaux"],"a":1,"c":"s","e":"Art. 7 C : si le président du Sénat est lui-même empêché, l'intérim est exercé par le Gouvernement."},{"id":"2021-2-29","s":"2021-2","n":29,"d":"CAJ","q":"Dans la liste suivante, quel est l'acte dispensé du contreseing du Président de la République, ou pouvoir propre ?","o":["La nomination des hauts fonctionnaires","La nomination des ministres","La dissolution de l'Assemblée nationale"],"a":2,"c":"s","e":"La dissolution (art. 12) est un pouvoir propre dispensé de contreseing (art. 19). Les nominations sont contresignées."},{"id":"2021-2-30","s":"2021-2","n":30,"d":"CAJ","q":"Une proposition de résolution à l'Assemblée nationale :","o":["peut-être rectifiée à tout moment par son auteur","ne peut jamais être rectifiée par son auteur","ne peut plus être rectifiée par son auteur après inscription à l'ordre du jour"],"a":2,"c":"p","e":"Selon le règlement de l'Assemblée, l'auteur peut rectifier sa proposition de résolution jusqu'à son inscription à l'ordre du jour."},{"id":"2021-2-31","s":"2021-2","n":31,"d":"CAJ","q":"Quelles sont les quatre positions administratives prévues par le statut général de la fonction publique ?","o":["Activité ; détachement ; disponibilité ; congé parental","Activité ; détachement ; mise à disposition ; congé parental","Activité ; détachement ; mise à disposition ; retraite"],"a":0,"c":"s","e":"Positions statutaires : activité, détachement, disponibilité, congé parental. La mise à disposition est une modalité de la position d'activité."},{"id":"2021-2-32","s":"2021-2","n":32,"d":"CAJ","q":"Votre employeur public vous demande de lui rappeler l'obligation d'emploi des travailleurs handicapés, vous lui répondez que :","o":["cette obligation ne concerne que le secteur privé","tout employeur public occupant au moins 20 agents à temps plein ou leur équivalent est tenu d'employer 6 % de personnes handicapées sur l'effectif total des agents rémunérés","tout employeur public occupant au moins 20 agents à temps plein ou leur équivalent est tenu d'employer 3 % de personnes handicapées sur l'effectif total des agents rémunérés"],"a":1,"c":"s","e":"Obligation d'emploi (BOETH) : 6 % de l'effectif pour tout employeur public d'au moins 20 agents ETP."},{"id":"2021-2-33","s":"2021-2","n":33,"d":"CAJ","q":"Le détachement est la position du fonctionnaire qui :","o":["placé hors de son administration ou service d'origine, cesse de bénéficier, dans cette position, de ses droits à l'avancement et à la retraite","demeure dans son corps d'origine et continue à percevoir la rémunération correspondante, mais exerce des fonctions hors du service où il a vocation à servir","placé hors de son corps d'origine, continue à bénéficier, dans ce corps, de ses droits à l'avancement et à la retraite"],"a":2,"c":"s","e":"Le détachement place hors du corps d'origine, en conservant dans ce corps les droits à avancement et à retraite."},{"id":"2021-2-34","s":"2021-2","n":34,"d":"CAJ","q":"Vous êtes chef de service au ministère des armées. Un agent public vient vous faire part d'une agression sexuelle commise par un autre agent public, qui aurait tenté de l'embrasser contre son gré en le poussant contre un mur et en lui retenant les bras. L'enquête administrative fait apparaître que les faits sont avérés. Vous êtes tenu(e) de :","o":["faire un rappel à l'ordre aux deux agents d'autant plus qu'ils ont des relations amicales en dehors du travail","saisir le procureur de la République sur le fondement de l'article 40 du code de procédure pénale, ces faits pouvant constituer un délit","mettre un avertissement à l'agresseur présumé"],"a":1,"c":"s","e":"Une agression sexuelle est un délit : l'article 40 CPP impose d'aviser le procureur, sans préjudice de poursuites disciplinaires."},{"id":"2021-2-35","s":"2021-2","n":35,"d":"CAJ","q":"La loi n° 2019-828 du 6 août 2019 de transformation de la fonction publique prévoit :","o":["le maintien de deux instances indépendantes : le comité technique et le comité d'hygiène, de sécurité et des conditions de travail","la création de comités d'entreprise dans les administrations","la fusion du comité technique et du comité d'hygiène, de sécurité et des conditions de travail en un comité social d'administration"],"a":2,"c":"s","e":"La loi de 2019 fusionne CT et CHSCT dans le comité social d'administration (CSA)."},{"id":"2021-2-36","s":"2021-2","n":36,"d":"CAJ","q":"Au sens du statut général des fonctionnaires, le conflit d'intérêts est défini comme une situation d'interférence entre un intérêt public et des intérêts publics ou privés qui est de nature à influencer ou paraître influencer l'exercice indépendant, impartial et objectif des fonctions. Laquelle de ces situations constitue un conflit d'intérêts ?","o":["Un agent public participe à un
